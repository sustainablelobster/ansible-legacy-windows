---
- name: Start an isolated credential result record
  ansible.builtin.set_fact:
    credential_before: {}
    credential_after: {}
    credential_result: null
    credential_case_validated: false
  no_log: true

- name: Observe, capture, and validate the credential operation
  vars:
    credential_type_unavailable: >-
      {{ credential_case.params.type in credential_unavailable }}
    credential_expected: >-
      {{ credential_case | combine({
         'changed': false, 'failed': true, 'expected': {},
         'message': credential_case.message
         | default('Win32 Error Code 87: 0x00000057')
         }) if credential_type_unavailable else credential_case }}
    credential_capture_case:
      name: '{{ credential_case.name }}'
      check: '{{ credential_case.check | default(false) }}'
      validated: '{{ credential_case_validated }}'
      result: '{{ credential_result }}'
      before: >-
        {{ (credential_before.stdout | from_json)
           if (credential_before.rc | default(1)) == 0 else none }}
      after: >-
        {{ (credential_after.stdout | from_json)
           if (credential_after.rc | default(1)) == 0 else none }}
      before_command:
        rc: '{{ credential_before.rc | default(none) }}'
        stdout: '{{ credential_before.stdout | default("") }}'
        stderr: '{{ credential_before.stderr | default("") }}'
      after_command:
        rc: '{{ credential_after.rc | default(none) }}'
        stdout: '{{ credential_after.stdout | default("") }}'
        stderr: '{{ credential_after.stderr | default("") }}'
  block:
    - name: Independently observe owned credentials before the call
      sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
        argv:
          - '{{ ansible_python_interpreter }}'
          - '-'
          - '{{ credential_workspace.path }}'
          - observe
        stdin: '{{ credential_fixture }}'
      register: credential_before
      changed_when: false
      check_mode: false
      no_log: true

    - name: Retain success or failure of the public credential operation
      block:
        - name: Run the credential case # noqa: args[module]
          sustainablelobster.legacy_windows.win_credential: >-
            {{ credential_case.params }}
          register: credential_result
          check_mode: '{{ credential_case.check | default(false) }}'
          diff: true
          no_log: true
      rescue:
        - name: Defer expected-failure validation until after observation
          ansible.builtin.assert:
            that:
              - credential_result is failed
          no_log: true

    - name: Independently observe owned credentials after the call
      sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
        argv:
          - '{{ ansible_python_interpreter }}'
          - '-'
          - '{{ credential_workspace.path }}'
          - observe
        stdin: '{{ credential_fixture }}'
      register: credential_after
      changed_when: false
      check_mode: false
      no_log: true

    - name: Save complete private evidence before validating the public result
      ansible.builtin.copy:
        content: >-
          {{ credential_capture | combine({
             'results': credential_capture_results + [credential_capture_case]
             }) | to_nice_json }}
        dest: '{{ credential_capture_file.path }}'
        mode: '0600'
      delegate_to: localhost
      vars: &capture_connection
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
      changed_when: false
      no_log: true

    - name: Verify public results and native nonmutation where required
      ansible.builtin.assert:
        that:
          - credential_result.changed == credential_expected.changed
          - >-
            (credential_result is failed)
            == (credential_expected.failed | default(false))
          - >-
            (not (credential_case.check | default(false))
            and credential_expected.changed)
            or (credential_before.stdout | from_json)
            == (credential_after.stdout | from_json)
          - >-
            ((credential_after.stdout | from_json).unavailable[
            credential_case.params.type] == 87) if credential_type_unavailable
            else (((credential_after.stdout | from_json).targets[
            credential_case.params.type] is not none)
            == credential_expected.exists)
          - >-
            credential_expected.message | default('')
            in credential_result.msg | default('')
          - >-
            'Synthetic-Credential-Only-' not in (credential_result | to_json)
          - >-
            'U3ludGhldGljLVBJTi1Pbmx5' not in (credential_result | to_json)
      no_log: true

    - name: Verify expected native metadata and synthetic-secret equality
      ansible.builtin.assert:
        that:
          - >-
            (credential_after.stdout | from_json).targets[
            credential_case.params.type][item.key] == item.value
      loop: '{{ credential_expected.expected | default({}) | dict2items }}'
      no_log: true

    - name: Record successful credential case validation
      ansible.builtin.set_fact:
        credential_case_validated: true
      no_log: true
  always:
    - name: Retain the current case even when observation or validation failed
      ansible.builtin.set_fact:
        credential_capture_results: >-
          {{ credential_capture_results + [credential_capture_case] }}
      no_log: true

    - name: Save private credential case and validation evidence
      ansible.builtin.copy:
        content: '{{ credential_capture | to_nice_json }}'
        dest: '{{ credential_capture_file.path }}'
        mode: '0600'
      delegate_to: localhost
      vars: *capture_connection
      changed_when: false
      no_log: true
