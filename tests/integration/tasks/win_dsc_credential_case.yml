---
- name: Observe native state before this credentialed resource call
  sustainablelobster.legacy_windows.win_command:
    argv: ['{{ ansible_python_interpreter }}', '-',
           '{{ dsc_credential_workspace.path }}', observe]
    stdin: '{{ dsc_credential_program }}'
  register: dsc_credential_before
  changed_when: false
  no_log: true

- name: Bind the complete credentialed Script resource request
  vars:
    audit_path: '{{ dsc_credential_workspace.path }}\audit.jsonl'
    managed_path: '{{ dsc_credential_workspace.path }}\managed.txt'
    # Deliberately secret-bearing diagnostics exercise public redaction.
    # Quiet cases omit them and use a fresh password to test credential storage.
    marker_path: '{{ dsc_credential_workspace.path }}\marker.txt'
    desired: '{{ dsc_credential_case.desired | default("alpha") }}'
    credential_secret: >-
      {{ dsc_credential_fresh_password
         if dsc_credential_case.fresh_credential | default(false)
         else dsc_credential_wrong_password
         if dsc_credential_case.wrong_password | default(false)
         else dsc_credential_password }}
    secret_diagnostics: >-
      $marker = [IO.File]::ReadAllText('{{ marker_path }}');
      Write-Verbose -Verbose ('Owned DSC credential stream ' + $marker);
      Write-Warning ('Owned DSC credential warning ' + $marker);
    common: >-
      $identity = [Security.Principal.WindowsIdentity]::GetCurrent();
      {{ secret_diagnostics
         if dsc_credential_case.emit_secret_diagnostics | default(true)
         else "" }}
    audit: >-
      [IO.File]::AppendAllText('{{ audit_path }}',
      ((@{method=$method;sid=$identity.User.Value;name=$identity.Name}
      | ConvertTo-Json -Compress) + [Environment]::NewLine));
    test_script: >-
      {{ common }} $method = 'Test'; {{ audit }}
      {{ "throw ('Owned Test failure ' + $marker);"
         if dsc_credential_case.fail_test | default(false) else "" }}
      return ([IO.File]::Exists('{{ managed_path }}') -and
      [IO.File]::ReadAllText('{{ managed_path }}') -ceq '{{ desired }}');
    set_script: >-
      {{ common }} $method = 'Set'; {{ audit }}
      {{ "throw ('Owned Set failure ' + $marker);"
         if dsc_credential_case.fail_set | default(false) else "" }}
      [IO.File]::WriteAllText('{{ managed_path }}', '{{ desired }}');
  ansible.builtin.set_fact:
    dsc_credential_params: >-
      {{ {'resource_name': 'Script',
          'GetScript': '@{Result="Owned credentialed DSC probe"}',
          'TestScript': test_script, 'SetScript': set_script,
          dsc_credential_property + '_username':
            '.\\' + dsc_credential_username,
          dsc_credential_property + '_password': credential_secret} }}
  no_log: true

- name: Retain the literal sanitized result including expected failures
  block:
    - name: Invoke the public credential-bearing classic DSC interface
        # noqa: args[module]
      sustainablelobster.legacy_windows.win_dsc: '{{ dsc_credential_params }}'
      check_mode: '{{ dsc_credential_case.check | default(false) }}'
      register: dsc_credential_result
      no_log: true
  rescue:
    - name: Retain the expected resource failure for explicit verification
      ansible.builtin.debug:
        msg: Credentialed DSC failure retained privately for verification.

- name: Observe independent native effects and actual resource identities
  sustainablelobster.legacy_windows.win_command:
    argv: ['{{ ansible_python_interpreter }}', '-',
           '{{ dsc_credential_workspace.path }}', observe]
    stdin: '{{ dsc_credential_program }}'
  register: dsc_credential_after
  changed_when: false
  no_log: true

- name: Retain the raw result without credential-bearing request properties
  ansible.builtin.set_fact:
    dsc_credential_record:
      property: '{{ dsc_credential_property }}'
      case: '{{ dsc_credential_case }}'
      result: '{{ dsc_credential_result }}'
      before: '{{ dsc_credential_before }}'
      after: '{{ dsc_credential_after }}'
      validated: false
  no_log: true

- name: Preserve each outcome before checking its behavioral assertions
  ansible.builtin.set_fact:
    dsc_credential_records: >-
      {{ dsc_credential_records + [dsc_credential_record] }}
  no_log: true

- name: Verify identity methods preview preservation and secret redaction
  vars:
    before: '{{ dsc_credential_before.stdout | from_json }}'
    after: '{{ dsc_credential_after.stdout | from_json }}'
    new_audit: '{{ after.audit[before.audit | length :] }}'
    serialized: '{{ dsc_credential_result | to_json }}'
  ansible.builtin.assert:
    that:
      - >-
        dsc_credential_result.changed ==
        (dsc_credential_case.changed | default(false))
      - >-
        (dsc_credential_result is failed) ==
        (dsc_credential_case.failed | default(false))
      - >-
        new_audit | map(attribute='method') | list ==
        dsc_credential_case.methods
      - >-
        new_audit | rejectattr('sid', 'equalto', dsc_credential_account.sid) |
        list | length == 0
      - dsc_credential_password not in serialized
      - dsc_credential_wrong_password not in serialized
      - dsc_credential_fresh_password not in serialized
      - >-
        (not dsc_credential_case.check | default(false) and
         dsc_credential_result.changed) or after.managed == before.managed
      - >-
        dsc_credential_case.check | default(false) or
        dsc_credential_case.failed | default(false) or
        after.managed.body ==
        (dsc_credential_case.desired | default('alpha') | b64encode)
      - >-
        not dsc_credential_case.emit_secret_diagnostics | default(true) or
        dsc_credential_case.wrong_password | default(false) or
        'VALUE_SPECIFIED_IN_NO_LOG_PARAMETER' in
        (dsc_credential_result.warnings | default([]) | to_json)
      - >-
        not dsc_credential_case.emit_secret_diagnostics | default(true) or
        dsc_credential_case.wrong_password | default(false) or
        'VALUE_SPECIFIED_IN_NO_LOG_PARAMETER' in
        (dsc_credential_result.verbose_test | default([]) | to_json)
      - >-
        not dsc_credential_case.emit_secret_diagnostics | default(true) or
        'Set' not in dsc_credential_case.methods or
        'VALUE_SPECIFIED_IN_NO_LOG_PARAMETER' in
        (dsc_credential_result.verbose_set | default([]) | to_json)
  no_log: true

- name: Mark only a fully verified credential-bearing resource case
  ansible.builtin.set_fact:
    dsc_credential_records: >-
      {{ dsc_credential_records[:-1] +
         [dsc_credential_record | combine({'validated': true})] }}
  no_log: true
