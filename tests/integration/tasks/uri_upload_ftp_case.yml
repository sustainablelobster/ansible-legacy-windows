- name: Select enabled request implementations
  ansible.builtin.include_tasks: uri_upload_ftp_request.yml
  loop: >-
    {{ (['upstream'] if uri_upload_include_upstream | bool else []) +
       (['native'] if uri_upload_run_native | bool else []) }}
  loop_control:
    loop_var: uri_upload_engine
    label: '{{ uri_upload_engine }}'
