---
- name: Exercise the public unavailable-record-provider boundary
  block:
    - name: Request the public native DNS record interface
      sustainablelobster.legacy_windows.win_dns_record:
        name: record
        zone: "dns-provider-boundary-{{ inventory_hostname }}.invalid"
        type: A
        value: >-
          {{ '192.0.2.1' if dns_zone_boundary_case.state == 'present'
          else omit }}
        state: "{{ dns_zone_boundary_case.state }}"
      check_mode: "{{ dns_zone_boundary_case.check }}"
      register: dns_zone_boundary_result
  rescue:
    - name: Retain the expected missing-record-provider failure
      ansible.builtin.set_fact:
        dns_zone_boundary_failed: true

- name: Retain the complete result before validation
  ansible.builtin.set_fact:
    dns_zone_boundary_results: >-
      {{ dns_zone_boundary_results | default([]) +
         [{'request': dns_zone_boundary_case,
           'result': dns_zone_boundary_result}] }}

- name: Require an actionable unavailable-provider failure before record writes
  ansible.builtin.assert:
    that:
      - dns_zone_boundary_result is failed
      - not dns_zone_boundary_result.changed
      - >-
        'Windows DNS Server record management provider is unavailable
        (ROOT\\Microsoft\\Windows\\Dns).' in dns_zone_boundary_result.msg
      - dns_zone_boundary_result.warnings | default([]) == []
