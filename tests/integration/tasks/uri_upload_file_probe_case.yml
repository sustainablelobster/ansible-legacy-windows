- name: Set an identical owned file baseline
  sustainablelobster.legacy_windows.win_copy:
    content: baseline
    dest: '{{ uri_upload_file_workspace.path }}\upload.bin'

- name: Remove baseline for an explicitly new-file case
  when: uri_upload_file_case.missing | default(false)
  sustainablelobster.legacy_windows.win_file:
    path: '{{ uri_upload_file_workspace.path }}\upload.bin'
    state: absent

- name: Capture the released module result even after a response failure
  ansible.windows.win_uri:
    url: >-
      {{ 'file:///' + (uri_upload_file_workspace.path |
         replace('\\', '/')) + '/upload.bin' }}
    method: '{{ uri_upload_file_case.method }}'
    body: '{{ uri_upload_file_case.body | default(omit) }}'
    status_code: '{{ uri_upload_file_case.status | default([200]) }}'
    return_content: true
    use_proxy: false
    url_timeout: 10
  vars:
    ansible_shell_type: cmd
    ansible_remote_tmp: '{{ uri_upload_file_workspace.path }}'
  check_mode: '{{ uri_upload_file_case.check | default(false) }}'
  register: uri_upload_file_original
  ignore_errors: true
  no_log: true

- name: Independently read exact file bytes after the request
  sustainablelobster.legacy_windows.slurp:
    src: '{{ uri_upload_file_workspace.path }}\upload.bin'
  register: uri_upload_file_after
  ignore_errors: true
  no_log: true

- name: Retain the unmodified result and independent bytes
  ansible.builtin.set_fact:
    uri_upload_file_observations: >-
      {{ uri_upload_file_observations + [
           {'case': uri_upload_file_case, 'result': uri_upload_file_original,
            'after': uri_upload_file_after}] }}
  no_log: true
