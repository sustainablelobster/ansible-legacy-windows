---
- name: Verify DHCP Server records in an isolated inactive scope and recover
    them
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/dhcp_lease.yml
    - vars/dhcp_lease_fixture.yml
    - vars/dhcp_lease_classic_fixture.yml
  tasks:
    - name: Create the private local evidence directory before guest mutation
      when:
        - evidence_dir is defined
        - >-
          (evidence_dir | realpath) not in [('/tmp' | realpath),
          (lookup('env', 'TMPDIR') | default('/tmp', true) | realpath)]
      ansible.builtin.file:
        path: '{{ evidence_dir }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'

    - name: Require actual Python 3.4.4 and record original staging entries
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob,json,os,sys,tempfile;
        assert sys.version_info[:3] == (3,4,4);
        print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
        'ansible-tmp-*')))))""
      register: dhcp_staging_before
      changed_when: false

    - name: Allocate unique private evidence capture before guest writes
      ansible.builtin.tempfile:
        state: file
        path: >-
          {{ evidence_dir | default(lookup('env', 'TMPDIR') |
          default('/tmp', true)) }}
        prefix: "dhcp-{{ inventory_hostname }}-"
        suffix: .json
      register: dhcp_capture
      delegate_to: localhost

    - name: Exercise records with journaled cleanup
      block:
        - name: Allocate an owned recovery workspace
          sustainablelobster.legacy_windows.win_tempfile: # noqa: args[module]
            state: directory
            prefix: legacy-windows-dhcp-
          register: dhcp_workspace

        - name: Journal original state and establish the inactive owned scope
          sustainablelobster.legacy_windows.win_command: # noqa: args[module]
            argv:
              - "{{ ansible_python_interpreter }}"
              - "-"
              - "{{ dhcp_workspace.path }}"
              - setup
            stdin: "{{ dhcp_lease_fixture }}"
          register: dhcp_setup
          changed_when: true
          no_log: true

        - name: Record fixture addresses from independently observed setup
          ansible.builtin.set_fact:
            dhcp_scope: "{{ (dhcp_setup.stdout | from_json).scope }}"
            dhcp_ip: "{{ (dhcp_setup.stdout | from_json).ip }}"

        - name: Exercise each declared record request and optional source
            comparison
          ansible.builtin.include_tasks: tasks/win_dhcp_lease_case.yml
          loop: >-
            {{ (dhcp_classic_cases if dhcp_use_classic_fixture | default(false)
               else dhcp_cases)[dhcp_case_start | int :] |
               product(["native", "original"] if dhcp_compare else ["native"])
               | list }}
          loop_control:
            loop_var: dhcp_case_phase
            label: "{{ dhcp_case_phase[0].name }} / {{ dhcp_case_phase[1] }}"
          vars:
            dhcp_case: "{{ dhcp_case_phase[0] }}"
            dhcp_phase: "{{ dhcp_case_phase[1] }}"
      always:
        - name: Recover only the journal-owned scope and require exact protected
            state
          sustainablelobster.legacy_windows.win_command: # noqa: args[module]
            argv:
              - "{{ ansible_python_interpreter }}"
              - "-"
              - "{{ dhcp_workspace.path }}"
              - cleanup
            stdin: "{{ dhcp_lease_fixture }}"
          register: dhcp_recovery
          changed_when: true
          failed_when: false
          no_log: true
          when: dhcp_workspace.path is defined

        - name: Retain raw requests observations and recovery even after failure
          ansible.builtin.copy:
            content: >-
              {{ {'setup': dhcp_setup | default({}),
                  'workspace': dhcp_workspace.path | default(none),
                  'records': dhcp_results | default([]),
                  'interrupted_result': dhcp_case_result | default({}),
                  'interrupted_observation': dhcp_case_after | default({}),
                  'recovery': dhcp_recovery | default({}),
                  'staging_before': dhcp_staging_before} | to_nice_json }}
            dest: "{{ dhcp_capture.path }}"
            mode: "0600"
          delegate_to: localhost

        - name: Require successful literal restoration before discarding
            recovery data
          ansible.builtin.assert:
            that:
              - dhcp_recovery.rc == 0
              - (dhcp_recovery.stdout | from_json).restored
              - (dhcp_recovery.stdout | from_json).original ==
                (dhcp_recovery.stdout | from_json).final
          when: dhcp_workspace.path is defined

        - name: Remove only the verified recovery workspace
          sustainablelobster.legacy_windows.win_file: # noqa: args[module]
            path: "{{ dhcp_workspace.path }}"
            state: absent
          when: dhcp_workspace.path is defined

        - name: Verify owned workspace absence and original staging equality
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,sys,tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
            'ansible-tmp-*')))))" "{{ dhcp_workspace.path }}""
          register: dhcp_staging_after
          changed_when: false
          when: dhcp_workspace.path is defined

        - name: Require exact staging recovery
          ansible.builtin.assert:
            that:
              - (dhcp_staging_before.stdout | from_json) ==
                (dhcp_staging_after.stdout | from_json)
          when: dhcp_workspace.path is defined

        - name: Retain verified final workspace and staging cleanup
          ansible.builtin.copy:
            content: >-
              {{ {'setup': dhcp_setup | default({}),
                  'workspace': dhcp_workspace.path | default(none),
                  'records': dhcp_results | default([]),
                  'recovery': dhcp_recovery | default({}),
                  'staging_before': dhcp_staging_before,
                  'staging_after': dhcp_staging_after | default({}),
                  'workspace_removed': true} | to_nice_json }}
            dest: "{{ dhcp_capture.path }}"
            mode: "0600"
          delegate_to: localhost
