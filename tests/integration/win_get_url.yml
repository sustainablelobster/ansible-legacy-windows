---
- name: Verify Windows downloads, public source behavior and owned cleanup
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/get_url.yml
    - vars/get_url_fixture.yml
  vars:
    get_url_selected_cases: >-
      {{ get_url_cases[get_url_case_start | default(0) | int:] +
         (get_url_tls_cases if get_url_tls | default(false) | bool else []) }}
  tasks:
    - name: Require actual Python 3.4.4 and record original staging
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob,json,os,sys,tempfile;
        assert sys.version_info[:3] == (3,4,4);
        print(json.dumps(sorted(glob.glob(os.path.join(
        tempfile.gettempdir(),'ansible-tmp-*')))))""
      register: get_url_staging_before
      changed_when: false

    - name: Allocate private controller evidence
      ansible.builtin.tempfile:
        state: file
        path: '{{ playbook_dir }}/../../tmp'
        prefix: 'get-url-{{ inventory_hostname }}-'
        suffix: .json
      register: get_url_capture
      delegate_to: localhost
      vars: &local
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
      changed_when: false

    - name: Initialize complete case evidence
      ansible.builtin.set_fact:
        get_url_results: []

    - name: Load explicitly supplied original public reference
      when: get_url_reference_capture is defined
      ansible.builtin.set_fact:
        get_url_reference: >-
          {{ lookup('ansible.builtin.file', get_url_reference_capture,
                    rstrip=false) |
             from_json }}
        get_url_reference_sha256: >-
          {{ lookup('ansible.builtin.file', get_url_reference_capture,
                    rstrip=false) |
             hash('sha256') }}
      no_log: true

    - name: Require complete uniquely named validated reference records
      when: get_url_reference_capture is defined
      ansible.builtin.assert:
        that:
          - not get_url_compare | default(false) | bool
          - get_url_reference.results | length > 0
          - >-
            get_url_reference.results | map(attribute='name') | unique |
            length == get_url_reference.results | length
          - >-
            get_url_reference.results |
            rejectattr('validated', 'equalto', true) | list | length == 0

    - name: Exercise public downloads inside one owned disposable workspace
      block:
        - name: Allocate owned controller TLS material
          when: get_url_tls | default(false) | bool
          ansible.builtin.tempfile:
            state: directory
            path: '{{ playbook_dir }}/../../tmp'
            prefix: get-url-tls-
          register: get_url_tls_workspace
          delegate_to: localhost
          vars: *local
          changed_when: false

        - name: Generate disposable TLS fixture certificate with pinned OpenSSL
          when: get_url_tls | default(false) | bool
          ansible.builtin.command:
            argv:
              - openssl
              - req
              - -x509
              - -newkey
              - rsa:2048
              - -nodes
              - -days
              - '1'
              - -subj
              - /CN=localhost
              - -addext
              - subjectAltName=DNS:localhost,IP:127.0.0.1
              - -keyout
              - '{{ get_url_tls_workspace.path }}/server-key.pem'
              - -out
              - '{{ get_url_tls_workspace.path }}/server-cert.pem'
          delegate_to: localhost
          vars: *local
          changed_when: false

        - name: Read only disposable TLS fixture certificate and key
          when: get_url_tls | default(false) | bool
          ansible.builtin.slurp:
            src: '{{ get_url_tls_workspace.path }}/server-{{ item }}.pem'
          loop: [cert, key]
          register: get_url_tls_files
          delegate_to: localhost
          vars: *local
          no_log: true
          changed_when: false

        - name: Bind optional disposable TLS fixture material
          ansible.builtin.set_fact:
            get_url_tls_material: >-
              {{ {'cert': get_url_tls_files.results[0].content,
                  'key': get_url_tls_files.results[1].content}
                 if get_url_tls | default(false) | bool else {} }}
          no_log: true

        - name: Allocate owned workspace  # noqa: args[module]
          sustainablelobster.legacy_windows.win_tempfile:
            state: directory
            prefix: legacy-windows-get-url-
          register: get_url_workspace

        - name: Start owned HTTP fixture  # noqa: args[module]
          sustainablelobster.legacy_windows.win_command:
            argv: >-
              {{ [ansible_python_interpreter, '-', get_url_workspace.path,
                  'setup'] +
                 ([get_url_tls_material | to_json | b64encode]
                  if get_url_tls | default(false) | bool else []) }}
            stdin: '{{ get_url_program }}'
          register: get_url_setup
          changed_when: false
          no_log: true

        - name: Bind independent fixture metadata
          ansible.builtin.set_fact:
            get_url_setup_data: '{{ get_url_setup.stdout | from_json }}'

        - name: Exercise the complete declared public matrix
          ansible.builtin.include_tasks: tasks/win_get_url_case.yml
          loop: '{{ get_url_selected_cases }}'
          loop_control:
            loop_var: get_url_case
            label: '{{ get_url_case.name }}'
      always:
        - name: Retain complete raw evidence before cleanup
          ansible.builtin.copy:
            content: >-
              {{ {'results': get_url_results,
                  'setup': get_url_setup | default(none),
                  'workspace': get_url_workspace | default(none),
                  'reference_capture':
                    get_url_reference_capture | default(none),
                  'reference_sha256': get_url_reference_sha256 | default(none),
                  'staging_before': get_url_staging_before} | to_nice_json }}
            dest: '{{ get_url_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

        - name: Verify owned fixture recovery  # noqa: args[module]
          when: get_url_workspace.path is defined
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ get_url_workspace.path }}', cleanup]
            stdin: '{{ get_url_program }}'
          register: get_url_recovery
          changed_when: false
          no_log: true

        - name: Require exact observed recovery and process termination
          ansible.builtin.assert:
            that:
              - (get_url_recovery.stdout | from_json).restored
              - (get_url_recovery.stdout | from_json).server_stopped

        - name: Finalize verified journal  # noqa: args[module]
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ get_url_workspace.path }}', finalize]
            stdin: '{{ get_url_program }}'
          changed_when: false
          no_log: true

        - name: Remove verified owned workspace  # noqa: args[module]
          sustainablelobster.legacy_windows.win_file:
            path: '{{ get_url_workspace.path }}'
            state: absent

        - name: Independently verify owned absence and original staging
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,sys,tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(
            tempfile.gettempdir(),'ansible-tmp-*')))))"
            "{{ get_url_workspace.path }}""
          register: get_url_staging_after
          changed_when: false

        - name: Require unchanged global staging
          ansible.builtin.assert:
            that:
              - >-
                get_url_staging_before.stdout | from_json ==
                get_url_staging_after.stdout | from_json

        - name: Retain final raw public, request, file and cleanup evidence
          ansible.builtin.copy:
            content: >-
              {{ {'results': get_url_results,
                  'setup': get_url_setup | default(none),
                  'workspace': get_url_workspace,
                  'recovery': get_url_recovery,
                  'reference_capture':
                    get_url_reference_capture | default(none),
                  'reference_sha256': get_url_reference_sha256 | default(none),
                  'staging_before': get_url_staging_before,
                  'staging_after': get_url_staging_after,
                  'workspace_absent': true} | to_nice_json }}
            dest: '{{ get_url_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

        - name: Remove only owned controller TLS material
          when: get_url_tls_workspace.path is defined
          ansible.builtin.file:
            path: '{{ get_url_tls_workspace.path }}'
            state: absent
          delegate_to: localhost
          vars: *local
          changed_when: false

        - name: Require complete declared and validated case evidence
          ansible.builtin.assert:
            that:
              - get_url_results | length == get_url_selected_cases | length
              - >-
                get_url_results | map(attribute='name') | sort ==
                get_url_selected_cases | map(attribute='name') | sort
              - >-
                get_url_results | selectattr('validated', 'equalto', true) |
                list | length == get_url_results | length
