---
- name: Verify WinHTTP changes and restore original WinHTTP and IE settings
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/http_proxy.yml
    - vars/http_proxy_fixture.yml
  tasks:
    - name: Require Python 3.4.4 and record existing task directories
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob, json, os, sys, tempfile;
        assert sys.version_info[:3] == (3, 4, 4);
        print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
        'ansible-tmp-*')))))""
      register: task_directories_before
      changed_when: false

    - name: Exercise proxy changes with a durable recovery journal
      block:
        - name: Allocate the recovery workspace
          sustainablelobster.legacy_windows.win_tempfile:  # noqa: args[module]
            state: directory
            prefix: legacy-windows-http-proxy-
          register: http_proxy_workspace
          check_mode: false

        - name: Journal original settings before establishing direct access
          sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-'
              - '{{ http_proxy_workspace.path }}'
              - setup
            stdin: '{{ http_proxy_fixture }}'
          register: http_proxy_setup
          changed_when: true
          check_mode: false

        - name: Retain the controlled initial native observation
          ansible.builtin.set_fact:
            http_proxy_initial: '{{ http_proxy_setup.stdout | from_json }}'
            http_proxy_previous: '{{ http_proxy_setup.stdout | from_json }}'

        - name: Exercise changes repeats check mode validation and IE import
          ansible.builtin.include_tasks: tasks/win_http_proxy_case.yml
          loop: '{{ range(http_proxy_cases | length) | list }}'
          loop_control:
            loop_var: http_proxy_case_index
          vars:
            http_proxy_case: '{{ http_proxy_cases[http_proxy_case_index] }}'
      always:
        - name: Restore original settings before removing recovery data
          when: http_proxy_workspace.path is defined
          block:
            - name: Restore and verify original settings  # noqa: args[module]
              sustainablelobster.legacy_windows.win_command:
                argv:
                  - '{{ ansible_python_interpreter }}'
                  - '-'
                  - '{{ http_proxy_workspace.path }}'
                  - cleanup
                stdin: '{{ http_proxy_fixture }}'
              register: http_proxy_restoration
              changed_when: true
              check_mode: false

            - name: Require verified restoration before discarding the journal
              ansible.builtin.assert:
                that:
                  - (http_proxy_restoration.stdout | from_json).restored

            - name: Remove only the verified recovery workspace
              sustainablelobster.legacy_windows.win_file:  # noqa: args[module]
                path: '{{ http_proxy_workspace.path }}'
                state: absent
              check_mode: false

        - name: Verify recovery-workspace and staging cleanup
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob, json, os, sys, tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
            'ansible-tmp-*')))))" "{{ http_proxy_workspace.path }}""
          when: http_proxy_workspace.path is defined
          register: task_directories_after
          changed_when: false
          check_mode: false

        - name: Require task-directory cleanup
          ansible.builtin.assert:
            that:
              - >-
                (task_directories_before.stdout | from_json) ==
                (task_directories_after.stdout | from_json)
          when: http_proxy_workspace.path is defined
