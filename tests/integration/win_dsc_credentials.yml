---
- name: Verify actual credentialed classic DSC identities and recovery
  hosts: legacy_windows
  gather_facts: false
  vars:
    dsc_credential_reboot_cleanup: false
    dsc_credential_program: >-
      {{ lookup('file', playbook_dir + '/fixtures/win_dsc_credentials.py') }}
    dsc_credential_cases:
      - {name: create preview, check: true, changed: true, methods: [Test]}
      - {name: create, changed: true, methods: [Test, Set]}
      - {name: repeat, methods: [Test]}
      - {name: unchanged preview, check: true, methods: [Test]}
      - name: update preview
        check: true
        desired: beta
        changed: true
        methods: [Test]
      - {name: update, desired: beta, changed: true, methods: [Test, Set]}
      - name: wrong password
        desired: beta
        wrong_password: true
        failed: true
        methods: []
      - name: Test failure
        desired: beta
        fail_test: true
        failed: true
        methods: [Test]
      - name: Set failure
        desired: gamma
        fail_set: true
        failed: true
        methods: [Test, Set]
    dsc_credential_quiet_cases:
      - name: quiet create
        desired: delta
        changed: true
        methods: [Test, Set]
        fresh_credential: true
        emit_secret_diagnostics: false
      - name: quiet repeat
        desired: delta
        methods: [Test]
        fresh_credential: true
        emit_secret_diagnostics: false
  tasks:
    - name: Record the actual compatibility-floor interpreter
        and original staging
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob,json,os,sys,tempfile;
        assert sys.version_info[:3] == (3,4,4);
        print(json.dumps(sorted(glob.glob(os.path.join(
        tempfile.gettempdir(),'ansible-tmp-*')))))""
      register: dsc_credential_staging_before
      changed_when: false

    - name: Choose private names and independent strong test passwords
      ansible.builtin.set_fact:
        dsc_credential_username: >-
          lwDSC_{{ lookup("password",
          "/dev/null length=12 chars=ascii_lowercase") }}
        dsc_credential_password: >-
          Aa1!{{ lookup("password",
          "/dev/null length=24 chars=ascii_letters,digits") }}
        dsc_credential_wrong_password: >-
          Bb2!{{ lookup("password",
          "/dev/null length=24 chars=ascii_letters,digits") }}
        dsc_credential_fresh_password: >-
          Cc3!{{ lookup("password",
          "/dev/null length=24 chars=ascii_letters,digits") }}
        dsc_credential_records: []
      no_log: true

    - name: Require the uniquely chosen account to be absent before claiming it
      sustainablelobster.legacy_windows.win_user:
        name: '{{ dsc_credential_username }}'
        state: query
      register: dsc_credential_absent

    - name: Refuse to modify an existing account
      ansible.builtin.assert:
        that:
          - dsc_credential_absent.state == 'absent'
          - dsc_credential_absent.sid is undefined

    - name: Allocate the uniquely owned resource workspace
      sustainablelobster.legacy_windows.win_tempfile:
        prefix: legacy-windows-dsc-credential-
        state: directory
      register: dsc_credential_workspace

    - name: Exercise only the new account and owned workspace
      block:
        - name: Create one non-admin test account
            for actual engine authentication
          sustainablelobster.legacy_windows.win_user:
            name: '{{ dsc_credential_username }}'
            password: '{{ dsc_credential_password }}'
            groups: [S-1-5-32-545, S-1-5-32-580]
            state: present
          register: dsc_credential_account
          no_log: true

        - name: Add only this new account's bounded batch-logon right
          sustainablelobster.legacy_windows.win_user_right:
            name: SeBatchLogonRight
            users: ['{{ dsc_credential_username }}']
            action: add

        - name: Allow only the owned account to manage the owned test workspace
          sustainablelobster.legacy_windows.win_acl:
            path: '{{ dsc_credential_workspace.path }}'
            user: '{{ dsc_credential_account.sid }}'
            rights: Modify
            type: allow
            state: present
            inherit: ContainerInherit, ObjectInherit
            propagation: None

        - name: Journal protected bytes and the original DSC configuration
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ dsc_credential_workspace.path }}', setup]
            stdin: |
              import base64,json
              DSC_TEST_SECRET=json.loads(base64.b64decode(
                  '{{ dsc_credential_password | to_json | b64encode }}'
                  ).decode('utf-8'))
              {{ dsc_credential_program }}
          register: dsc_credential_setup
          changed_when: false
          no_log: true

        - name: Verify the requested credential identity differs from SYSTEM
          ansible.builtin.assert:
            that:
              - dsc_credential_account.sid != 'S-1-5-18'
              - >-
                dsc_credential_account.groups |
                selectattr('name', 'equalto', 'Administrators') |
                list | length == 0

        - name: Exercise Credential through installed Script resource methods
          ansible.builtin.include_tasks: tasks/win_dsc_credential_case.yml
          loop: '{{ dsc_credential_cases }}'
          loop_control:
            loop_var: dsc_credential_case
            label: '{{ dsc_credential_case.name }}'
          vars:
            dsc_credential_property: Credential

        - name: Restore owned outputs between independent credential properties
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ dsc_credential_workspace.path }}', cleanup]
            stdin: '{{ dsc_credential_program }}'
          changed_when: false
          no_log: true

        - name: Exercise PsDscRunAsCredential through installed
            Script resource methods
          ansible.builtin.include_tasks: tasks/win_dsc_credential_case.yml
          loop: '{{ dsc_credential_cases }}'
          loop_control:
            loop_var: dsc_credential_case
            label: '{{ dsc_credential_case.name }}'
          vars:
            dsc_credential_property: PsDscRunAsCredential

        - name: Rotate to a fresh credential never emitted by resource code
          sustainablelobster.legacy_windows.win_user:
            name: '{{ dsc_credential_username }}'
            password: '{{ dsc_credential_fresh_password }}'
            state: present
          no_log: true

        - name: Restore owned outputs before quiet Credential calls
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ dsc_credential_workspace.path }}', cleanup]
            stdin: '{{ dsc_credential_program }}'
          changed_when: false
          no_log: true

        - name: Exercise a fresh Credential without logging its password
          ansible.builtin.include_tasks: tasks/win_dsc_credential_case.yml
          loop: '{{ dsc_credential_quiet_cases }}'
          loop_control:
            loop_var: dsc_credential_case
            label: '{{ dsc_credential_case.name }}'
          vars:
            dsc_credential_property: Credential

        - name: Restore owned outputs before quiet RunAs calls
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ dsc_credential_workspace.path }}', cleanup]
            stdin: '{{ dsc_credential_program }}'
          changed_when: false
          no_log: true

        - name: Exercise a fresh RunAs credential without logging its password
          ansible.builtin.include_tasks: tasks/win_dsc_credential_case.yml
          loop: '{{ dsc_credential_quiet_cases }}'
          loop_control:
            loop_var: dsc_credential_case
            label: '{{ dsc_credential_case.name }}'
          vars:
            dsc_credential_property: PsDscRunAsCredential

        - name: Verify the quiet credential is absent from native cache files
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ dsc_credential_workspace.path }}', scan]
            stdin: |
              import base64,json
              DSC_TEST_SECRETS=json.loads(base64.b64decode(
                  '{{ [dsc_credential_fresh_password] | to_json | b64encode }}'
                  ).decode('utf-8'))
              {{ dsc_credential_program }}
          register: dsc_credential_cache_scan
          changed_when: false
          no_log: true
      always:
        - name: Preserve sanitized outcomes before attempting any cleanup
          ansible.builtin.copy:
            content: >-
              {{ {'results': dsc_credential_records,
                  'account_sid': dsc_credential_account.sid | default(none),
                  'account_name': dsc_credential_username,
                  'workspace': dsc_credential_workspace,
                  'setup': dsc_credential_setup | default(none),
                  'cache_scan': dsc_credential_cache_scan | default(none),
                  'staging_before': dsc_credential_staging_before}
                 | to_nice_json }}
            dest: '{{ dsc_evidence_dir }}/capture.json'
            mode: '0600'
          delegate_to: localhost
          vars: &local
            ansible_connection: local
            ansible_shell_type: sh
            ansible_python_interpreter: '{{ ansible_playbook_python }}'
          changed_when: false
          no_log: true

        - name: Recover only journaled outputs and verify protected native state
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ dsc_credential_workspace.path }}', cleanup]
            stdin: '{{ dsc_credential_program }}'
          register: dsc_credential_recovery
          failed_when: false
          changed_when: false
          no_log: true
          when: dsc_credential_setup is defined and dsc_credential_setup.rc == 0

        - name: Remove only the owned account's newly created profile
          sustainablelobster.legacy_windows.win_user_profile:
            username: '{{ dsc_credential_account.sid }}'
            state: absent
          register: dsc_credential_profile_cleanup
          failed_when: false
          when: dsc_credential_account.sid is defined

        - name: Release a retained profile only on an explicitly
            rebootable guest
          when: >-
            dsc_credential_profile_cleanup.msg is defined and
            'Win32 ErrorCode 32 - 0x00000020' in
            dsc_credential_profile_cleanup.msg and
            dsc_credential_reboot_cleanup | bool
          block:
            - name: Observe the real engine's configuration transaction state
              sustainablelobster.legacy_windows.win_command:
                argv:
                  - powershell.exe
                  - -NoProfile
                  - -NonInteractive
                  - -Command
                  - >-
                    [Console]::Write(
                    (Get-DscLocalConfigurationManager).LCMState)
              register: dsc_credential_idle
              changed_when: false

            - name: Refuse to interrupt an active configuration transaction
              ansible.builtin.assert:
                that:
                  - dsc_credential_idle.stdout | trim == 'Idle'

            - name: Normally reboot the authorized disposable test guest
              sustainablelobster.legacy_windows.win_reboot:
                reboot_timeout: 180
                post_reboot_delay: 2
              register: dsc_credential_cleanup_reboot

            - name: Remove only the now-released owned profile
              sustainablelobster.legacy_windows.win_user_profile:
                username: '{{ dsc_credential_account.sid }}'
                state: absent
              register: dsc_credential_profile_after_reboot

        - name: Require complete owned profile recovery
            before deleting its account
          ansible.builtin.assert:
            that:
              - >-
                dsc_credential_profile_cleanup.msg is undefined or
                dsc_credential_profile_after_reboot is defined

        - name: Remove only the bounded test account's batch-logon right
          sustainablelobster.legacy_windows.win_user_right:
            name: SeBatchLogonRight
            users: ['{{ dsc_credential_username }}']
            action: remove

        - name: Delete only the uniquely owned account
          sustainablelobster.legacy_windows.win_user:
            name: '{{ dsc_credential_username }}'
            state: absent
          register: dsc_credential_account_cleanup

        - name: Independently observe the deleted account
          sustainablelobster.legacy_windows.win_user:
            name: '{{ dsc_credential_username }}'
            state: query
          register: dsc_credential_account_after

        - name: Preserve full sanitized outcomes before asserting recovery
          ansible.builtin.copy:
            content: >-
              {{ {'results': dsc_credential_records,
                  'account_sid': dsc_credential_account.sid | default(none),
                  'account_after': dsc_credential_account_after,
                  'workspace': dsc_credential_workspace,
                  'setup': dsc_credential_setup | default(none),
                  'recovery': dsc_credential_recovery | default(none),
                  'profile_cleanup': dsc_credential_profile_cleanup |
                    default(none),
                  'cache_scan': dsc_credential_cache_scan | default(none),
                  'staging_before': dsc_credential_staging_before}
                 | to_nice_json }}
            dest: '{{ dsc_evidence_dir }}/capture.json'
            mode: '0600'
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

        - name: Require complete account and protected-resource recovery
          ansible.builtin.assert:
            that:
              - dsc_credential_account_after.state == 'absent'
              - dsc_credential_account_after.sid is undefined
              - dsc_credential_recovery.rc == 0
              - (dsc_credential_recovery.stdout | from_json).restored

        - name: Recheck protection before deleting the owned journal
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ dsc_credential_workspace.path }}', finalize]
            stdin: '{{ dsc_credential_program }}'
          changed_when: false
          no_log: true

        - name: Remove only the verified empty test workspace
          sustainablelobster.legacy_windows.win_file:
            path: '{{ dsc_credential_workspace.path }}'
            state: absent

        - name: Verify workspace absence and original staging after all cleanup
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,tempfile;
            assert not os.path.exists(r'{{ dsc_credential_workspace.path }}');
            print(json.dumps(sorted(glob.glob(os.path.join(
            tempfile.gettempdir(),'ansible-tmp-*')))))""
          register: dsc_credential_staging_after
          changed_when: false

        - name: Require exact original global staging
          ansible.builtin.assert:
            that:
              - >-
                dsc_credential_staging_before.stdout ==
                dsc_credential_staging_after.stdout

        - name: Retain the final cleanup evidence
          ansible.builtin.copy:
            content: >-
              {{ {'results': dsc_credential_records,
                  'account_sid': dsc_credential_account.sid,
                  'account_after': dsc_credential_account_after,
                  'workspace': dsc_credential_workspace,
                  'recovery': dsc_credential_recovery,
                  'profile_cleanup': dsc_credential_profile_cleanup,
                  'profile_after_reboot':
                    dsc_credential_profile_after_reboot | default(none),
                  'cleanup_reboot':
                    dsc_credential_cleanup_reboot | default(none),
                  'engine_idle': dsc_credential_idle | default(none),
                  'cache_scan': dsc_credential_cache_scan | default(none),
                  'staging_before': dsc_credential_staging_before,
                  'staging_after': dsc_credential_staging_after,
                  'workspace_absent': true} | to_nice_json }}
            dest: '{{ dsc_evidence_dir }}/capture.json'
            mode: '0600'
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

    - name: Require every credential-property scenario
        to be demonstrated
      ansible.builtin.assert:
        that:
          - >-
            dsc_credential_records | length ==
            (dsc_credential_cases | length +
             dsc_credential_quiet_cases | length) * 2
          - >-
            dsc_credential_records | rejectattr('validated') |
            list | length == 0
