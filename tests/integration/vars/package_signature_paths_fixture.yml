---
package_signature_paths_program: |
  import base64
  import sys
  import types
  sys.argv.append({{ signature_paths_pair | default('') | to_json }})
  sys.argv.append({{ package_signature_paths_sample | default('') | to_json }})
  {% for name in package_signature_helper_names %}
  helper=types.ModuleType('{{ name }}')
  sys.modules[helper.__name__]=helper
  source='{{ lookup("file",
      playbook_dir + "/../../plugins/module_utils/" + name + ".py")
      | b64encode }}'
  exec(compile(base64.b64decode(source),helper.__name__+'.py','exec'),helper.__dict__)
  {% endfor %}
  base=types.ModuleType('package_msp_fixture')
  sys.modules[base.__name__]=base
  source='{{ lookup("file",
      playbook_dir + "/fixtures/package_msp_fixture.py") | b64encode }}'
  exec(compile(base64.b64decode(source),'package_msp_fixture.py','exec'),base.__dict__)
  source='{{ lookup("file",
      playbook_dir + "/fixtures/package_signature_paths.py") | b64encode }}'
  exec(compile(base64.b64decode(source),'package_signature_paths.py','exec'))
