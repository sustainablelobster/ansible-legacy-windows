---
computer_description_fixture: |
  # Copyright 2026 Joe Lustri
  # SPDX-License-Identifier: GPL-3.0-or-later
  """Journal and restore the real registration and WMI description values."""

  import base64
  import ctypes
  import json
  import os
  import sys
  import winreg

  assert sys.version_info[:3] == (3, 4, 4)
  WORKSPACE, OPERATION = sys.argv[1:3]
  JOURNAL = os.path.join(WORKSPACE, "computer-description-recovery.json")
  REGISTRY_PATH = r"SOFTWARE\Microsoft\Windows NT\CurrentVersion"
  VALUE_NAMES = {"owner": "RegisteredOwner",
                 "organization": "RegisteredOrganization"}
  BASELINE = {"owner": "Legacy fixture owner",
              "organization": "Legacy fixture organization",
              "description": "Legacy fixture description"}
  SECURITY = ctypes.WinDLL("advapi32", use_last_error=True)
  POINTER, DWORD = ctypes.c_void_p, ctypes.c_uint32


  def bind(name, arguments):
      function = getattr(SECURITY, name)
      function.restype, function.argtypes = ctypes.c_int32, arguments
      return function


  query_value = bind("RegQueryValueExW", [
      POINTER, ctypes.c_wchar_p, POINTER, POINTER, POINTER, POINTER])
  set_value = bind("RegSetValueExW", [
      POINTER, ctypes.c_wchar_p, DWORD, DWORD, POINTER, DWORD])
  get_security = bind("RegGetKeySecurity", [POINTER, DWORD, POINTER, POINTER])


  def require(status):
      if status:
          raise ctypes.WinError(status)


  def encoded(data):
      return base64.b64encode(data).decode("ascii")


  def read_value(handle, name):
      kind, size = DWORD(), DWORD()
      status = query_value(handle, name, None, ctypes.byref(kind), None,
                           ctypes.byref(size))
      if status == 2:
          return {"exists": False}
      require(status)
      data = ctypes.create_string_buffer(size.value)
      require(query_value(handle, name, None, ctypes.byref(kind), data,
                          ctypes.byref(size)))
      return {"exists": True, "type": kind.value,
              "data": encoded(data.raw[:size.value])}


  def registry_snapshot():
      access = winreg.KEY_QUERY_VALUE | winreg.KEY_WOW64_64KEY | 0x20000
      with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, REGISTRY_PATH,
                          0, access) as key:
          values = {field: read_value(int(key), name)
                    for field, name in VALUE_NAMES.items()}
          size = DWORD()
          status = get_security(int(key), 7, None, ctypes.byref(size))
          if status != 122:
              require(status)
          descriptor = ctypes.create_string_buffer(size.value)
          require(get_security(int(key), 7, descriptor, ctypes.byref(size)))
          return values, encoded(descriptor.raw[:size.value])


  def restore_value(field, saved):
      access = winreg.KEY_SET_VALUE | winreg.KEY_WOW64_64KEY
      with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, REGISTRY_PATH,
                          0, access) as key:
          if not saved["exists"]:
              try:
                  winreg.DeleteValue(key, VALUE_NAMES[field])
              except FileNotFoundError:
                  pass
          else:
              data = base64.b64decode(saved["data"])
              buffer = ctypes.create_string_buffer(data)
              require(set_value(int(key), VALUE_NAMES[field], 0,
                                saved["type"], buffer, len(data)))


  def set_description(object_path, value):
      with WmiConnection() as connection:
          connection.set_string_property(object_path, "Description", value)


  def observe():
      registration, security = registry_snapshot()
      with WmiConnection() as connection:
          rows = connection.query(
              "SELECT Description FROM Win32_OperatingSystem",
              ["Description", "__PATH"])
      assert len(rows) == 1 and rows[0]["__PATH"], rows
      values = {"description": rows[0]["Description"]}
      for field, value in registration.items():
          values[field] = None
          if value["exists"] and value["type"] in (1, 2):
              text = base64.b64decode(value["data"]).decode("utf-16-le")
              values[field] = text[:-1] if text.endswith("\0") else text
      return {"values": values, "registration": registration,
              "security": security, "object_path": rows[0]["__PATH"]}


  def save_journal(state, mode):
      with open(JOURNAL, mode) as stream:
          json.dump(state, stream)
          stream.flush()
          os.fsync(stream.fileno())


  def read_journal():
      with open(JOURNAL) as stream:
          state = json.load(stream)
      assert state["path"] == REGISTRY_PATH, "Journal identifies another key"
      return state


  def backup():
      assert not os.path.exists(JOURNAL), "Recovery journal already exists"
      state = {"path": REGISTRY_PATH, "initial": observe(), "restored": False}
      save_journal(state, "x")
      assert read_journal() == state, "Recovery journal verification failed"
      return state


  def setup(state):
      initial = state["initial"]
      set_description(initial["object_path"], BASELINE["description"])
      for field in VALUE_NAMES:
          restore_value(field, {
              "exists": True, "type": 1,
              "data": encoded((BASELINE[field] + "\0").encode("utf-16-le")),
          })


  def prepare_owner(state, operation):
      assert not state["restored"], "Original values are already restored"
      baseline = {
          "exists": True, "type": 1,
          "data": encoded((BASELINE["owner"] + "\0").encode("utf-16-le")),
      }
      current = registry_snapshot()[0]["owner"]
      expected = baseline if operation == "remove_owner" else {"exists": False}
      assert current == expected, "Owner differs from the controlled scenario"
      restore_value("owner", {"exists": False}
                    if operation == "remove_owner" else baseline)


  def cleanup(state):
      initial = state["initial"]
      current = observe()
      if current["values"]["description"] != initial["values"]["description"]:
          set_description(initial["object_path"],
                          initial["values"]["description"])
      for field in VALUE_NAMES:
          if current["registration"][field] != initial["registration"][field]:
              restore_value(field, initial["registration"][field])
      assert observe() == initial, (
          "Restored registration or description differs"
      )
      state["restored"] = True
      save_journal(state, "w")


  assert OPERATION in (
      "setup", "observe", "cleanup", "remove_owner", "restore_owner"
  ), OPERATION
  if OPERATION == "cleanup" and not os.path.exists(JOURNAL):
      print(json.dumps({"restored": True, "backup_created": False}))
      sys.exit(0)
  if OPERATION == "setup":
      state = backup()
      setup(state)
  else:
      state = read_journal()
  if OPERATION in ("remove_owner", "restore_owner"):
      prepare_owner(state, OPERATION)
  if OPERATION == "cleanup":
      cleanup(state)
      print(json.dumps({"restored": True, "backup_created": True}))
  else:
      snapshot = observe()
      assert snapshot["security"] == state["initial"]["security"], (
          "Registration key security changed"
      )
      if OPERATION == "setup":
          assert snapshot["values"] == BASELINE, snapshot
      print(json.dumps(snapshot))
