---
credential_fixture: |
  # Copyright 2026 Joe Lustri
  # SPDX-License-Identifier: GPL-3.0-or-later
  """Journal owned credential targets and independently verify recovery."""
  import base64
  import binascii
  import ctypes
  import hashlib
  import hmac
  import json
  import os
  import sys
  import uuid

  assert sys.version_info[:3] == (3, 4, 4)
  WORKSPACE, OPERATION = sys.argv[1:3]
  JOURNAL = os.path.join(WORKSPACE, "credential-ownership.json")
  POINTER, DWORD, BOOL = ctypes.c_void_p, ctypes.c_uint32, ctypes.c_int32
  SECURITY = ctypes.WinDLL("advapi32", use_last_error=True)
  CRYPT = ctypes.WinDLL("crypt32", use_last_error=True)
  PROVIDER = "Microsoft Enhanced Cryptographic Provider v1.0"
  TYPES = {
      "generic_password": 1,
      "domain_password": 2,
      "domain_certificate": 3,
      "generic_certificate": 5,
  }
  PASSWORDS = {
      "one": "Synthetic-Credential-Only-1".encode("utf-16-le"),
      "two": "Synthetic-Credential-Only-2".encode("utf-16-le"),
      "pin": b"Synthetic-PIN-Only",
      "empty": b"",
  }


  class Attribute(ctypes.Structure):
      _fields_ = [
          ("name", ctypes.c_wchar_p),
          ("flags", DWORD),
          ("size", DWORD),
          ("data", POINTER),
      ]


  class FileTime(ctypes.Structure):
      _fields_ = [("low", DWORD), ("high", DWORD)]


  class Credential(ctypes.Structure):
      _fields_ = [
          ("flags", DWORD),
          ("kind", DWORD),
          ("target", ctypes.c_wchar_p),
          ("comment", ctypes.c_wchar_p),
          ("written", FileTime),
          ("size", DWORD),
          ("blob", POINTER),
          ("persistence", DWORD),
          ("count", DWORD),
          ("attributes", ctypes.POINTER(Attribute)),
          ("alias", ctypes.c_wchar_p),
          ("username", ctypes.c_wchar_p),
      ]


  class Blob(ctypes.Structure):
      _fields_ = [("size", DWORD), ("data", POINTER)]


  class ProviderInfo(ctypes.Structure):
      _fields_ = [
          ("container", ctypes.c_wchar_p),
          ("provider", ctypes.c_wchar_p),
          ("kind", DWORD),
          ("flags", DWORD),
          ("count", DWORD),
          ("parameters", POINTER),
          ("key_spec", DWORD),
      ]


  class CertificateContext(ctypes.Structure):
      _fields_ = [
          ("encoding", DWORD),
          ("encoded", POINTER),
          ("size", DWORD),
          ("info", POINTER),
          ("store", POINTER),
      ]


  def bind(library, name, result, arguments):
      function = getattr(library, name)
      function.restype, function.argtypes = result, arguments
      return function


  read_credential = bind(
      SECURITY,
      "CredReadW",
      BOOL,
      [ctypes.c_wchar_p, DWORD, DWORD, ctypes.POINTER(POINTER)],
  )
  delete_credential = bind(
      SECURITY, "CredDeleteW", BOOL, [ctypes.c_wchar_p, DWORD, DWORD]
  )
  free_credential = bind(SECURITY, "CredFree", None, [POINTER])
  unmarshal_credential = bind(
      SECURITY,
      "CredUnmarshalCredentialW",
      BOOL,
      [ctypes.c_wchar_p, ctypes.POINTER(DWORD), ctypes.POINTER(POINTER)],
  )
  open_store = bind(
      CRYPT,
      "CertOpenStore",
      POINTER,
      [POINTER, DWORD, POINTER, DWORD, ctypes.c_wchar_p],
  )
  close_store = bind(CRYPT, "CertCloseStore", BOOL, [POINTER, DWORD])
  find_certificate = bind(
      CRYPT,
      "CertFindCertificateInStore",
      POINTER,
      [POINTER, DWORD, DWORD, DWORD, POINTER, POINTER],
  )
  create_certificate = bind(
      CRYPT,
      "CertCreateSelfSignCertificate",
      POINTER,
      [POINTER, POINTER, DWORD] + [POINTER] * 5,
  )
  add_certificate = bind(
      CRYPT,
      "CertAddCertificateContextToStore",
      BOOL,
      [POINTER, POINTER, DWORD, POINTER],
  )
  free_certificate = bind(
      CRYPT, "CertFreeCertificateContext", BOOL, [POINTER]
  )
  delete_certificate = bind(
      CRYPT, "CertDeleteCertificateFromStore", BOOL, [POINTER]
  )
  encode_subject = bind(
      CRYPT,
      "CertStrToNameW",
      BOOL,
      [DWORD, ctypes.c_wchar_p, DWORD] + [POINTER] * 4,
  )
  acquire_provider = bind(
      SECURITY,
      "CryptAcquireContextW",
      BOOL,
      [POINTER, ctypes.c_wchar_p, ctypes.c_wchar_p, DWORD, DWORD],
  )
  release_provider = bind(
      SECURITY, "CryptReleaseContext", BOOL, [POINTER, DWORD]
  )
  generate_key = bind(
      SECURITY, "CryptGenKey", BOOL, [POINTER, DWORD, DWORD, POINTER]
  )
  destroy_key = bind(SECURITY, "CryptDestroyKey", BOOL, [POINTER])


  def require(result):
      if not result:
          raise ctypes.WinError(ctypes.get_last_error())


  def save(state):
      pending = JOURNAL + ".pending"
      with open(pending, "w") as stream:
          json.dump(state, stream, sort_keys=True)
          stream.flush()
          os.fsync(stream.fileno())
      os.replace(pending, JOURNAL)


  def load():
      with open(JOURNAL) as stream:
          state = json.load(stream)
      assert state["workspace"] == os.path.abspath(WORKSPACE)
      assert state["initial_absence_verified"] is True
      assert state["container"].startswith("legacy-credential-")
      expected = {name: state["target"] for name in TYPES}
      assert state["targets"] == expected
      assert state.get("unavailable", {}) in ({}, {"generic_certificate": 87})
      return state


  def read_target(name, kind, proof_key=None):
      pointer = POINTER()
      if not read_credential(name, kind, 0, ctypes.byref(pointer)):
          if ctypes.get_last_error() == 1168:
              return None
          raise ctypes.WinError(ctypes.get_last_error())
      try:
          if proof_key is None:
              # Initial collision checks must not inspect an existing secret.
              return {"exists": True}
          value = ctypes.cast(pointer, ctypes.POINTER(Credential)).contents
          username = value.username
          if kind in (3, 5):
              marshalled_type, info = DWORD(), POINTER()
              require(
                  unmarshal_credential(
                      username,
                      ctypes.byref(marshalled_type),
                      ctypes.byref(info),
                  )
              )
              try:
                  assert marshalled_type.value == 1
                  size = ctypes.cast(
                      info, ctypes.POINTER(DWORD)
                  ).contents.value
                  username = (
                      binascii.hexlify(
                          ctypes.string_at(info.value + 4, size - 4)
                      )
                      .decode("ascii")
                      .upper()
                  )
              finally:
                  free_credential(info)
          secret = (
              ctypes.string_at(value.blob, value.size) if value.size else b""
          )
          attributes = []
          for index in range(value.count):
              attribute = value.attributes[index]
              data = (
                  ctypes.string_at(attribute.data, attribute.size)
                  if attribute.size
                  else b""
              )
              attributes.append(
                  {
                      "name": attribute.name,
                      "flags": attribute.flags,
                      "data": base64.b64encode(data).decode("ascii"),
                  }
              )
          return {
              "name": value.target,
              "type": value.kind,
              "flags": value.flags,
              "username": username,
              "alias": value.alias,
              "comment": value.comment,
              "persistence": value.persistence,
              "attributes": attributes,
              "last_written": value.written.low | (value.written.high << 32),
              "secret_proof": hmac.new(
                  proof_key, secret, hashlib.sha256
              ).hexdigest(),
              "secret_matches": sorted(
                  name
                  for name, password in PASSWORDS.items()
                  if password == secret
              ),
          }
      finally:
          free_credential(pointer)


  def key_exists(container):
      provider = POINTER()
      if acquire_provider(
          ctypes.byref(provider), container, PROVIDER, 1, 0x40
      ):
          require(release_provider(provider, 0))
          return True
      if ctypes.get_last_error() & 0xFFFFFFFF == 0x80090016:
          return False
      raise ctypes.WinError(ctypes.get_last_error())


  def certificate_bytes(pointer):
      certificate = ctypes.cast(
          pointer, ctypes.POINTER(CertificateContext)
      ).contents
      return ctypes.string_at(certificate.encoded, certificate.size)


  def find(store, thumbprint):
      data = ctypes.create_string_buffer(binascii.unhexlify(thumbprint))
      blob = Blob(20, ctypes.cast(data, POINTER))
      pointer = find_certificate(
          store, 0x10001, 0, 0x10000, ctypes.byref(blob), None
      )
      if not pointer and ctypes.get_last_error() & 0xFFFFFFFF != 0x80092004:
          raise ctypes.WinError(ctypes.get_last_error())
      return pointer


  def create_owned_certificate(store, state):
      provider, key = POINTER(), POINTER()
      require(
          acquire_provider(
              ctypes.byref(provider), state["container"], PROVIDER, 1, 0x48
          )
      )
      try:
          require(
              generate_key(provider, 0x2400, 2048 << 16, ctypes.byref(key))
          )
          size = DWORD()
          subject = "CN=" + state["container"]
          require(
              encode_subject(
                  1, subject, 3, None, None, ctypes.byref(size), None
              )
          )
          name = ctypes.create_string_buffer(size.value)
          require(
              encode_subject(
                  1, subject, 3, None, name, ctypes.byref(size), None
              )
          )
          blob = Blob(size.value, ctypes.cast(name, POINTER))
          info = ProviderInfo(state["container"], PROVIDER, 1, 0, 0, None, 2)
          certificate = create_certificate(
              provider,
              ctypes.byref(blob),
              0,
              ctypes.byref(info),
              None,
              None,
              None,
              None,
          )
          require(certificate)
          try:
              der = certificate_bytes(certificate)
              thumbprint = hashlib.sha1(der).hexdigest().upper()
              collision = find(store, thumbprint)
              if collision:
                  free_certificate(collision)
                  raise AssertionError(
                      "Owned certificate thumbprint already exists"
                  )
              state["thumbprint"] = thumbprint
              state["certificate_der"] = base64.b64encode(der).decode("ascii")
              # Record absence and the exact intended certificate durably
              # before adding it to the store.
              save(state)
              require(add_certificate(store, certificate, 1, None))
          finally:
              require(free_certificate(certificate))
      finally:
          if key:
              require(destroy_key(key))
          require(release_provider(provider, 0))


  def setup(store):
      assert not os.path.exists(
          JOURNAL
      ), "Credential ownership journal already exists"
      identifier = uuid.uuid4().hex
      target = "legacy-credential-" + identifier + ".invalid"
      container = "legacy-credential-" + identifier
      unavailable = {}
      for name, kind in TYPES.items():
          try:
              existing = read_target(target, kind)
          except OSError as error:
              if kind != 5 or error.winerror != 87:
                  raise
              unavailable[name] = 87
          else:
              assert existing is None, "Credential target already exists"
      assert not key_exists(container), "Owned key container already exists"
      state = {
          "workspace": os.path.abspath(WORKSPACE),
          "target": target,
          "targets": {name: target for name in TYPES},
          "unavailable": unavailable,
          "container": container,
          "initial_absence_verified": True,
          "proof_key": base64.b64encode(os.urandom(32)).decode("ascii"),
      }
      save(state)
      assert load() == state
      create_owned_certificate(store, state)
      return state


  def verify_unavailable(state):
      for name, code in state.get("unavailable", {}).items():
          try:
              read_target(state["targets"][name], TYPES[name])
          except OSError as error:
              assert (
                  error.winerror == code
              ), "Unavailable credential error changed"
          else:
              raise AssertionError(
                  "Previously unavailable credential is readable"
              )


  def observe(store, state):
      pointer = find(store, state["thumbprint"])
      require(pointer)
      try:
          assert (
              base64.b64encode(certificate_bytes(pointer)).decode("ascii")
              == state["certificate_der"]
          )
      finally:
          require(free_certificate(pointer))
      assert key_exists(state["container"])
      verify_unavailable(state)
      proof_key = base64.b64decode(state["proof_key"])
      return {
          "targets": {
              name: read_target(target, TYPES[name], proof_key)
              for name, target in state["targets"].items()
              if name not in state.get("unavailable", {})
          },
          "unavailable": state.get("unavailable", {}),
          "names": state["targets"],
          "thumbprint": state["thumbprint"],
      }


  def cleanup(store, state):
      verify_unavailable(state)
      for name, target in state["targets"].items():
          if name in state.get("unavailable", {}):
              continue
          kind = TYPES[name]
          if read_target(target, kind) is not None:
              require(delete_credential(target, kind, 0))
          assert read_target(target, kind) is None, "Owned credential remains"
      if "thumbprint" in state:
          pointer = find(store, state["thumbprint"])
          if pointer:
              try:
                  assert (
                      base64.b64encode(certificate_bytes(pointer)).decode(
                          "ascii"
                      )
                      == state["certificate_der"]
                  )
              except BaseException:
                  free_certificate(pointer)
                  raise
              # Deletion consumes the certificate context on success or failure.
              require(delete_certificate(pointer))
          remaining = find(store, state["thumbprint"])
          if remaining:
              free_certificate(remaining)
              raise AssertionError("Owned certificate remains")
      if key_exists(state["container"]):
          provider = POINTER()
          require(
              acquire_provider(
                  ctypes.byref(provider),
                  state["container"],
                  PROVIDER,
                  1,
                  0x50,
              )
          )
          # CRYPT_DELETEKEYSET leaves no provider handle to release.
      assert not key_exists(state["container"]), "Owned key container remains"


  assert OPERATION in ("setup", "observe", "cleanup"), OPERATION
  if OPERATION == "cleanup" and not os.path.exists(JOURNAL):
      print(json.dumps({"restored": True, "journal_created": False}))
      sys.exit(0)
  store = open_store(10, 0, None, 0x14000, "My")
  require(store)
  try:
      state = setup(store) if OPERATION == "setup" else load()
      if OPERATION == "cleanup":
          cleanup(store, state)
          print(json.dumps({"restored": True, "journal_created": True}))
      else:
          print(json.dumps(observe(store, state), ensure_ascii=True))
  finally:
      require(close_store(store, 0))
