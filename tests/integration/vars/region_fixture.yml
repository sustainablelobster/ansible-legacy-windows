---
region_fixture: |
  # Copyright 2026 Joe Lustri
  # SPDX-License-Identifier: GPL-3.0-or-later
  """Journal regional registry trees before mutation.

  Restore exact original values during cleanup.
  """
  import base64
  import ctypes
  import json
  import os
  import sys
  import tempfile
  import types
  import winreg

  assert sys.version_info[:3] == (3, 4, 4)
  WORKSPACE, OPERATION = sys.argv[1:3]
  KERNEL = ctypes.WinDLL("kernel32", use_last_error=True)
  ADVAPI = ctypes.WinDLL("advapi32", use_last_error=True)
  DWORD, POINTER = ctypes.c_uint32, ctypes.c_void_p
  KERNEL.GetLongPathNameW.argtypes = [ctypes.c_wchar_p,
                                     ctypes.c_wchar_p, DWORD]
  KERNEL.GetLongPathNameW.restype = DWORD
  HELPER_SOURCES = json.loads({{ region_helper_sources | to_json | to_json }})
  HELPER_NAMES = ("legacy_windows_account", "legacy_windows_group",
                  "legacy_windows_owner")
  PATHS = (r"Control Panel\International", r"Keyboard Layout",
           r"Control Panel\Input Method")
  MOUNT = "LEGACY_REGION_FIXTURE"
  HIVE = (r"C:\Users\Default\NTUSER.DAT" if os.path.isdir(r"C:\Users") else
          r"C:\Documents and Settings\Default User\NTUSER.DAT")
  ROOTS = (("HKCU", path) for path in PATHS)
  ROOTS = list(ROOTS) + [
      ("HKLM", r"SYSTEM\CurrentControlSet\Control\Nls"),
      ("HKLM", r"SYSTEM\CurrentControlSet\Control\FontAssoc"),
      ("HKLM", r"SOFTWARE\Microsoft\Windows NT\CurrentVersion\FontMapper"),
      ("HKLM", r"SOFTWARE\Microsoft\Windows NT\CurrentVersion\FontLink"),
      ("HKLM", r"SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts"),
  ] + [("HKU", sid + "\\" + path)
       for sid in (MOUNT, ".DEFAULT", "S-1-5-19", "S-1-5-20")
       for path in PATHS]
  for name, args in {
      "RegQueryValueExW": [POINTER, ctypes.c_wchar_p, POINTER,
          ctypes.POINTER(DWORD), POINTER, ctypes.POINTER(DWORD)],
      "RegSetValueExW": [POINTER, ctypes.c_wchar_p, DWORD, DWORD,
                         POINTER, DWORD],
      "RegGetKeySecurity": [POINTER, DWORD, POINTER, ctypes.POINTER(DWORD)],
      "RegSetKeySecurity": [POINTER, DWORD, POINTER],
      "RegUnLoadKeyW": [POINTER, ctypes.c_wchar_p],
  }.items():
      function = getattr(ADVAPI, name)
      function.argtypes, function.restype = args, ctypes.c_int32

  def long_path(path):
      size = KERNEL.GetLongPathNameW(path, None, 0)
      if not size:
          raise ctypes.WinError(ctypes.get_last_error())
      buffer = ctypes.create_unicode_buffer(size)
      if not KERNEL.GetLongPathNameW(path, buffer, size):
          raise ctypes.WinError(ctypes.get_last_error())
      return os.path.normcase(buffer.value)

  WORKSPACE = long_path(WORKSPACE)
  assert os.path.basename(WORKSPACE).startswith("legacy-windows-region-")
  assert os.path.dirname(WORKSPACE) == long_path(tempfile.gettempdir())
  JOURNAL = os.path.join(WORKSPACE, "region-recovery.json")

  def check(code):
      if code:
          raise ctypes.WinError(code)

  def load_owner():
      for name in HELPER_NAMES:
          if name not in sys.modules:
              module = types.ModuleType(name)
              sys.modules[name] = module
              exec(compile(HELPER_SOURCES[name], name + ".py", "exec"),
                   module.__dict__)
      return sys.modules["legacy_windows_owner"]

  def open_key(hive, path, write=False):
      access = winreg.KEY_READ | winreg.KEY_WOW64_64KEY
      if write:
          access |= winreg.KEY_WRITE | 0xC0000
      return winreg.OpenKey({"HKCU": winreg.HKEY_CURRENT_USER,
                            "HKLM": winreg.HKEY_LOCAL_MACHINE,
                            "HKU": winreg.HKEY_USERS}[hive], path, 0, access)

  def security(key):
      size = DWORD()
      code = ADVAPI.RegGetKeySecurity(int(key), 7, None, ctypes.byref(size))
      assert code in (0, 122), code
      buffer = ctypes.create_string_buffer(size.value)
      check(ADVAPI.RegGetKeySecurity(int(key), 7, buffer, ctypes.byref(size)))
      return base64.b64encode(buffer.raw[:size.value]).decode("ascii")

  def snapshot(hive, path):
      try:
          key = open_key(hive, path)
      except FileNotFoundError:
          return None
      with key:
          result = {"values": {}, "children": {}, "security": security(key)}
          children, values = winreg.QueryInfoKey(key)[:2]
          for index in range(values):
              name = winreg.EnumValue(key, index)[0]
              kind, size = DWORD(), DWORD()
              check(ADVAPI.RegQueryValueExW(int(key), name, None,
                    ctypes.byref(kind), None, ctypes.byref(size)))
              buffer = ctypes.create_string_buffer(size.value)
              check(ADVAPI.RegQueryValueExW(int(key), name, None,
                    ctypes.byref(kind), buffer, ctypes.byref(size)))
              result["values"][name] = {"kind": kind.value,
                  "data": base64.b64encode(buffer.raw[:size.value])
                  .decode("ascii")}
          for index in range(children):
              name = winreg.EnumKey(key, index)
              result["children"][name] = snapshot(hive, path + "\\" + name)
          return result

  def mount():
      for name in ("ANSIBLE", MOUNT):
          try:
              with winreg.OpenKey(winreg.HKEY_USERS, name):
                  raise AssertionError(
                      "A test-reserved hive is already mounted")
          except FileNotFoundError:
              pass
      winreg.LoadKey(winreg.HKEY_USERS, MOUNT, HIVE)

  def registry():
      result = {}
      mount()
      try:
          for hive, path in ROOTS:
              result[hive + "\\" + path] = snapshot(hive, path)
      finally:
          check(ADVAPI.RegUnLoadKeyW(winreg.HKEY_USERS, MOUNT))
      return result

  def locale_name(system):
      name = ("GetSystemDefaultLocaleName" if system else
              "GetUserDefaultLocaleName")
      if not hasattr(KERNEL, name):
          return None
      function = getattr(KERNEL, name)
      function.argtypes = [ctypes.c_wchar_p, ctypes.c_int]
      function.restype = ctypes.c_int
      buffer = ctypes.create_unicode_buffer(85)
      if not function(buffer, len(buffer)):
          raise ctypes.WinError(ctypes.get_last_error())
      return buffer.value

  def observe():
      KERNEL.GetUserGeoID.argtypes = [ctypes.c_int]
      KERNEL.GetUserGeoID.restype = ctypes.c_int32
      for name in ("GetUserDefaultLCID", "GetSystemDefaultLCID"):
          function = getattr(KERNEL, name)
          function.argtypes, function.restype = [], DWORD
      raw_registry = registry()
      nls = raw_registry[r"HKLM\SYSTEM\CurrentControlSet\Control\Nls"]
      defaults = {}
      for section, name in (("Language", "Default"), ("Locale", "(Default)"),
                            ("CodePage", "ACP"), ("CodePage", "OEMCP"),
                            ("CodePage", "MACCP")):
          value = nls["children"][section]["values"].get(name)
          defaults[section + "\\" + name] = (None if value is None else
              base64.b64decode(value["data"]).decode("utf-16-le").rstrip("\0"))
      return {"registry": raw_registry, "nls_defaults": defaults,
              "user_locale": locale_name(False),
              "system_locale": locale_name(True),
              "location": KERNEL.GetUserGeoID(16),
              "user_lcid": KERNEL.GetUserDefaultLCID(),
              "system_lcid": KERNEL.GetSystemDefaultLCID(),
              "legacy": not hasattr(KERNEL, "GetUserDefaultLocaleName"),
              "python": list(sys.version_info[:3])}

  def read_journal():
      with open(JOURNAL) as stream:
          return json.load(stream)

  def backup():
      assert not os.path.exists(JOURNAL), "Recovery journal already exists"
      initial = observe()
      state = {"workspace": WORKSPACE, "initial": initial}
      with open(JOURNAL, "x") as stream:
          json.dump(state, stream, ensure_ascii=True)
          stream.flush()
          os.fsync(stream.fileno())
      assert read_journal() == state, "Recovery journal verification failed"
      return state

  def delete_tree(hive, path):
      with open_key(hive, path, True) as key:
          names = [winreg.EnumKey(key, index)
                   for index in range(winreg.QueryInfoKey(key)[0])]
      for name in names:
          delete_tree(hive, path + "\\" + name)
      winreg.DeleteKey({"HKCU": winreg.HKEY_CURRENT_USER,
                        "HKLM": winreg.HKEY_LOCAL_MACHINE,
                        "HKU": winreg.HKEY_USERS}[hive], path)

  def restore_tree(hive, path, initial):
      current = snapshot(hive, path)
      if current == initial:
          return
      if initial is None:
          if current is not None:
              delete_tree(hive, path)
          return
      assert current is not None, "An original registry key disappeared"
      with open_key(hive, path, True) as key:
          for name in current["values"]:
              if name not in initial["values"]:
                  winreg.DeleteValue(key, name)
          for name, value in initial["values"].items():
              if current["values"].get(name) != value:
                  raw = base64.b64decode(value["data"])
                  buffer = ctypes.create_string_buffer(raw)
                  check(ADVAPI.RegSetValueExW(int(key), name, 0,
                        value["kind"], buffer, len(raw)))
          if current["security"] != initial["security"]:
              raw = base64.b64decode(initial["security"])
              check(ADVAPI.RegSetKeySecurity(int(key), 7,
                    ctypes.create_string_buffer(raw)))
      for name in current["children"]:
          if name not in initial["children"]:
              delete_tree(hive, path + "\\" + name)
      for name, child in initial["children"].items():
          restore_tree(hive, path + "\\" + name, child)

  def restore_locale(state):
      assert state["workspace"] == WORKSPACE
      assert set(state["initial"]["registry"]) == {
          hive + "\\" + path for hive, path in ROOTS}
      original_locale = state["initial"]["system_locale"]
      if original_locale is not None:
          library = ctypes.WinDLL("intl.cpl", use_last_error=True)
          library.IntlUpdateSystemLocale.argtypes = [ctypes.c_wchar_p,
                                                     ctypes.c_int32]
          library.IntlUpdateSystemLocale.restype = ctypes.c_int32
          library.IntlUpdateSystemLocale(original_locale, 2)
      return {"locale_restoration_attempted": original_locale is not None}

  def cleanup(state):
      assert state["workspace"] == WORKSPACE
      assert set(state["initial"]["registry"]) == {
          hive + "\\" + path for hive, path in ROOTS}
      original_locale = state["initial"]["system_locale"]
      if original_locale is not None and locale_name(True) != original_locale:
          restore_locale(state)
      mount()
      try:
          for hive, path in ROOTS:
              restore_tree(hive, path, state["initial"]["registry"]
                           [hive + "\\" + path])
      finally:
          check(ADVAPI.RegUnLoadKeyW(winreg.HKEY_USERS, MOUNT))
      return {"restoration_attempted": True}

  def verify(state):
      assert state["workspace"] == WORKSPACE
      final = observe()
      assert final == state["initial"], "Original regional settings differ"
      return {"restored": True, "initial": state["initial"], "final": final}

  assert OPERATION in ("setup", "observe", "cleanup",
                       "restore_locale", "verify")
  if OPERATION == "restore_locale":
      # Republish from a fresh process without first reading its active cache.
      result = restore_locale(read_journal())
  else:
      owner = load_owner()
      privileges = ("SeBackupPrivilege", "SeRestorePrivilege")
      with owner.ownership_privileges(privileges):
          if OPERATION in ("cleanup", "verify") and not os.path.exists(JOURNAL):
              for name in ("ANSIBLE", MOUNT):
                  try:
                      with winreg.OpenKey(winreg.HKEY_USERS, name):
                          raise AssertionError(
                              "A reserved test hive remains loaded")
                  except FileNotFoundError:
                      pass
              result = {"restored": True, "backup_created": False}
          else:
              state = backup() if OPERATION == "setup" else read_journal()
              if OPERATION == "cleanup":
                  result = cleanup(state)
              elif OPERATION == "verify":
                  result = verify(state)
              else:
                  result = observe()
  print(json.dumps(result, ensure_ascii=True))
