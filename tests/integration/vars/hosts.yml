---
hosts_cases:
  - name: Leave an absent canonical name unchanged
    parameters: {state: absent, canonical_name: missing.invalid}
    changed: false
  - name: Predict an IPv4 entry
    parameters: {ip_address: 192.0.2.50, canonical_name: new.invalid}
    check: true
    changed: true
    absent: [new.invalid]
  - name: Add an IPv4 entry
    parameters: {ip_address: 192.0.2.50, canonical_name: new.invalid}
    changed: true
    present:
      - {ip_address: 192.0.2.50, canonical_name: new.invalid, aliases: []}
  - name: Repeat the IPv4 entry
    parameters: {ip_address: 192.0.2.50, canonical_name: new.invalid}
    changed: false
  - name: Add aliases without replacing existing names
    parameters:
      ip_address: 192.0.2.50
      canonical_name: new.invalid
      aliases: [one.invalid, two.invalid]
      action: add
    changed: true
    present:
      - ip_address: 192.0.2.50
        canonical_name: new.invalid
        aliases: [one.invalid, two.invalid]
  - name: Repeat the added aliases
    parameters:
      ip_address: 192.0.2.50
      canonical_name: new.invalid
      aliases: [one.invalid, two.invalid]
      action: add
    changed: false
  - name: Replace the alias set
    parameters:
      ip_address: 192.0.2.50
      canonical_name: new.invalid
      aliases: [two.invalid, three.invalid]
      action: set
    changed: true
    present:
      - ip_address: 192.0.2.50
        canonical_name: new.invalid
        aliases: [two.invalid, three.invalid]
  - name: Remove one alias
    parameters:
      ip_address: 192.0.2.50
      canonical_name: new.invalid
      aliases: [two.invalid]
      action: remove
    changed: true
    present:
      - ip_address: 192.0.2.50
        canonical_name: new.invalid
        aliases: [three.invalid]
  - name: Repeat alias removal
    parameters:
      ip_address: 192.0.2.50
      canonical_name: new.invalid
      aliases: [two.invalid]
      action: remove
    changed: false
  - name: Predict canonical-name removal
    parameters: {state: absent, canonical_name: new.invalid}
    check: true
    changed: true
    present:
      - ip_address: 192.0.2.50
        canonical_name: new.invalid
        aliases: [three.invalid]
  - name: Remove by both address and canonical name
    parameters:
      state: absent
      ip_address: 192.0.2.50
      canonical_name: new.invalid
    changed: true
    absent: [new.invalid]
  - name: Move an alias from another IPv4 canonical name
    parameters:
      ip_address: 192.0.2.10
      canonical_name: alpha.invalid
      aliases: [shared.invalid]
      action: add
    changed: true
    present:
      - ip_address: 192.0.2.10
        canonical_name: alpha.invalid
        aliases: [old.invalid, keep.invalid, shared.invalid]
      - {ip_address: 192.0.2.20, canonical_name: beta.invalid, aliases: []}
    text: ['# alpha comment', '# beta comment']
  - name: Add a second canonical name at the same address
    parameters: {ip_address: 192.0.2.20, canonical_name: target.invalid}
    changed: true
    present:
      - {ip_address: 192.0.2.20, canonical_name: target.invalid, aliases: []}
      - {ip_address: 192.0.2.20, canonical_name: beta.invalid, aliases: []}
  - name: Preserve the unwritten last-name-removal diff quirk
    parameters:
      ip_address: 192.0.2.20
      canonical_name: target.invalid
      action: remove
      aliases: [beta.invalid]
    changed: false
    unwritten_diff: true
    diff_absent_text: [beta.invalid]
    present:
      - {ip_address: 192.0.2.20, canonical_name: target.invalid, aliases: []}
      - {ip_address: 192.0.2.20, canonical_name: beta.invalid, aliases: []}
  - name: Move the IPv4 mapping while preserving the IPv6 mapping
    parameters:
      ip_address: 192.0.2.11
      canonical_name: alpha.invalid
      aliases: [fresh.invalid]
      action: add
    changed: true
    present:
      - ip_address: 192.0.2.11
        canonical_name: alpha.invalid
        aliases: [fresh.invalid, old.invalid, keep.invalid, shared.invalid]
      - ip_address: '2001:db8::10'
        canonical_name: alpha.invalid
        aliases: [six.invalid]
  - name: Add an IPv6 alias without affecting the IPv4 mapping
    parameters:
      ip_address: '2001:db8::10'
      canonical_name: alpha.invalid
      aliases: [v6alias.invalid]
      action: add
    changed: true
    present:
      - ip_address: '2001:db8::10'
        canonical_name: alpha.invalid
        aliases: [six.invalid, v6alias.invalid]
      - ip_address: 192.0.2.11
        canonical_name: alpha.invalid
        aliases: [fresh.invalid, old.invalid, keep.invalid, shared.invalid]
  - name: Match names without changing their existing case
    parameters:
      ip_address: 192.0.2.40
      canonical_name: case.invalid
      aliases: [mixed.invalid]
      action: add
    changed: false
    present:
      - ip_address: 192.0.2.40
        canonical_name: CASE.invalid
        aliases: [MiXeD.invalid]
  - name: Preserve the supplied case of a new alias
    parameters:
      ip_address: 192.0.2.40
      canonical_name: case.invalid
      aliases: [Extra.invalid]
      action: add
    changed: true
    present:
      - ip_address: 192.0.2.40
        canonical_name: CASE.invalid
        aliases: [MiXeD.invalid, Extra.invalid]
  - name: Remove an alias using a different case
    parameters:
      ip_address: 192.0.2.40
      canonical_name: case.invalid
      aliases: [MIXED.invalid]
      action: remove
    changed: true
    present:
      - ip_address: 192.0.2.40
        canonical_name: CASE.invalid
        aliases: [Extra.invalid]
  - name: Remove all mappings for an IPv4 address
    parameters: {state: absent, ip_address: 192.0.2.20}
    changed: true
    absent: [beta.invalid, target.invalid]
  - name: Remove both address families by canonical name
    parameters: {state: absent, canonical_name: alpha.invalid}
    changed: true
    absent: [alpha.invalid]
  - name: Add a new IPv6 mapping
    parameters:
      ip_address: '2001:db8::99'
      canonical_name: gamma.invalid
      aliases: [g6.invalid]
    changed: true
    present:
      - ip_address: '2001:db8::99'
        canonical_name: gamma.invalid
        aliases: [g6.invalid]
  - name: Remove all valid host entries and preserve comments
    parameters: {state: absent}
    changed: true
    empty: true
  - name: Repeat global removal
    parameters: {state: absent}
    changed: false
    empty: true
  - name: Reject an invalid IP address before writing
    parameters: {ip_address: 999.999.1.1, canonical_name: invalid.invalid}
    changed: false
    error: >-
      win_hosts: Argument ip_address needs to be a valid ip address,
      but was 999.999.1.1
    empty: true
  - name: Reject a malformed IP line without changing the file
    fixture_operation: insert_invalid
    parameters:
      ip_address: 198.51.100.1
      canonical_name: recovery.invalid
      aliases: [still.invalid]
    changed: false
    error: >-
      Unhandled exception while executing module: The property
      'IPAddressToString' cannot be found on this object.
      Verify that the property exists.
    empty: true
    text: [malformed fixture.invalid not-an-address]
  - name: Recover with a valid mapping after failure
    fixture_operation: remove_invalid
    parameters:
      ip_address: 198.51.100.1
      canonical_name: recovery.invalid
      aliases: [still.invalid]
    changed: true
    present:
      - ip_address: 198.51.100.1
        canonical_name: recovery.invalid
        aliases: [still.invalid]
  - name: Repeat the recovered mapping
    parameters:
      ip_address: 198.51.100.1
      canonical_name: recovery.invalid
      aliases: [still.invalid]
    changed: false
  - name: Remove the final mapping by address
    parameters: {state: absent, ip_address: 198.51.100.1}
    changed: true
    empty: true
