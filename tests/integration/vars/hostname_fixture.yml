---
hostname_fixture: |
  # Copyright 2026 Joe Lustri
  # SPDX-License-Identifier: GPL-3.0-or-later
  """Keep the original active and pending hostnames across test reboots."""

  import ctypes
  import json
  import os
  import sys
  import types
  import winreg

  assert sys.version_info[:3] == (3, 4, 4)
  WORKSPACE, OPERATION = sys.argv[1:3]
  TEST_NAME = sys.argv[3] if len(sys.argv) > 3 else None
  JOURNAL = os.path.join(WORKSPACE, "hostname-recovery.json")
  HELPER_SOURCES = json.loads({{ hostname_helper_sources | to_json | to_json }})
  HELPER_NAMES = ("legacy_windows_wmi", "legacy_windows_environment",
                  "legacy_windows_hostname")
  KERNEL = ctypes.WinDLL("kernel32", use_last_error=True)
  get_name = KERNEL.GetComputerNameExW
  get_name.restype = ctypes.c_int
  get_name.argtypes = [ctypes.c_int, ctypes.c_wchar_p,
                      ctypes.POINTER(ctypes.c_uint32)]
  COMPUTER_KEY = r"SYSTEM\CurrentControlSet\Control\ComputerName"
  TCPIP_KEY = r"SYSTEM\CurrentControlSet\Services\Tcpip\Parameters"


  def load_helpers():
      for name in HELPER_NAMES:
          if name not in sys.modules:
              module = types.ModuleType(name)
              sys.modules[name] = module
              exec(compile(HELPER_SOURCES[name], name + ".py", "exec"),
                   module.__dict__)
      return sys.modules["legacy_windows_hostname"]


  def native_name(kind):
      size = ctypes.c_uint32()
      if not get_name(kind, None, ctypes.byref(size)):
          if ctypes.get_last_error() != 234:
              raise ctypes.WinError(ctypes.get_last_error())
      buffer = ctypes.create_unicode_buffer(size.value)
      if not get_name(kind, buffer, ctypes.byref(size)):
          raise ctypes.WinError(ctypes.get_last_error())
      return buffer.value


  def registry_name(path, name):
      access = winreg.KEY_QUERY_VALUE | winreg.KEY_WOW64_64KEY
      with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, path, 0, access) as key:
          try:
              value, kind = winreg.QueryValueEx(key, name)
          except FileNotFoundError:
              return {"exists": False}
          return {"exists": True, "type": kind, "value": value}


  def observe():
      load_helpers()
      wmi = sys.modules["legacy_windows_wmi"]
      with wmi.WmiConnection() as connection:
          # XP's provider lacks this property; retain its absence in captures.
          dns_available = sys.getwindowsversion()[:2] != (5, 1)
          if dns_available:
              computers = connection.query(
                  "SELECT DNSHostName FROM Win32_ComputerSystem",
                  ["DNSHostName"])
          else:
              computers = [{"DNSHostName": None}]
          systems = connection.query(
              "SELECT LastBootUpTime FROM Win32_OperatingSystem",
              ["LastBootUpTime"])
      assert len(computers) == len(systems) == 1
      names = {
          "wmi_dns_hostname": computers[0]["DNSHostName"],
          "wmi_dns_available": dns_available,
          "native": {"netbios": native_name(0),
                     "dns_hostname": native_name(1),
                     "physical_netbios": native_name(4),
                     "physical_dns_hostname": native_name(5)},
          "registry": {
              "active": registry_name(COMPUTER_KEY + r"\ActiveComputerName",
                                      "ComputerName"),
              "pending": registry_name(COMPUTER_KEY + r"\ComputerName",
                                       "ComputerName"),
              "hostname": registry_name(TCPIP_KEY, "Hostname"),
              "nv_hostname": registry_name(TCPIP_KEY, "NV Hostname"),
          },
      }
      names["effective_name"] = (names["wmi_dns_hostname"]
                                 if names["wmi_dns_available"] else
                                 names["native"]["dns_hostname"])
      return {"names": names, "boot_id": systems[0]["LastBootUpTime"]}


  def save_journal(state, mode):
      with open(JOURNAL, mode) as stream:
          json.dump(state, stream)
          stream.flush()
          os.fsync(stream.fileno())


  def read_journal():
      with open(JOURNAL) as stream:
          return json.load(stream)


  def backup():
      assert not os.path.exists(JOURNAL), "Recovery journal already exists"
      initial = observe()
      names = initial["names"]
      assert names["registry"]["pending"]["value"].upper() == (
          names["native"]["netbios"].upper()
      ), "An earlier NetBIOS rename is pending"
      assert names["registry"]["nv_hostname"]["value"].upper() == (
          names["native"]["dns_hostname"].upper()
      ), "An earlier DNS hostname rename is pending"
      assert TEST_NAME.upper() != names["effective_name"].upper()
      state = {"initial": initial, "test_name": TEST_NAME, "restored": False}
      save_journal(state, "x")
      assert read_journal() == state, "Recovery journal verification failed"
      return state


  def restore(state):
      initial = state["initial"]["names"]
      if observe()["names"] != initial:
          load_helpers().rename_hostname(initial["effective_name"])
      current = observe()
      return {"reboot_required": current["names"] != initial,
              "snapshot": current}


  def verify(state):
      assert observe()["names"] == state["initial"]["names"], (
          "Original active or pending hostname has not been restored"
      )
      state["restored"] = True
      save_journal(state, "w")


  assert OPERATION in ("setup", "observe", "restore", "verify"), OPERATION
  if OPERATION in ("restore", "verify") and not os.path.exists(JOURNAL):
      print(json.dumps({"restored": True, "reboot_required": False,
                        "backup_created": False}))
      sys.exit(0)
  state = backup() if OPERATION == "setup" else read_journal()
  if OPERATION == "restore":
      print(json.dumps(restore(state)))
  elif OPERATION == "verify":
      verify(state)
      print(json.dumps({"restored": True, "backup_created": True}))
  else:
      print(json.dumps(observe()))
