---
# SPDX-License-Identifier: GPL-3.0-or-later
service_credential_system_cases:
  - name: SCM starts the owned dispatcher with a usable SYSTEM primary token
    params:
      name: '{{ service_names.companion }}'
      path: '{{ service_commands.companion }}'
      start_mode: manual
      state: started
    role: companion
    changed: true
    exists: true
    native_state: 4
    expected_sid: S-1-5-18
service_credential_initial_cases:
  - name: Predict credentialed creation without creating the service
    params: &credentialed_service
      name: '{{ service_names.primary }}'
      path: '{{ service_commands.primary }}'
      start_mode: manual
      username: '.\{{ service_account }}'
      password: '{{ service_password_initial }}'
      update_password: on_create
      state: started
    check: true
    changed: true
    exists: true
  - name: Start a real service with the configured account password
    params: *credentialed_service
    changed: true
    exists: true
    native_state: 4
    expected_sid: '{{ service_user.sid }}'
  - name: On-create credentials preserve running-service idempotence
    params: *credentialed_service
    changed: false
    exists: true
    native_state: 4
    expected_sid: '{{ service_user.sid }}'
service_credential_stop_cases:
  - name: Stop the owned account service before rotating its password
    params: {name: '{{ service_names.primary }}', state: stopped}
    changed: true
    exists: true
    native_state: 1
service_credential_stale_cases:
  - name: A stale stored password cannot start the real service
    params: {name: '{{ service_names.primary }}', state: started}
    changed: false
    failed: true
    exists: false
    native_state: 1
    message: '1069'
service_credential_rotated_cases:
  - name: Update the stored service password and start with the rotated password
    params: &rotated_service
      name: '{{ service_names.primary }}'
      username: '.\{{ service_account }}'
      password: '{{ service_password_rotated }}'
      update_password: always
      state: started
    changed: true
    exists: true
    native_state: 4
    expected_sid: '{{ service_user.sid }}'
  - name: On-create policy does not rewrite an existing rotated password
    params:
      name: '{{ service_names.primary }}'
      username: '.\{{ service_account }}'
      password: '{{ service_password_rotated }}'
      update_password: on_create
      state: started
    changed: false
    exists: true
    native_state: 4
    expected_sid: '{{ service_user.sid }}'
  - name: Check mode predicts a password write without changing credentials
    params:
      name: '{{ service_names.primary }}'
      username: '.\{{ service_account }}'
      password: '{{ service_password_wrong }}'
      update_password: always
      state: started
    check: true
    changed: true
    exists: true
    native_state: 4
    expected_sid: '{{ service_user.sid }}'
  - name: Restart proves the predicted wrong password was not written
    params: {name: '{{ service_names.primary }}', state: restarted}
    changed: true
    exists: true
    native_state: 4
    expected_sid: '{{ service_user.sid }}'
  - name: Stop before testing an actual wrong-password write
    params: {name: '{{ service_names.primary }}', state: stopped}
    changed: true
    exists: true
    native_state: 1
  - name: Wrong configured password produces a genuine logon failure
    params:
      name: '{{ service_names.primary }}'
      username: '.\{{ service_account }}'
      password: '{{ service_password_wrong }}'
      update_password: always
      state: started
    changed: true
    failed: true
    exists: false
    native_state: 1
    message: '1069'
  - name: Recover the service with the correct rotated password
    params: *rotated_service
    changed: true
    exists: true
    native_state: 4
    expected_sid: '{{ service_user.sid }}'
