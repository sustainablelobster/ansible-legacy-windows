---
auto_logon_fixture: |
  # Copyright 2026 sustainablelobster
  # SPDX-License-Identifier: GPL-3.0-or-later
  """Journal secrets with DPAPI and independently observe Winlogon and LSA."""
  import base64
  import ctypes
  import hashlib
  import hmac
  import json
  import os
  import sys
  import types
  import winreg

  assert sys.version_info[:3] == (3, 4, 4)
  WORKSPACE, OPERATION = sys.argv[1:3]
  JOURNAL = os.path.join(WORKSPACE, "auto-logon-recovery.dpapi")
  PATH = r"SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
  NAMES = ("AutoAdminLogon", "DefaultUserName", "DefaultDomainName",
           "AutoLogonCount", "DefaultPassword")
  TEST_PASSWORDS = {"one": "Legacy-Fixture-Only-1!",
                    "two": "Legacy-Fixture-Only-2!", "empty": ""}
  ACCOUNT_SOURCE = {{ auto_logon_account_source | to_json }}
  USERNAME = {{ ansible_user | to_json }}
  ADVAPI = ctypes.WinDLL("advapi32", use_last_error=True)
  KERNEL = ctypes.WinDLL("kernel32", use_last_error=True)
  CRYPT = ctypes.WinDLL("crypt32", use_last_error=True)
  POINTER = ctypes.c_void_p
  DWORD = ctypes.c_uint32

  class Text(ctypes.Structure):
      _fields_ = [("length", ctypes.c_uint16), ("maximum", ctypes.c_uint16),
                  ("buffer", POINTER)]

  class Attributes(ctypes.Structure):
      _fields_ = [("length", DWORD), ("root", POINTER), ("name", POINTER),
                  ("flags", DWORD), ("security", POINTER), ("quality", POINTER)]

  class Blob(ctypes.Structure):
      _fields_ = [("length", DWORD), ("buffer", POINTER)]

  for name, args in {
      "LsaOpenPolicy": [POINTER, ctypes.POINTER(Attributes), DWORD,
                        ctypes.POINTER(POINTER)],
      "LsaRetrievePrivateData": [POINTER, ctypes.POINTER(Text),
                                  ctypes.POINTER(POINTER)],
      "LsaStorePrivateData": [POINTER, ctypes.POINTER(Text),
                              ctypes.POINTER(Text)],
      "LsaClose": [POINTER], "LsaFreeMemory": [POINTER],
      "LsaNtStatusToWinError": [DWORD],
      "RegQueryValueExW": [POINTER, ctypes.c_wchar_p, POINTER,
                            ctypes.POINTER(DWORD), POINTER,
                            ctypes.POINTER(DWORD)],
      "RegSetValueExW": [POINTER, ctypes.c_wchar_p, DWORD, DWORD,
                         POINTER, DWORD],
  }.items():
      function = getattr(ADVAPI, name)
      function.argtypes, function.restype = args, DWORD
  KERNEL.LocalFree.argtypes = [POINTER]
  KERNEL.LocalFree.restype = POINTER
  CRYPT.CryptProtectData.argtypes = [ctypes.POINTER(Blob), ctypes.c_wchar_p,
      POINTER, POINTER, POINTER, DWORD, ctypes.POINTER(Blob)]
  CRYPT.CryptUnprotectData.argtypes = [ctypes.POINTER(Blob), POINTER,
      POINTER, POINTER, POINTER, DWORD, ctypes.POINTER(Blob)]
  CRYPT.CryptProtectData.restype = ctypes.c_int32
  CRYPT.CryptUnprotectData.restype = ctypes.c_int32

  def check(code):
      if code:
          raise ctypes.WinError(code)

  def text(value):
      encoded = value.encode("utf-16-le", "surrogatepass")
      buffer = ctypes.create_string_buffer(encoded)
      result = Text(len(encoded), len(encoded),
                    ctypes.cast(buffer, POINTER))
      result.storage = buffer
      return result

  def secret(write=False, value=None):
      handle, attributes, pointer = POINTER(), Attributes(), POINTER()
      check(ADVAPI.LsaNtStatusToWinError(ADVAPI.LsaOpenPolicy(
          None, ctypes.byref(attributes), 0x24, ctypes.byref(handle))))
      key = text("DefaultPassword")
      try:
          if write:
              record = text(value) if value is not None else None
              status = ADVAPI.LsaStorePrivateData(handle, ctypes.byref(key),
                  ctypes.byref(record) if record is not None else None)
              if status != 0xC0000034 or value is not None:
                  check(ADVAPI.LsaNtStatusToWinError(status))
              return None
          status = ADVAPI.LsaRetrievePrivateData(handle, ctypes.byref(key),
                                                ctypes.byref(pointer))
          if status == 0xC0000034:
              return None
          check(ADVAPI.LsaNtStatusToWinError(status))
          record = ctypes.cast(pointer, ctypes.POINTER(Text)).contents
          return ctypes.string_at(record.buffer, record.length).decode(
              "utf-16-le", "surrogatepass")
      finally:
          if pointer:
              ADVAPI.LsaFreeMemory(pointer)
          ADVAPI.LsaClose(handle)

  def protect(data, decrypt=False):
      buffer = ctypes.create_string_buffer(data)
      source = Blob(len(data), ctypes.cast(buffer, POINTER))
      target = Blob()
      function = CRYPT.CryptUnprotectData if decrypt else CRYPT.CryptProtectData
      try:
          if not function(ctypes.byref(source), None, None, None, None, 1,
                          ctypes.byref(target)):
              raise ctypes.WinError(ctypes.get_last_error())
          return ctypes.string_at(target.buffer, target.length)
      finally:
          if target.buffer:
              KERNEL.LocalFree(target.buffer)

  def open_key(write=False):
      access = winreg.KEY_READ | winreg.KEY_WOW64_64KEY
      if write:
          access |= winreg.KEY_SET_VALUE
      return winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, PATH, 0, access)

  def registry():
      result = {name: None for name in NAMES}
      with open_key() as key:
          for index in range(winreg.QueryInfoKey(key)[1]):
              actual_name = winreg.EnumValue(key, index)[0]
              match = next((name for name in NAMES if name.lower() ==
                            actual_name.lower()), None)
              if match is None:
                  continue
              size, kind = DWORD(), DWORD()
              check(ADVAPI.RegQueryValueExW(int(key), actual_name, None,
                    ctypes.byref(kind), None, ctypes.byref(size)))
              buffer = ctypes.create_string_buffer(size.value)
              check(ADVAPI.RegQueryValueExW(int(key), actual_name, None,
                    ctypes.byref(kind), buffer, ctypes.byref(size)))
              encoded = base64.b64encode(buffer.raw[:size.value])
              result[match] = {"name": actual_name, "kind": kind.value,
                               "data": encoded.decode("ascii")}
      return result

  def restore_values(values):
      with open_key(True) as key:
          for name in NAMES:
              try:
                  winreg.DeleteValue(key, name)
              except OSError as error:
                  if getattr(error, "winerror", error.errno) != 2:
                      raise
          # Restore the activation flag last, after account and password values.
          for name in NAMES[1:] + NAMES[:1]:
              value = values[name]
              if value is not None:
                  raw = base64.b64decode(value["data"])
                  buffer = ctypes.create_string_buffer(raw)
                  check(ADVAPI.RegSetValueExW(int(key), value["name"], 0,
                        value["kind"], buffer, len(raw)))

  def read_journal():
      with open(JOURNAL, "rb") as stream:
          return json.loads(protect(stream.read(), True).decode("utf-8"))

  def backup():
      assert not os.path.exists(JOURNAL), "Recovery journal already exists"
      state = {"registry": registry(), "secret": secret(),
               "proof_key": base64.b64encode(os.urandom(32)).decode("ascii")}
      encoded = protect(json.dumps(state, ensure_ascii=True).encode("utf-8"))
      with open(JOURNAL + ".pending", "xb") as stream:
          stream.write(encoded)
          stream.flush()
          os.fsync(stream.fileno())
      os.rename(JOURNAL + ".pending", JOURNAL)
      assert read_journal() == state, "Encrypted recovery journal differs"
      return state

  def setup():
      state = backup()
      with open_key(True) as key:
          winreg.SetValueEx(key, "AutoAdminLogon", 0, winreg.REG_DWORD, 0)
      secret(True, None)
      baseline = {name: None for name in NAMES}
      baseline["AutoAdminLogon"] = {"name": "AutoAdminLogon", "kind": 4,
                                    "data": "AAAAAA=="}
      plaintext = "Fixture-Plaintext\0".encode("utf-16-le")
      baseline["DefaultPassword"] = {"name": "DefaultPassword", "kind": 1,
          "data": base64.b64encode(plaintext).decode("ascii")}
      restore_values(baseline)
      return state

  def cleanup(state):
      with open_key(True) as key:
          winreg.SetValueEx(key, "AutoAdminLogon", 0, winreg.REG_DWORD, 0)
      secret(True, state["secret"])
      restore_values(state["registry"])
      assert registry() == state["registry"], "Original registry values differ"
      assert secret() == state["secret"], "Original LSA secret differs"

  def observe(state):
      current = registry()
      password = secret()
      safe_values = {}
      with open_key() as key:
          for name in NAMES[:-1]:
              if current[name] is not None:
                  value, kind = winreg.QueryValueEx(key, name)
                  if kind == winreg.REG_DWORD and value >= 2**31:
                      value -= 2**32
                  safe_values[name] = value
      encoded = json.dumps(password, ensure_ascii=True).encode("utf-8")
      return {"registry": safe_values,
          "plaintext_present": current["DefaultPassword"] is not None,
          "secret_present": password is not None,
          "secret_matches": [name for name, value in TEST_PASSWORDS.items()
                             if value == password],
          "secret_proof": hmac.new(base64.b64decode(state["proof_key"]),
                                   encoded, hashlib.sha256).hexdigest()}

  assert OPERATION in ("setup", "observe", "cleanup"), OPERATION
  if OPERATION == "cleanup" and not os.path.exists(JOURNAL):
      print(json.dumps({"restored": True, "backup_created": False}))
      sys.exit(0)
  state = setup() if OPERATION == "setup" else read_journal()
  if OPERATION == "cleanup":
      cleanup(state)
      print(json.dumps({"restored": True, "backup_created": True}))
  else:
      observation = observe(state)
      if OPERATION == "setup":
          account = types.ModuleType("auto_logon_fixture_account")
          exec(compile(ACCOUNT_SOURCE, "fixture_account.py", "exec"),
               account.__dict__)
          canonical = account.sid_to_name(account.account_name_to_sid(USERNAME))
          observation["account"] = canonical.split("\\", 1)
      print(json.dumps(observation, ensure_ascii=True))
