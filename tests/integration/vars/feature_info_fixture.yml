---
feature_info_wmi_source: >-
  {{ lookup('file', playbook_dir +
  '/../../plugins/module_utils/legacy_windows_wmi.py') }}
feature_info_native_source: >-
  {{ lookup('file', playbook_dir +
  '/../../plugins/module_utils/legacy_windows_feature_info.py') }}
feature_info_legacy_source: >-
  {{ lookup('file', playbook_dir +
  '/../../plugins/module_utils/legacy_windows_feature_legacy.py') }}
feature_info_match_source: >-
  {{ lookup('file', playbook_dir +
  '/../../plugins/module_utils/legacy_windows_find_match.py') }}
feature_info_regex_source: >-
  {{ lookup('file', playbook_dir +
  '/../../plugins/module_utils/legacy_windows_regex.py') }}
feature_info_program: |
  import sys,types
  native_wmi = types.ModuleType('legacy_windows_wmi')
  sys.modules['legacy_windows_wmi'] = native_wmi
  exec({{ feature_info_wmi_source | to_json }}, native_wmi.__dict__)
  for helper_name, source in (
          ('legacy_windows_regex', {{ feature_info_regex_source | to_json }}),
          ('legacy_windows_find_match',
           {{ feature_info_match_source | to_json }}),
          ('legacy_windows_feature_legacy',
           {{ feature_info_legacy_source | to_json }})):
      helper = types.ModuleType(helper_name)
      sys.modules[helper_name] = helper
      exec(source, helper.__dict__)
  native_feature = types.ModuleType('feature_info_observer')
  exec({{ feature_info_native_source | to_json }}, native_feature.__dict__)
  WmiConnection = native_wmi.WmiConnection
  {{ feature_info_fixture }}
feature_info_fixture: |
  # SPDX-License-Identifier: GPL-3.0-or-later
  # Observe complete raw provider components separately from public projection.
  import binascii
  import ctypes
  import json
  import os
  import sys
  import tempfile
  import time
  import winreg

  workspace, operation = sys.argv[1:3]
  journal_path = os.path.join(workspace, 'feature-info-journal.json')
  pending_paths = (
      r'SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing'
      r'\RebootPending',
      r'SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update'
      r'\RebootRequired')

  def validate_workspace():
      api = ctypes.WinDLL('kernel32', use_last_error=True)
      api.GetLongPathNameW.argtypes = [ctypes.c_wchar_p, ctypes.c_wchar_p,
                                      ctypes.c_uint32]
      api.GetLongPathNameW.restype = ctypes.c_uint32
      paths = []
      for path in (workspace, tempfile.gettempdir()):
          size = api.GetLongPathNameW(os.path.abspath(path), None, 0)
          if not size:
              raise ctypes.WinError(ctypes.get_last_error())
          buffer = ctypes.create_unicode_buffer(size)
          length = api.GetLongPathNameW(os.path.abspath(path), buffer, size)
          assert 0 < length < size
          paths.append(os.path.normcase(buffer.value))
      assert os.path.basename(paths[0]).startswith(
          'legacy-windows-feature-info-')
      assert os.path.dirname(paths[0]) == paths[1]

  def services():
      with WmiConnection() as connection:
          rows = connection.query('SELECT * FROM Win32_Service',
              ['Name', 'DisplayName', 'StartMode', 'State', 'PathName',
               'StartName'])
      for row in rows:
          if (row['Name'] != 'TrustedInstaller' and
                  'bvsshserver' not in (row['PathName'] or '').lower()):
              del row['State']
      return {row['Name']: row for row in rows}

  def pending():
      result = {}
      for path in pending_paths:
          try:
              key = winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, path)
          except FileNotFoundError:
              result[path] = None
              continue
          with key:
              values = {}
              for index in range(winreg.QueryInfoKey(key)[1]):
                  name, value, kind = winreg.EnumValue(key, index)
                  if isinstance(value, bytes):
                      value = {'hex': binascii.hexlify(value).decode('ascii')}
                  values[name] = [value, kind]
              result[path] = values
      return result

  def catalogue():
      try:
          with WmiConnection(native_feature._NAMESPACE) as connection:
              return native_feature._components(connection)
      except OSError as error:
          if getattr(error, 'hresult', None) != 0x8004100E:
              raise
          return None

  def snapshot():
      return {'features': catalogue(), 'pending': pending(),
              'services': services()}

  def write(record):
      descriptor, temporary = tempfile.mkstemp(
          prefix='.feature-info-journal-', dir=workspace)
      try:
          with os.fdopen(descriptor, 'w', encoding='utf-8') as stream:
              json.dump(record, stream, sort_keys=True)
              stream.flush()
              os.fsync(stream.fileno())
          os.replace(temporary, journal_path)
      finally:
          if os.path.exists(temporary):
              os.remove(temporary)

  def read():
      with open(journal_path, encoding='utf-8') as stream:
          record = json.load(stream)
      assert record['workspace'] == workspace
      return record

  def setup():
      assert not os.path.exists(journal_path)
      before = {'features': None, 'pending': pending(),
                'services': services()}
      record = {'workspace': workspace, 'before': before, 'complete': False}
      write(record)
      before['features'] = catalogue()
      record['complete'] = True
      write(record)
      return {'supported': before['features'] is not None, 'before': before}

  def restore_service(original):
      before = original.get('TrustedInstaller')
      current = services().get('TrustedInstaller')
      if current == before:
          return
      assert before is not None and current is not None
      assert before['State'] == 'Stopped'
      assert {k: v for k, v in before.items() if k != 'State'} == (
          {k: v for k, v in current.items() if k != 'State'})
      api = ctypes.WinDLL('advapi32', use_last_error=True)
      pointer, wide, dword = (ctypes.c_void_p, ctypes.c_wchar_p,
                              ctypes.c_uint32)
      api.OpenSCManagerW.argtypes = [wide, wide, dword]
      api.OpenSCManagerW.restype = pointer
      api.OpenServiceW.argtypes = [pointer, wide, dword]
      api.OpenServiceW.restype = pointer
      api.ControlService.argtypes = [pointer, dword, pointer]
      api.ControlService.restype = ctypes.c_int
      api.CloseServiceHandle.argtypes = [pointer]
      api.CloseServiceHandle.restype = ctypes.c_int
      manager = api.OpenSCManagerW(None, None, 1)
      if not manager:
          raise ctypes.WinError(ctypes.get_last_error())
      handle = None
      try:
          handle = api.OpenServiceW(manager, 'TrustedInstaller', 0x20)
          if not handle:
              raise ctypes.WinError(ctypes.get_last_error())
          status = (dword * 7)()
          if not api.ControlService(handle, 1, status):
              raise ctypes.WinError(ctypes.get_last_error())
          for attempt in range(40):
              if services().get('TrustedInstaller') == before:
                  return
              time.sleep(.25)
          raise ValueError('Servicing service did not restore original state')
      finally:
          if handle:
              api.CloseServiceHandle(handle)
          api.CloseServiceHandle(manager)

  def cleanup():
      if not os.path.exists(journal_path):
          return {'restored': True, 'journal_absent': True}
      record = read()
      before = record['before']
      after = snapshot()
      if record['complete']:
          assert after['features'] == before['features']
      assert after['pending'] == before['pending']
      restore_service(before['services'])
      after['services'] = services()
      assert after['services'] == before['services']
      record['verified'] = True
      write(record)
      # Retain the journal until recorded service and pending state is verified.
      return {'restored': True, 'before': before, 'after': after,
              'setup_incomplete': not record['complete']}

  def finalize():
      if not os.path.exists(journal_path):
          return {'finalized': True, 'journal_absent': True}
      record = read()
      assert record.get('verified') is True
      assert services() == record['before']['services']
      assert pending() == record['before']['pending']
      os.remove(journal_path)
      return {'finalized': True}

  if __name__ == '__main__':
      assert sys.version_info[:3] == (3, 4, 4)
      validate_workspace()
      if operation == 'setup':
          result = setup()
      elif operation == 'observe':
          result = snapshot()
      elif operation == 'cleanup':
          result = cleanup()
      elif operation == 'finalize':
          result = finalize()
      else:
          raise ValueError('Unknown fixture operation')
      print(json.dumps(result, sort_keys=True))
