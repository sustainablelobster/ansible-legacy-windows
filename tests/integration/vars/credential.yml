---
credential_cases:
  - name: absent generic is unchanged
    params:
      name: '{{ credential_names.generic_password }}'
      type: generic_password
      state: absent
    changed: false
    exists: false

  - name: predict generic creation
    params: &generic
      name: '{{ credential_names.generic_password }}'
      type: generic_password
      username: FixtureUser
      secret: Synthetic-Credential-Only-1
    check: true
    changed: true
    exists: false

  - name: create generic credential
    params: *generic
    changed: true
    exists: true
    expected:
      username: FixtureUser
      alias: null
      comment: null
      persistence: 2
      attributes: []
      secret_matches: [one]

  - name: repeat generic creation
    params: *generic
    changed: false
    exists: true

  - name: predict ordered attributes and metadata
    params: &metadata
      <<: *generic
      alias: fixture-alias
      comment: Fixture comment
      persistence: enterprise
      attributes:
        - name: duplicate
          data: '雪'
        - name: duplicate
          data: AAE=
          data_format: base64
    check: true
    changed: true
    exists: true
    expected:
      attributes: []
      secret_matches: [one]

  - name: write ordered attributes and metadata
    params: *metadata
    changed: true
    exists: true
    expected:
      alias: fixture-alias
      comment: Fixture comment
      persistence: 3
      attributes:
        - name: duplicate
          flags: 0
          data: 6Zuq
        - name: duplicate
          flags: 0
          data: AAE=

  - name: repeat ordered attributes and metadata
    params: *metadata
    changed: false
    exists: true

  - name: preserve omitted secret and attributes while changing comment
    params: &preserved
      name: '{{ credential_names.generic_password }}'
      type: generic_password
      username: FixtureUser
      alias: fixture-alias
      comment: FIXTURE COMMENT
      persistence: enterprise
    changed: true
    exists: true
    expected:
      comment: FIXTURE COMMENT
      secret_matches: [one]
      attributes:
        - name: duplicate
          flags: 0
          data: 6Zuq
        - name: duplicate
          flags: 0
          data: AAE=

  - name: alias and username case alone are unchanged
    params:
      <<: *preserved
      alias: FIXTURE-ALIAS
      username: FIXTUREUSER
    changed: false
    exists: true

  - name: predict a replacement secret
    params: &new_secret
      <<: *preserved
      secret: Synthetic-Credential-Only-2
    check: true
    changed: true
    exists: true
    expected:
      secret_matches: [one]

  - name: replace the generic secret
    params: *new_secret
    changed: true
    exists: true
    expected:
      secret_matches: [two]

  - name: on_create does not replace an existing readable secret
    params:
      <<: *preserved
      secret: Synthetic-Credential-Only-1
      update_secret: on_create
    changed: false
    exists: true
    expected:
      secret_matches: [two]

  - name: explicit empty attributes remove all attributes
    params:
      <<: *preserved
      attributes: []
    changed: true
    exists: true
    expected:
      attributes: []
      secret_matches: [two]

  - name: predict generic removal
    params: &remove_generic
      name: '{{ credential_names.generic_password }}'
      type: generic_password
      state: absent
    check: true
    changed: true
    exists: true

  - name: remove generic credential
    params: *remove_generic
    changed: true
    exists: false

  - name: repeat generic removal
    params: *remove_generic
    changed: false
    exists: false

  - name: reject missing username before changing credentials
    params:
      name: '{{ credential_names.generic_password }}'
      type: generic_password
    changed: false
    failed: true
    exists: false
    message: 'state is present but all of the following are missing: username'

  - name: predict domain password creation
    params: &domain
      name: '{{ credential_names.domain_password }}'
      type: domain_password
      username: 'EXAMPLE\FixtureUser'
      secret: Synthetic-Credential-Only-1
    check: true
    changed: true
    exists: false

  - name: create domain password credential
    params: *domain
    changed: true
    exists: true
    expected:
      username: 'EXAMPLE\FixtureUser'
      secret_matches: [empty]

  - name: unreadable domain secret always reports a change
    params: *domain
    changed: true
    exists: true

  - name: on_create skips the unreadable domain secret
    params:
      <<: *domain
      update_secret: on_create
    changed: false
    exists: true

  - name: predict domain certificate creation
    params: &domain_certificate
      name: '{{ credential_names.domain_certificate }}'
      type: domain_certificate
      username: '{{ credential_thumbprint }}'
    check: true
    changed: true
    exists: false

  - name: create domain certificate credential
    params: *domain_certificate
    changed: true
    exists: true
    expected:
      username: '{{ credential_thumbprint }}'
      secret_matches: [empty]

  - name: repeat domain certificate credential
    params: *domain_certificate
    changed: false
    exists: true

  - name: predict generic certificate creation
    params: &generic_certificate
      name: '{{ credential_names.generic_certificate }}'
      type: generic_certificate
      username: '{{ credential_thumbprint }}'
      secret: U3ludGhldGljLVBJTi1Pbmx5
      secret_format: base64
    check: true
    changed: true
    exists: false

  - name: create generic certificate credential
    params: *generic_certificate
    changed: true
    exists: true
    expected:
      username: '{{ credential_thumbprint }}'
      secret_matches: [pin]

  - name: repeat generic certificate credential
    params: *generic_certificate
    changed: false
    exists: true

  - name: reject a missing certificate before changing credentials
    params:
      <<: *generic_certificate
      username: '0000000000000000000000000000000000000000'
    changed: false
    failed: true
    exists: true
    message: Failed to find certificate with the thumbprint
