---
firewall_cases:
  - name: Reject missing required state before accessing profiles
    params: {profiles: [Domain]}
    changed: false
    failed: true
    message: 'missing required arguments: state'
  - name: Reject unknown profiles before mutation
    params: {profiles: [Standard], state: enabled}
    changed: false
    failed: true
    message: 'value of profiles must be one or more of:'
  - name: Reject invalid actions even while disabling
    params: {profiles: [Domain], state: disabled, inbound_action: reject}
    changed: false
    failed: true
    message: 'value of inbound_action must be one of:'
  - name: Read all profiles while selecting none
    params: {profiles: [], state: enabled, outbound_action: block}
    changed: false
  - name: Preserve an explicit null profile list
    params: {profiles: null, state: enabled, inbound_action: allow}
    changed: false
  - name: Preserve requested spelling order and duplicates
    params: {profiles: 'Public, dOmAiN,Public', state: ENABLED}
    returned_profiles: [Public, dOmAiN, Public]
    changed: false
  - name: Predict enabling and both actions without writing
    seed: {profile: Domain, property: Enabled, value: 0}
    params: &domain_actions
      profiles: [Domain]
      state: enabled
      inbound_action: allow
      outbound_action: block
    check: true
    changed: true
  - name: Enable Domain before applying inbound and outbound defaults
    params: *domain_actions
    changed: true
  - name: Repeat enabled Domain and both defaults
    params: *domain_actions
    changed: false
  - name: Predict resetting both configured actions
    params: &domain_reset
      profiles: [Domain]
      state: enabled
      inbound_action: not_configured
      outbound_action: not_configured
    check: true
    changed: true
  - name: Reset both configured actions without changing effective defaults
    params: *domain_reset
    changed: true
  - name: Repeat NotConfigured defaults
    params: *domain_reset
    changed: false
  - name: Disable Domain and ignore both supplied actions
    params: &domain_disable
      profiles: [Domain]
      state: disabled
      inbound_action: allow
      outbound_action: block
    changed: true
  - name: Repeat disabled Domain and ignored actions
    params: *domain_disable
    changed: false
  - name: Preserve explicit null state and its disabled branch
    params: {profiles: [Domain], state: null, inbound_action: block}
    changed: false
  - name: Predict enabling Domain without actions
    params: &domain_enable {profiles: [Domain], state: enabled}
    check: true
    changed: true
  - name: Enable Domain without changing actions
    params: *domain_enable
    changed: true
  - name: Leave NotConfigured enabled enum unchanged while enabling
    seed: {profile: Domain, property: Enabled, value: 2}
    params: *domain_enable
    changed: false
  - name: Leave NotConfigured enabled enum unchanged while disabling
    params: {profiles: [Domain], state: disabled}
    changed: false
  - name: Apply inbound action even with NotConfigured enabled enum
    params: {profiles: [Domain], state: enabled, inbound_action: block}
    changed: true
  - name: Repeat action without converting NotConfigured enabled enum
    params: {profiles: [Domain], state: enabled, inbound_action: block}
    changed: false
  - name: Reset action while restoring the fixture enabled enum
    seed: {profile: Domain, property: Enabled, value: 1}
    params: *domain_reset
    changed: true
  - name: Predict disabling Private
    params: &private_disable {profiles: [Private], state: disabled}
    check: true
    changed: true
  - name: Disable inactive Private
    params: *private_disable
    changed: true
  - name: Repeat disabled Private
    params: *private_disable
    changed: false
  - name: Predict enabling Private and both default actions
    params: &private_actions
      profiles: [Private]
      state: enabled
      inbound_action: block
      outbound_action: allow
    check: true
    changed: true
  - name: Enable Private and both default actions
    params: *private_actions
    changed: true
  - name: Repeat enabled Private actions
    params: *private_actions
    changed: false
  - name: Reset Private configured actions
    params:
      profiles: [Private]
      state: enabled
      inbound_action: not_configured
      outbound_action: not_configured
    changed: true
  - name: Predict disabling active Public without changing connectivity
    params: {profiles: [Public], state: disabled}
    check: true
    changed: true
  - name: Read enabled active Public without action changes
    params: {profiles: [Public], state: enabled}
    changed: false
  - name: Disable both inactive profiles in fixed native order
    params: {profiles: [Private, Domain, PRIVATE], state: disabled}
    changed: true
  - name: Enable all profiles using the default profile list
    params: {state: enabled}
    changed: true
  - name: Repeat the default all-profile request
    params: {state: enabled}
    changed: false

firewall_unsupported_cases:
  - name: Reject the unavailable modern three-profile contract
    params: {state: enabled}
    changed: false
    failed: true
    message: Private/Public profiles are unavailable
  - name: Reject an unavailable Private profile without aliasing Standard
    params: {profiles: [Private], state: disabled}
    changed: false
    failed: true
    message: Private/Public profiles are unavailable
  - name: Read classic Domain without selecting or aliasing profiles
    params: {profiles: [], state: enabled}
    check: true
    changed: false
