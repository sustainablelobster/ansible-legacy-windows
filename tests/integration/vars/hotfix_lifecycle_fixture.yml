---
hotfix_lifecycle_helper_names:
  - legacy_windows_regex
  - legacy_windows_find_match
  - legacy_windows_wmi
  - legacy_windows_hotfix_command
  - legacy_windows_hotfix
  - legacy_windows_package_signature
hotfix_lifecycle_program: |
  import base64, json, sys, types
  {% for helper in hotfix_lifecycle_helper_names %}
  helper = types.ModuleType('{{ helper }}')
  sys.modules['{{ helper }}'] = helper
  exec(compile(base64.b64decode(
      '{{ lookup('ansible.builtin.file',
         (hotfix_lifecycle_source_root | default(playbook_dir + '/../..'))
         + '/legacy_windows/' +
         'plugins/module_utils/' + helper + '.py') | b64encode }}'),
      '{{ helper }}.py', 'exec'), helper.__dict__)
  {% endfor %}
  {{ lookup('ansible.builtin.file',
     (hotfix_lifecycle_source_root | default(playbook_dir + '/../..'))
     + '/tests/integration/fixtures/hotfix_lifecycle.py') }}
