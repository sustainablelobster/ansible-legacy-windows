---
eventlog_fixture: |
  import binascii
  import ctypes
  import json
  import os
  import re
  import sys
  import uuid
  import winreg

  ROOT = r'SYSTEM\CurrentControlSet\Services\EventLog'
  workspace, operation = sys.argv[1:3]
  journal_path = os.path.join(workspace, 'eventlog-recovery.json')
  api = ctypes.WinDLL('advapi32', use_last_error=True)
  api.OpenEventLogW.argtypes = [ctypes.c_wchar_p, ctypes.c_wchar_p]
  api.OpenEventLogW.restype = ctypes.c_void_p
  api.GetNumberOfEventLogRecords.argtypes = [
      ctypes.c_void_p, ctypes.POINTER(ctypes.c_uint32)]
  api.GetNumberOfEventLogRecords.restype = ctypes.c_int
  api.ClearEventLogW.argtypes = [ctypes.c_void_p, ctypes.c_wchar_p]
  api.ClearEventLogW.restype = ctypes.c_int
  api.CloseEventLog.argtypes = [ctypes.c_void_p]
  api.CloseEventLog.restype = ctypes.c_int
  api.RegisterEventSourceW.argtypes = [ctypes.c_wchar_p, ctypes.c_wchar_p]
  api.RegisterEventSourceW.restype = ctypes.c_void_p
  api.ReportEventW.argtypes = [
      ctypes.c_void_p, ctypes.c_uint16, ctypes.c_uint16, ctypes.c_uint32,
      ctypes.c_void_p, ctypes.c_uint16, ctypes.c_uint32,
      ctypes.POINTER(ctypes.c_wchar_p), ctypes.c_void_p]
  api.ReportEventW.restype = ctypes.c_int
  api.DeregisterEventSource.argtypes = [ctypes.c_void_p]
  api.DeregisterEventSource.restype = ctypes.c_int

  def names(key):
      return [winreg.EnumKey(key, index)
              for index in range(winreg.QueryInfoKey(key)[0])]

  def values(key):
      result = {}
      for index in range(winreg.QueryInfoKey(key)[1]):
          name, value, kind = winreg.EnumValue(key, index)
          if isinstance(value, bytes):
              value = {'hex': binascii.hexlify(value).decode('ascii')}
          result[name] = [value, kind]
      return result

  def registered(log):
      try:
          key = winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, ROOT + '\\' + log)
      except OSError as error:
          if error.winerror == 2:
              return None
          raise
      with key:
          result = {'values': values(key), 'sources': {},
                    'source_order': names(key)}
          for source in result['source_order']:
              with winreg.OpenKey(key, source) as child:
                  result['sources'][source] = values(child)
      handle = api.OpenEventLogW(None, log)
      if not handle:
          raise ctypes.WinError(ctypes.get_last_error())
      try:
          count = ctypes.c_uint32()
          if not api.GetNumberOfEventLogRecords(handle, ctypes.byref(count)):
              raise ctypes.WinError(ctypes.get_last_error())
          result['entries'] = count.value
      finally:
          api.CloseEventLog(handle)
      return result

  def file_paths(log):
      system = os.environ['SystemRoot']
      return [os.path.join(system, 'System32', 'config', log[:8] + '.evt'),
              os.path.join(system, 'System32', 'winevt', 'Logs', log + '.evtx')]

  def setup():
      if os.path.exists(journal_path):
          raise ValueError('Existing recovery journal must not be overwritten')
      log = uuid.uuid4().hex[:8] + 'LegacyEventLog'
      missing = uuid.uuid4().hex[:8] + 'Missing EventLog'
      sources = [log + 'Source1', log + 'Source2', log + 'Partial']
      with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, ROOT) as key:
          existing_logs = names(key)
          for candidate in (log, missing):
              if any(item[:8].lower() == candidate[:8].lower()
                     for item in existing_logs):
                  raise ValueError('Owned log prefix already exists')
          for item in existing_logs:
              with winreg.OpenKey(key, item) as child:
                  existing_sources = names(child)
              if any(source.lower() in
                     [name.lower() for name in existing_sources]
                     for source in sources +
                     [log, missing, missing + 'Source']):
                  raise ValueError('Owned source name already exists')
      paths = file_paths(log) + file_paths(missing)
      if any(os.path.exists(path) for path in paths):
          raise ValueError('Owned log file already exists')
      message_paths = [os.path.join(
          os.environ['SystemRoot'], 'Microsoft.NET', directory, version,
          'EventLogMessages.dll') for directory in ('Framework', 'Framework64')
          for version in ('v2.0.50727', 'v4.0.30319')]
      record = {'workspace': os.path.abspath(workspace),
                'log': log, 'missing': missing,
                'sources': sources, 'files': paths,
                'pointer_bits': ctypes.sizeof(ctypes.c_void_p) * 8,
                'message_resources': {path: os.path.exists(path)
                                      for path in message_paths},
                'originally_absent': True}
      with open(journal_path, 'x') as stream:
          json.dump(record, stream)
          stream.flush()
          os.fsync(stream.fileno())
      with open(journal_path) as stream:
          assert json.load(stream) == record
      return record

  def journal():
      with open(journal_path) as stream:
          record = json.load(stream)
      if (record.get('workspace') != os.path.abspath(workspace)
              or record.get('originally_absent') is not True):
          raise ValueError('Recovery journal does not own this workspace')
      expected = file_paths(record['log']) + file_paths(record['missing'])
      if record['files'] != expected:
          raise ValueError('Recovery journal does not own these log files')
      if (not re.match(r'^[0-9a-f]{8}LegacyEventLog$', record['log']) or
              not re.match(r'^[0-9a-f]{8}Missing EventLog$',
                           record['missing'])):
          raise ValueError('Recovery journal does not own these log names')
      if record['sources'] != [record['log'] + suffix
                               for suffix in ('Source1', 'Source2', 'Partial')]:
          raise ValueError('Recovery journal does not own these source names')
      return record

  def observe(record):
      return {'log': registered(record['log']),
              'missing': registered(record['missing'])}

  def probe_registration(name):
      with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, ROOT) as key:
          return any(child.lower() == name.lower() for child in names(key))

  def write(record):
      if registered(record['log']) is None:
          raise ValueError('Owned log must exist before writing')
      handle = api.RegisterEventSourceW(None, record['sources'][0])
      if not handle:
          raise ctypes.WinError(ctypes.get_last_error())
      try:
          strings = (ctypes.c_wchar_p * 1)('Owned Python 3.4.4 Event Log')
          if not api.ReportEventW(
                  handle, 4, 0, 12345, None, 1, 0, strings, None):
              raise ctypes.WinError(ctypes.get_last_error())
      finally:
          api.DeregisterEventSource(handle)
      if registered(record['log'])['entries'] != 1:
          raise ValueError('Owned event was not written to the owned log')
      return {'written': True}

  def delete_tree(parent, name):
      with winreg.OpenKey(
              parent, name, 0, winreg.KEY_READ | winreg.KEY_WRITE) as child:
          for item in names(child):
              delete_tree(child, item)
      winreg.DeleteKey(parent, name)

  def cleanup(record):
      for log in (record['log'], record['missing']):
          if registered(log) is not None:
              # Recovery deletes only owned files. It must not clear through
              # OpenEventLog's Application fallback for an undiscovered log.
              with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, ROOT, 0,
                                  winreg.KEY_READ | winreg.KEY_WRITE) as key:
                  delete_tree(key, log)
      retained = []
      for path in record['files']:
          if os.path.exists(path):
              try:
                  os.remove(path)
              except OSError as error:
                  if error.winerror not in (5, 32):
                      raise
                  retained.append(path)
      if observe(record) != {'log': None, 'missing': None}:
          raise ValueError('Owned log registration remains after cleanup')
      if retained:
          return {'restored': False, 'requires_reboot': True,
                  'retained': retained}
      if any(os.path.exists(path) for path in record['files']):
          raise ValueError('Owned log file remains after cleanup')
      os.remove(journal_path)
      return {'restored': True, 'requires_reboot': False}

  def main():
      assert sys.version_info[:3] == (3, 4, 4)
      if operation == 'setup':
          return setup()
      if operation == 'cleanup' and not os.path.exists(journal_path):
          return {'restored': True, 'requires_reboot': False}
      record = journal()
      if operation == 'observe':
          return observe(record)
      if operation == 'observe_protected':
          result = observe(record)
          result['protected'] = {
              name: registered(name)
              for name in ('Application', 'Security', 'System')}
          result['rejected_registered'] = probe_registration(sys.argv[3])
          return result
      if operation == 'write':
          return write(record)
      if operation == 'cleanup':
          return cleanup(record)
      raise ValueError('Unknown Event Log fixture operation')

  if __name__ == '__main__':
      print(json.dumps(main()))
