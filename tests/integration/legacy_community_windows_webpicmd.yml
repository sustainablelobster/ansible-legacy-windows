- name: Verify a real configured WebPI product lifecycle
  hosts: legacy_community_windows_webpi
  gather_facts: false
  tasks:
    - name: Require an owned vendor product fixture and recovery procedure
      ansible.builtin.assert:
        that:
          - community_webpi_product is defined

    - name: Confirm unsupported check mode does not install the product
      sustainablelobster.legacy_community_windows.win_webpicmd:
        name: '{{ community_webpi_product }}'
      check_mode: true
      register: community_webpi_preview

    - name: Install the actual vendor product
      sustainablelobster.legacy_community_windows.win_webpicmd:
        name: '{{ community_webpi_product }}'
      register: community_webpi_installed

    - name: Repeat the actual vendor product installation
      sustainablelobster.legacy_community_windows.win_webpicmd:
        name: '{{ community_webpi_product }}'
      register: community_webpi_repeated

    - name: Verify explicit check-mode skip and unchanged repeat
      ansible.builtin.assert:
        that:
          - community_webpi_preview.skipped
          - not community_webpi_preview.changed
          - not community_webpi_repeated.changed
