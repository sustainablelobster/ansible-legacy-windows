---
- name: Verify owned Credential Manager entries and recover original absence
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/credential.yml
    - vars/credential_fixture.yml
  vars:
    credential_capture:
      results: '{{ credential_capture_results }}'
      workspace: '{{ credential_workspace.path | default(none) }}'
      setup:
        rc: '{{ credential_setup.rc | default(none) }}'
        stdout: '{{ credential_setup.stdout | default("") }}'
        stderr: '{{ credential_setup.stderr | default("") }}'
      cleanup:
        rc: '{{ credential_cleanup.rc | default(none) }}'
        stdout: '{{ credential_cleanup.stdout | default("") }}'
        stderr: '{{ credential_cleanup.stderr | default("") }}'
      staging_before: '{{ credential_staging_before.stdout | default("") }}'
      staging_after: '{{ credential_staging_after.stdout | default("") }}'
  tasks:
    - name: Allocate a unique private controller evidence file
      ansible.builtin.tempfile:
        state: file
        prefix: credential-{{ inventory_hostname }}-
        suffix: .json
        path: '{{ playbook_dir }}/../../tmp'
      register: credential_capture_file
      delegate_to: localhost
      vars: &capture_connection
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
      changed_when: false
      check_mode: false

    - name: Record the private evidence location
      ansible.builtin.debug:
        msg: 'Credential evidence: {{ credential_capture_file.path }}'

    - name: Initialize credential evidence
      ansible.builtin.set_fact:
        credential_capture_results: []

    - name: Require Python 3.4.4 and record existing staging directories
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob, json, os, sys, tempfile;
        assert sys.version_info[:3] == (3, 4, 4);
        print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
        'ansible-tmp-*')))))""
      register: credential_staging_before
      changed_when: false

    - name: Exercise only uniquely owned credential targets
      block:
        - name: Allocate an owned recovery workspace
          sustainablelobster.legacy_windows.win_tempfile:  # noqa: args[module]
            state: directory
            prefix: legacy-windows-credential-
          register: credential_workspace
          check_mode: false

        - name: Verify absence and journal owned credentials and certificate
          sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-'
              - '{{ credential_workspace.path }}'
              - setup
            stdin: '{{ credential_fixture }}'
          register: credential_setup
          changed_when: true
          check_mode: false
          no_log: true

        - name: Retain owned target names and certificate thumbprint
          ansible.builtin.set_fact:
            credential_names: >-
              {{ (credential_setup.stdout | from_json).names }}
            credential_thumbprint: >-
              {{ (credential_setup.stdout | from_json).thumbprint }}
            credential_unavailable: >-
              {{ (credential_setup.stdout | from_json).unavailable }}

        - name: Exercise public behavior and independent observations
          ansible.builtin.include_tasks: tasks/win_credential_case.yml
          loop: '{{ credential_cases }}'
          loop_control:
            loop_var: credential_case
            label: '{{ credential_case.name }}'
      always:
        - name: Recover owned resources and retain cleanup evidence
          block:
            - name: Recover original absence before deleting the journal
              when: credential_workspace.path is defined
              block:
                - name: Remove owned credential resources # noqa: args[module]
                  sustainablelobster.legacy_windows.win_command:
                    argv:
                      - '{{ ansible_python_interpreter }}'
                      - '-'
                      - '{{ credential_workspace.path }}'
                      - cleanup
                    stdin: '{{ credential_fixture }}'
                  register: credential_cleanup
                  changed_when: true
                  check_mode: false
                  no_log: true

                - name: Require absence before removing recovery material
                  ansible.builtin.assert:
                    that:
                      - (credential_cleanup.stdout | from_json).restored

                - name: Remove verified owned workspace # noqa: args[module]
                  sustainablelobster.legacy_windows.win_file:
                    path: '{{ credential_workspace.path }}'
                    state: absent
                  check_mode: false

            - name: Independently verify workspace and staging cleanup
              ansible.builtin.raw: >-
                cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
                "import glob, json, os, sys, tempfile;
                assert not os.path.exists(sys.argv[1]);
                print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
                'ansible-tmp-*')))))" "{{ credential_workspace.path }}""
              when: credential_workspace.path is defined
              register: credential_staging_after
              changed_when: false
              check_mode: false

            - name: Require staging-directory cleanup
              ansible.builtin.assert:
                that:
                  - >-
                    (credential_staging_before.stdout | from_json)
                    == (credential_staging_after.stdout | from_json)
              when: credential_workspace.path is defined
          always:
            - name: Retain complete private credential evidence after cleanup
              ansible.builtin.copy:
                content: '{{ credential_capture | to_nice_json }}'
                dest: '{{ credential_capture_file.path }}'
                mode: '0600'
              delegate_to: localhost
              vars: *capture_connection
              changed_when: false
              no_log: true
