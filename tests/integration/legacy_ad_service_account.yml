---
# Copyright 2026 sustainablelobster
# SPDX-License-Identifier: GPL-3.0-or-later
# Requires an owned writable gMSA-capable directory and an effective KDS key.
# Password probes emit only status, length and nonsecret BLOB header checks.
# MS-ADTS 3.1.1.4.4 treats denied extended attributes as absent from results.
- name: Verify public gMSA lifecycle and retrieval rights on Python 3.4.4
  hosts: legacy_ad_service_account
  gather_facts: false
  module_defaults:
    group/sustainablelobster.legacy_ad.domain:
      domain_server: '{{ ad_domain_server }}'
      domain_username: '{{ ad_domain_username }}'
      domain_password: '{{ ad_domain_password }}'
  tasks:
    - name: Allocate unique identities on the actual minimum target runtime
      sustainablelobster.legacy_windows.win_command:
        argv:
          - '{{ ansible_python_interpreter }}'
          - -c
          - >-
            import json,sys,uuid;
            print(json.dumps({'python':list(sys.version_info[:3]),
            'name':'LGSA'+uuid.uuid4().hex[:10]}))
      changed_when: false
      register: ad_gmsa_runtime

    - name: Require actual Python 3.4.4 and freeze the owned prefix
      ansible.builtin.assert:
        that: (ad_gmsa_runtime.stdout | from_json).python == [3, 4, 4]

    - name: Record only the fresh fixture identity
      ansible.builtin.set_fact:
        ad_gmsa_name: '{{ (ad_gmsa_runtime.stdout | from_json).name }}'

    - name: Independently require the complete fixture namespace absent
      sustainablelobster.legacy_ad.object_info:
        filter: >-
          Name -eq '{{ ad_gmsa_name }}' -or
          Name -eq '{{ ad_gmsa_name }}Out' -or
          sAMAccountName -eq '{{ ad_gmsa_name }}$' -or
          sAMAccountName -eq '{{ ad_gmsa_name }}Out$' -or
          sAMAccountName -eq '{{ ad_gmsa_name }}A' -or
          sAMAccountName -eq '{{ ad_gmsa_name }}B'
      register: ad_gmsa_initial

    - name: Refuse to adopt existing directory fixtures
      ansible.builtin.assert:
        that: ad_gmsa_initial.objects == []

    - name: Locate the exact installed LDAP helper for the bounded observer
      ansible.builtin.command:
        argv:
          - '{{ ansible_playbook_python }}'
          - -c
          - >-
            import json;
            from ansible.plugins.loader import init_plugin_loader;
            init_plugin_loader();
            import ansible_collections.sustainablelobster.legacy_ad as ad;
            print(json.dumps(list(ad.__path__)[0]))
      delegate_to: localhost
      become: false
      changed_when: false
      register: ad_gmsa_collection

    - name: Exercise only acquired accounts and always clean their resources
      block:
        - name: Acquire the unique user fixture OU
          sustainablelobster.legacy_ad.ou:
            name: '{{ ad_gmsa_name }}'
            path: '{{ ad_domain_dn }}'
          register: ad_gmsa_ou

        - name: Create distinct enabled retrieval-test users
          sustainablelobster.legacy_ad.user:
            name: '{{ ad_gmsa_name }}{{ item.suffix }}'
            path: '{{ ad_gmsa_ou.distinguished_name }}'
            sam_account_name: '{{ ad_gmsa_name }}{{ item.suffix }}'
            upn: '{{ ad_gmsa_name }}{{ item.suffix }}@{{ ad_domain_name }}'
            password: '{{ item.password }}'
            enabled: true
          loop:
            - suffix: A
              password: '{{ ad_gmsa_allowed_password }}'
            - suffix: B
              password: '{{ ad_gmsa_denied_password }}'
          no_log: true
          register: ad_gmsa_users

        - name: Acquire one temporary native observer directory
          sustainablelobster.legacy_windows.win_tempfile:
            state: directory
            prefix: legacy-ad-gmsa-read-
          register: ad_gmsa_observer

        - name: Stage only the exact installed signed and sealed LDAP helper
          sustainablelobster.legacy_windows.win_copy:
            src: >-
              {{ ad_gmsa_collection.stdout | from_json
              }}/plugins/module_utils/legacy_ad_ldap.py
            dest: '{{ ad_gmsa_observer.path }}\legacy_ad_ldap.py'

        - name: Predict default-container gMSA creation without a write
          sustainablelobster.legacy_ad.service_account: &ad_gmsa_create
            name: '{{ ad_gmsa_name }}'
            dns_hostname: '{{ ad_gmsa_name }}.{{ ad_domain_name }}'
            allowed_to_retrieve_password:
              set:
                - name: '{{ ad_gmsa_users.results[0].object_guid }}'
                  server: '{{ ad_domain_server }}'
            kerberos_encryption_types:
              set: [aes128, aes256]
            spn:
              set: ['HOST/{{ ad_gmsa_name }}.{{ ad_domain_name }}']
          check_mode: true
          diff: true
          register: ad_gmsa_preview

        - name: Independently read the predicted account's absence
          sustainablelobster.legacy_ad.object_info:
            identity: '{{ ad_gmsa_preview.distinguished_name }}'
          register: ad_gmsa_preview_absent

        - name: Verify the creation prediction and upstream dummy identifiers
          ansible.builtin.assert:
            that:
              - ad_gmsa_preview.changed
              - >-
                ad_gmsa_preview.object_guid ==
                '00000000-0000-0000-0000-000000000000'
              - ad_gmsa_preview.sid == 'S-1-5-0000'
              - ad_gmsa_preview_absent.objects == []

        - name: Create the gMSA in its advertised other-well-known container
          sustainablelobster.legacy_ad.service_account: *ad_gmsa_create
          register: ad_gmsa_created

        - name: Repeat creation without regenerating a client-side password
          sustainablelobster.legacy_ad.service_account: *ad_gmsa_create
          register: ad_gmsa_repeated

        - name: Independently read the acquired gMSA's public attributes
          sustainablelobster.legacy_ad.object_info:
            identity: '{{ ad_gmsa_created.object_guid }}'
            properties:
              - objectSid
              - sAMAccountName
              - dNSHostName
              - userAccountControl
              - msDS-ManagedPasswordInterval
              - msDS-SupportedEncryptionTypes
              - msDS-GroupMSAMembership
              - servicePrincipalName
          register: ad_gmsa_observed

        - name: Require native identity, default interval and idempotence
          ansible.builtin.assert:
            that:
              - ad_gmsa_created.changed
              - not ad_gmsa_repeated.changed
              - ad_gmsa_observed.objects | length == 1
              - >-
                ad_gmsa_observed.objects[0].ObjectClass ==
                'msDS-GroupManagedServiceAccount'
              - >-
                ad_gmsa_observed.objects[0].ObjectGUID ==
                ad_gmsa_created.object_guid
              - ad_gmsa_observed.objects[0].objectSid.Sid == ad_gmsa_created.sid
              - >-
                ad_gmsa_observed.objects[0].sAMAccountName ==
                ad_gmsa_name ~ '$'
              - >-
                ad_gmsa_observed.objects[0]['msDS-ManagedPasswordInterval']
                == 30
              - >-
                ad_gmsa_observed.objects[0]['msDS-SupportedEncryptionTypes']
                == 24
              - >-
                ad_gmsa_observed.objects[0]['msDS-GroupMSAMembership'] ==
                'O:BAD:(A;;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;'
                ~ ad_gmsa_users.results[0].sid ~ ')'

        - name: Read the managed password under fresh distinct user credentials
          sustainablelobster.legacy_windows.win_command: &ad_gmsa_probe
            argv:
              - '{{ ansible_python_interpreter }}'
              - -c
              - |
                import ctypes, json, struct, sys
                sys.path.insert(0, sys.argv[1])
                from legacy_ad_ldap import LDAPConnection, LDAPError, SCOPE_BASE
                settings = json.load(sys.stdin)
                with LDAPConnection(settings['server'], settings['username'],
                                    settings['password']) as connection:
                    getter = connection.library.ldap_get_optionW
                    getter.argtypes = [ctypes.c_void_p, ctypes.c_int,
                                       ctypes.c_void_p]
                    getter.restype = ctypes.c_uint32
                    protection = []
                    for option in (0x95, 0x96):
                        value = ctypes.c_uint32()
                        assert getter(connection.handle, option,
                                      ctypes.byref(value)) == 0
                        protection.append(value.value)
                    ordinary = connection.search(settings['dn'], SCOPE_BASE,
                                                 '(objectClass=*)',
                                                 ['objectGUID'])
                    assert (len(ordinary) == 1 and ordinary[0]['dn'].lower()
                            == settings['dn'].lower())
                    result = {'python': list(sys.version_info[:3]),
                              'ordinary_dn': ordinary[0]['dn'],
                              'signing': protection[0],
                              'encryption': protection[1], 'ldap_error': 0,
                              'blob_values': 0, 'blob_lengths': [],
                              'valid_headers': []}
                    try:
                        rows = connection.search(settings['dn'], SCOPE_BASE,
                                                 '(objectClass=*)',
                                                 ['msDS-ManagedPassword'])
                        values = rows[0]['attributes'].get(
                            'msDS-ManagedPassword', [])
                        result['blob_values'] = len(values)
                        for value in values:
                            header = struct.unpack_from('<HHIHHHH', value)
                            result['blob_lengths'].append(len(value))
                            result['valid_headers'].append(
                                header[0] == 1 and header[2] == len(value)
                                and 16 <= header[3] < len(value))
                    except LDAPError as error:
                        result['ldap_error'] = error.errno
                print(json.dumps(result))
              - '{{ ad_gmsa_observer.path }}'
            stdin: >-
              {{ {'server': ad_domain_server,
              'username': ad_gmsa_name ~ item.suffix ~ '@' ~ ad_domain_name,
              'password': item.password,
              'dn': ad_gmsa_created.distinguished_name}
              | to_json }}
          loop:
            - suffix: A
              password: '{{ ad_gmsa_allowed_password }}'
            - suffix: B
              password: '{{ ad_gmsa_denied_password }}'
          changed_when: false
          no_log: true
          register: ad_gmsa_reads

        - name: Journal only nonsecret retrieval status and BLOB metadata
          ansible.builtin.debug:
            msg: >-
              {{ ad_gmsa_reads.results | map(attribute='stdout') |
              map('from_json') | list }}

        - name: Require an allowed BLOB and a denied managed-password read
          ansible.builtin.assert:
            that:
              - (ad_gmsa_reads.results[0].stdout | from_json).blob_values == 1
              - >-
                (ad_gmsa_reads.results[0].stdout | from_json).valid_headers ==
                [true]
              - (ad_gmsa_reads.results[0].stdout | from_json).ldap_error == 0
              - (ad_gmsa_reads.results[1].stdout | from_json).ldap_error == 0
              - (ad_gmsa_reads.results[1].stdout | from_json).blob_values == 0
          no_log: true

        - name: Require signing and encryption on both authenticated probes
          ansible.builtin.assert:
            that:
              - (item.stdout | from_json).python == [3, 4, 4]
              - (item.stdout | from_json).signing == 1
              - (item.stdout | from_json).encryption == 1
          loop: '{{ ad_gmsa_reads.results }}'
          no_log: true

        - name: Predict clearing retrieval permission without changing it
          sustainablelobster.legacy_ad.service_account: &ad_gmsa_clear
            identity: '{{ ad_gmsa_created.object_guid }}'
            allowed_to_retrieve_password:
              set: []
          check_mode: true
          diff: true
          register: ad_gmsa_clear_preview

        - name: Freshly prove the clear preview did not revoke retrieval
          sustainablelobster.legacy_windows.win_command: *ad_gmsa_probe
          loop:
            - suffix: A
              password: '{{ ad_gmsa_allowed_password }}'
          changed_when: false
          no_log: true
          register: ad_gmsa_preview_read

        - name: Require the preview to preserve real password authorization
          ansible.builtin.assert:
            that:
              - >-
                (ad_gmsa_preview_read.results[0].stdout | from_json).blob_values
                == 1
              - >-
                (ad_gmsa_preview_read.results[0].stdout | from_json).ldap_error
                == 0
          no_log: true

        - name: Clear the retrieval principals
          sustainablelobster.legacy_ad.service_account: *ad_gmsa_clear
          register: ad_gmsa_cleared

        - name: Repeat clearing retrieval principals unchanged
          sustainablelobster.legacy_ad.service_account: *ad_gmsa_clear
          register: ad_gmsa_clear_repeated

        - name: Require preview and real clear followed by idempotence
          ansible.builtin.assert:
            that:
              - ad_gmsa_clear_preview.changed
              - ad_gmsa_cleared.changed
              - not ad_gmsa_clear_repeated.changed

        - name: Freshly observe the cleared principal's denied retrieval
          sustainablelobster.legacy_windows.win_command: *ad_gmsa_probe
          loop:
            - suffix: A
              password: '{{ ad_gmsa_allowed_password }}'
          changed_when: false
          no_log: true
          register: ad_gmsa_cleared_read

        - name: Require clearing to revoke real password authorization
          ansible.builtin.assert:
            that:
              - >-
                (ad_gmsa_cleared_read.results[0].stdout | from_json).blob_values
                == 0
              - >-
                (ad_gmsa_cleared_read.results[0].stdout | from_json).ldap_error
                == 0
          no_log: true

        - name: Create an outbound-only account without a dollar suffix
          sustainablelobster.legacy_ad.service_account: &ad_gmsa_outbound
            name: '{{ ad_gmsa_name }}Out'
            path: '{{ ad_gmsa_ou.distinguished_name }}'
            outbound_auth_only: true
            sam_account_name: '{{ ad_gmsa_name }}Out'
            do_not_append_dollar_to_sam: true
            enabled: false
          register: ad_gmsa_outbound_created

        - name: Repeat outbound-only creation unchanged
          sustainablelobster.legacy_ad.service_account: *ad_gmsa_outbound
          register: ad_gmsa_outbound_repeated

        - name: Read outbound-only native state
          sustainablelobster.legacy_ad.object_info:
            identity: '{{ ad_gmsa_outbound_created.object_guid }}'
            properties: [sAMAccountName, dNSHostName, userAccountControl]
          register: ad_gmsa_outbound_observed

        - name: Require no DNS name and the exact unsuffixed SAM name
          ansible.builtin.assert:
            that:
              - ad_gmsa_outbound_created.changed
              - not ad_gmsa_outbound_repeated.changed
              - >-
                ad_gmsa_outbound_observed.objects[0].sAMAccountName ==
                ad_gmsa_name ~ 'Out'
              - ad_gmsa_outbound_observed.objects[0].dNSHostName is none
              - ad_gmsa_outbound_observed.objects[0].userAccountControl == 4098

      always:
        - name: Independently acquire exact fresh account identities for cleanup
          sustainablelobster.legacy_ad.object_info:
            filter: >-
              ObjectClass -eq 'msDS-GroupManagedServiceAccount' -and
              (Name -eq '{{ ad_gmsa_name }}' -or
              Name -eq '{{ ad_gmsa_name }}Out')
          register: ad_gmsa_cleanup_accounts

        - name: Refuse ambiguous account ownership before removal
          ansible.builtin.assert:
            that:
              - ad_gmsa_cleanup_accounts.objects | length <= 2
              - item.Name in [ad_gmsa_name, ad_gmsa_name ~ 'Out']
              - >-
                item.Name != ad_gmsa_name or ad_gmsa_created is not defined or
                ad_gmsa_created.object_guid is not defined or
                ad_gmsa_created.object_guid ==
                '00000000-0000-0000-0000-000000000000' or
                item.ObjectGUID == ad_gmsa_created.object_guid
              - >-
                item.Name != ad_gmsa_name ~ 'Out' or
                ad_gmsa_outbound_created is not defined or
                ad_gmsa_outbound_created.object_guid is not defined or
                ad_gmsa_outbound_created.object_guid ==
                '00000000-0000-0000-0000-000000000000' or
                item.ObjectGUID == ad_gmsa_outbound_created.object_guid
          loop: '{{ ad_gmsa_cleanup_accounts.objects }}'

        - name: Remove only acquired gMSAs by independently observed GUID
          sustainablelobster.legacy_ad.service_account:
            identity: '{{ item.ObjectGUID }}'
            state: absent
          loop: '{{ ad_gmsa_cleanup_accounts.objects }}'

        - name: Remove only the acquired user fixture OU by GUID
          sustainablelobster.legacy_ad.ou:
            identity: '{{ ad_gmsa_ou.object_guid }}'
            state: absent
          when: >-
            ad_gmsa_ou is defined and ad_gmsa_ou.object_guid is defined and
            ad_gmsa_ou.object_guid != '00000000-0000-0000-0000-000000000000'

        - name: Independently verify the whole unique namespace is absent
          sustainablelobster.legacy_ad.object_info:
            filter: >-
              Name -eq '{{ ad_gmsa_name }}' -or
              Name -eq '{{ ad_gmsa_name }}Out' -or
              sAMAccountName -eq '{{ ad_gmsa_name }}$' -or
              sAMAccountName -eq '{{ ad_gmsa_name }}A' -or
              sAMAccountName -eq '{{ ad_gmsa_name }}B'
          register: ad_gmsa_final

        - name: Require normal directory cleanup
          ansible.builtin.assert:
            that: ad_gmsa_final.objects == []

        - name: Remove only the acquired observer directory
          sustainablelobster.legacy_windows.win_file:
            path: '{{ ad_gmsa_observer.path }}'
            state: absent
          when: ad_gmsa_observer is defined and ad_gmsa_observer.path is defined

        - name: Independently read observer staging absence
          sustainablelobster.legacy_windows.win_stat:
            path: '{{ ad_gmsa_observer.path }}'
          when: ad_gmsa_observer is defined and ad_gmsa_observer.path is defined
          register: ad_gmsa_staging_absent

        - name: Require observer staging cleanup
          ansible.builtin.assert:
            that: not ad_gmsa_staging_absent.stat.exists
          when: ad_gmsa_staging_absent.stat is defined
