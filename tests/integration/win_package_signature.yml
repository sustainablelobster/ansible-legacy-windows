---
- name: Verify native Authenticode policy and strict protected recovery
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/package_signature.yml
    - vars/package_signature_fixture.yml
  tasks:
    - name: Require actual Python 3.4.4 and record original staging
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob,json,os,sys,tempfile;assert sys.version_info[:3]==(3,4,4);
        print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),'ansible-tmp-*')))))""
      register: package_signature_staging_before
      changed_when: false

    - name: Allocate private raw evidence
      ansible.builtin.tempfile:
        state: file
        path: '{{ playbook_dir }}/../../tmp'
        prefix: 'package-signature-{{ inventory_hostname }}-'
        suffix: .json
      register: package_signature_capture
      delegate_to: localhost
      vars: &controller
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
      changed_when: false

    - name: Initialize signature observations
      ansible.builtin.set_fact:
        package_signature_results: []

    - name: Exercise owned official sample fixtures with mandatory cleanup
      block:
        - name: Allocate owned signature workspace  # noqa: args[module]
          sustainablelobster.legacy_windows.win_tempfile:
            state: directory
            prefix: legacy-windows-package-signature-test-
          register: package_signature_workspace

        - name: Journal absent product and protected state before transfer
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_signature_workspace.path }}', journal]
            stdin: '{{ package_signature_program }}'
          register: package_signature_journal
          changed_when: false
          no_log: true

        - name: Transfer pinned official MSI and MSP bytes  # noqa: args[module]
          sustainablelobster.legacy_windows.win_copy:
            src: >-
              {{ package_signature_controller_source }}/package-patch.{{ item }}
            dest: '{{ package_signature_workspace.path }}\patch.{{ item }}'
          loop: [msi, msp]

        - name: Verify fixture hashes and native identities before servicing
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_signature_workspace.path }}', setup]
            stdin: '{{ package_signature_program }}'
          register: package_signature_setup
          changed_when: false
          no_log: true

        - name: Exercise maintained signature cases
          ansible.builtin.include_tasks: tasks/win_package_signature_case.yml
          loop: '{{ package_signature_selected_cases }}'
          loop_control:
            loop_var: package_signature_case
            label: '{{ package_signature_case.name }}'
      always:
        - name: Retain complete current raw state before cleanup
          ansible.builtin.copy:
            content: >-
              {{ {'results': package_signature_results,
              'journal': package_signature_journal | default(none),
              'setup': package_signature_setup | default(none),
              'latest_native': package_signature_native | default(none),
              'latest_original': package_signature_original | default(none)} |
              to_nice_json }}
            dest: '{{ package_signature_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *controller
          changed_when: false
          no_log: true

        - name: Remove only owned product and recover protected state
          when: package_signature_workspace.path is defined
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_signature_workspace.path }}', cleanup]
            stdin: '{{ package_signature_program }}'
          register: package_signature_recovery
          changed_when: false
          no_log: true

        - name: Require literal recovery before any resource deletion
          ansible.builtin.assert:
            that: [(package_signature_recovery.stdout | from_json).restored]

        - name: Re-observe recovery before removing the verified journal
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_signature_workspace.path }}', finalize]
            stdin: '{{ package_signature_program }}'
          changed_when: false
          no_log: true

        - name: Remove verified owned workspace  # noqa: args[module]
          sustainablelobster.legacy_windows.win_file:
            path: '{{ package_signature_workspace.path }}'
            state: absent

        - name: Independently verify workspace absence and exact staging
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,sys,tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),'ansible-tmp-*')))))"
            "{{ package_signature_workspace.path }}""
          register: package_signature_staging_after
          changed_when: false

        - name: Require original staging literally
          ansible.builtin.assert:
            that:
              - >-
                (package_signature_staging_before.stdout | from_json) ==
                (package_signature_staging_after.stdout | from_json)

        - name: Retain full results and recovery evidence
          ansible.builtin.copy:
            content: >-
              {{ {'results': package_signature_results,
              'journal': package_signature_journal | default(none),
              'setup': package_signature_setup | default(none),
              'latest_native': package_signature_native | default(none),
              'latest_original': package_signature_original | default(none),
              'recovery': package_signature_recovery,
              'workspace_absent': true,
              'staging_before': package_signature_staging_before,
              'staging_after': package_signature_staging_after} |
              to_nice_json }}
            dest: '{{ package_signature_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *controller
          changed_when: false
          no_log: true

        - name: Require every selected observation validated
          ansible.builtin.assert:
            that:
              - >-
                package_signature_results | length ==
                package_signature_selected_cases | length
              - >-
                package_signature_results |
                selectattr('validated', 'equalto', true) |
                list | length == package_signature_results | length

        - name: Close only this fixture's standard SSH connection after cleanup
          ansible.builtin.meta: reset_connection
