---
- name: Verify file and registry inheritance in isolated fixtures
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/acl_inheritance.yml
    - vars/acl_inheritance_fixture.yml
  tasks:
    - name: Require Python 3.4.4 and record existing task directories
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob, json, os, sys, tempfile;
        assert sys.version_info[:3] == (3, 4, 4);
        print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
        'ansible-tmp-*')))))""
      register: task_directories_before
      changed_when: false

    - name: Exercise inheritance on owned files and registry keys
      block:
        - name: Allocate an isolated workspace
          sustainablelobster.legacy_windows.win_tempfile:  # noqa: args[module]
            state: directory
            prefix: legacy-windows-inheritance-
          register: acl_inheritance_workspace
          check_mode: false

        - name: Create controlled file and registry permission fixtures
          sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-'
              - '{{ acl_inheritance_workspace.path }}'
              - setup
              - '{{ item }}'
            stdin: '{{ acl_inheritance_fixture }}'
          loop: [filesystem, registry]
          register: acl_inheritance_setup
          changed_when: true
          check_mode: false

        - name: Retain fixture paths and initial native observations
          vars:
            filesystem: >-
              {{ acl_inheritance_setup.results[0].stdout | from_json }}
            registry: >-
              {{ acl_inheritance_setup.results[1].stdout | from_json }}
          ansible.builtin.set_fact:
            acl_inheritance_paths: >-
              {{ filesystem.paths | combine(registry.paths) }}
            acl_inheritance_previous: >-
              {{ filesystem.snapshot | combine(registry.snapshot) }}
            acl_inheritance_registry_root: '{{ registry.paths.parent }}'

        - name: Exercise directories files and registry keys
          ansible.builtin.include_tasks: tasks/win_acl_inheritance_target.yml
          loop: '{{ acl_inheritance_targets }}'
          loop_control:
            loop_var: acl_inheritance_target

        - name: Exercise missing-path failure
          block:
            - name: Reject a missing inheritance target  # noqa: args[module]
              sustainablelobster.legacy_windows.win_acl_inheritance:
                path: '{{ acl_inheritance_workspace.path }}\missing'
              register: acl_inheritance_missing

            - name: Reject unexpected success
              ansible.builtin.fail:
                msg: A missing inheritance target unexpectedly succeeded
          rescue:
            - name: Require an actionable missing-path failure
              ansible.builtin.assert:
                that:
                  - acl_inheritance_missing is failed
                  - not acl_inheritance_missing.changed
                  - >-
                    acl_inheritance_missing.msg ==
                    acl_inheritance_workspace.path + '\missing does not exist'

        - name: Verify recovery after a failed request  # noqa: args[module]
          sustainablelobster.legacy_windows.win_acl_inheritance:
            path: '{{ acl_inheritance_paths.key }}'
            state: present
          register: acl_inheritance_recovery

        - name: Require an unchanged recovery result
          ansible.builtin.assert:
            that:
              - not acl_inheritance_recovery.changed
              - acl_inheritance_recovery.warnings | default([]) == []
      always:
        - name: Clean up security fixtures before removing the workspace
          when: acl_inheritance_workspace.path is defined
          block:
            - name: Clean up owned security fixtures  # noqa: args[module]
              sustainablelobster.legacy_windows.win_command:
                argv:
                  - '{{ ansible_python_interpreter }}'
                  - '-'
                  - '{{ acl_inheritance_workspace.path }}'
                  - cleanup
                  - '{{ item }}'
                stdin: '{{ acl_inheritance_fixture }}'
              loop: [registry, filesystem]
              changed_when: true
              check_mode: false
            - name: Remove only the workspace allocated by this test
              sustainablelobster.legacy_windows.win_file:  # noqa: args[module]
                path: '{{ acl_inheritance_workspace.path }}'
                state: absent
              check_mode: false

        - name: Verify workspace removal and record task directories
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob, json, os, sys, tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
            'ansible-tmp-*')))))" "{{ acl_inheritance_workspace.path }}""
          when: acl_inheritance_workspace.path is defined
          register: task_directories_after
          changed_when: false
          check_mode: false

        - name: Require staging cleanup after successful and failed requests
          ansible.builtin.assert:
            that:
              - >-
                (task_directories_before.stdout | from_json) ==
                (task_directories_after.stdout | from_json)
          when: acl_inheritance_workspace.path is defined
