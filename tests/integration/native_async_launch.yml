- name: Verify direct and restricted native async launch with exact cleanup
  hosts: legacy_windows
  gather_facts: false
  vars:
    native_async_launch_source: '{{ playbook_dir }}/../..'
    native_async_launch_system: false
    native_async_launch_cases: >-
      {{ [{'name': 'manual', 'poll': 0, 'runas': false},
          {'name': 'automatic', 'poll': 1, 'runas': false},
          {'name': 'runas_manual', 'poll': 0, 'runas': true},
          {'name': 'runas_automatic', 'poll': 1, 'runas': true}] +
         ([{'name': 'system_manual', 'poll': 0, 'runas': true,
            'user': 'SYSTEM', 'password': none,
            'account': 'SYSTEM'},
           {'name': 'system_automatic', 'poll': 1, 'runas': true,
            'user': 'SYSTEM', 'password': none,
            'account': 'SYSTEM'}]
          if native_async_launch_system | bool else []) }}
    native_async_launch_program: |
      import ctypes,json,os,sys,time
      assert sys.version_info[:3] == (3,4,4)
      with open(sys.argv[1], 'ab') as stream:
          stream.write(b'once\n')
      library=ctypes.WinDLL('advapi32',use_last_error=True)
      library.GetUserNameW.argtypes=[ctypes.c_wchar_p,ctypes.POINTER(ctypes.c_uint32)]
      library.GetUserNameW.restype=ctypes.c_int
      size=ctypes.c_uint32(256)
      name=ctypes.create_unicode_buffer(size.value)
      assert library.GetUserNameW(name,ctypes.byref(size))
      time.sleep(2)
      print(json.dumps({'marker':os.environ['ASYNC_LAUNCH_MARKER'],
                        'cwd':os.getcwd(),'user':name.value}))
  tasks:
    - name: Record original staging and actual Python runtime
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob,json,os,sys,tempfile;
        assert sys.version_info[:3]==(3,4,4);
        print(json.dumps(sorted(glob.glob(os.path.join(
        tempfile.gettempdir(),'ansible-tmp-*')))))""
      register: native_async_launch_staging_before
      changed_when: false

    - name: Record the connection account before launching jobs
      sustainablelobster.legacy_windows.win_whoami:
      register: native_async_launch_identity
      no_log: true

    - name: Allocate private controller evidence
      ansible.builtin.tempfile:
        path: >-
          {{ evidence_dir |
          default(lookup('env', 'TMPDIR') | default('/tmp', true)) }}
        prefix: 'native-async-launch-{{ inventory_hostname }}-'
        suffix: .json
      register: native_async_launch_capture
      delegate_to: localhost
      become: false
      vars: &controller
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
        ansible_become: false
      changed_when: false

    - name: Allocate an exclusively owned workspace
      sustainablelobster.legacy_windows.win_tempfile:
        prefix: legacy-windows-native-async-launch-
        state: directory
      register: native_async_launch_workspace

    - name: Initialize retained public results
      ansible.builtin.set_fact:
        native_async_launch_results: []

    - name: Exercise real launches and public polling with mandatory recovery
      block:
        - name: Create the owned helper staging directory
          sustainablelobster.legacy_windows.win_file:
            path: '{{ native_async_launch_workspace.path }}\helpers'
            state: directory

        - name: Stage the frozen maintained launcher and watchdog helpers
          sustainablelobster.legacy_windows.win_copy:
            src: >-
              {{ native_async_launch_source + '/plugins/module_utils/' + item }}
            dest: '{{ native_async_launch_workspace.path }}\helpers\{{ item }}'
          loop:
            - legacy_windows_async_native.py
            - legacy_windows_async_wrapper.py
            - legacy_windows_async_worker.py
            - legacy_windows_wmi.py

        - name: Stage the owned launch fixture
          sustainablelobster.legacy_windows.win_copy:
            src: >-
              {{ native_async_launch_source +
              '/tests/integration/fixtures/native_async_launch.py' }}
            dest: '{{ native_async_launch_workspace.path }}\fixture.py'

        - name: >-
            Exercise a direct launch without WMI and real restricted fallback
          sustainablelobster.legacy_windows.win_command:
            argv:
              - '{{ ansible_python_interpreter }}'
              - '{{ native_async_launch_workspace.path }}\fixture.py'
              - '{{ native_async_launch_workspace.path }}'
              - probe
              - '{{ item }}'
          loop: [direct, restricted]
          register: native_async_launch_probes
          changed_when: false

        - name: Require real native jobs and once-only execution in both cases
          ansible.builtin.assert:
            that:
              - >-
                (native_async_launch_probes.results[0].stdout |
                from_json).wmi_calls == 0
              - >-
                (native_async_launch_probes.results[1].stdout |
                from_json).wmi_calls == 1
              - >-
                (native_async_launch_probes.results[0].stdout |
                from_json).executions == 1
              - >-
                (native_async_launch_probes.results[1].stdout |
                from_json).executions == 1

        - name: >-
            Exercise public connection closure polling and named-account runas
          ansible.builtin.include_tasks: tasks/native_async_launch_public.yml
          loop: '{{ native_async_launch_cases }}'
          loop_control:
            loop_var: native_async_launch_case

        - name: Require no staging left by completed jobs
          sustainablelobster.legacy_windows.win_find:
            paths: '{{ native_async_launch_workspace.path }}'
            patterns: ['ansible-tmp-*']
            file_type: directory
            recurse: true
          register: native_async_launch_remaining

        - name: Require exact staging recovery before workspace removal
          ansible.builtin.assert:
            that: native_async_launch_remaining.matched == 0
      always:
        - name: Preserve all available launch observations before cleanup
          ansible.builtin.copy:
            content: >-
              {{ {'probes': native_async_launch_probes | default(none),
                  'public': native_async_launch_results,
                  'remaining': native_async_launch_remaining | default(none),
                  'identity': native_async_launch_identity,
                  'workspace': native_async_launch_workspace.path,
                  'staging_before': native_async_launch_staging_before} |
                  to_nice_json }}
            dest: '{{ native_async_launch_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          become: false
          vars: *controller
          changed_when: false
          no_log: true

        - name: Remove only the owned launch workspace
          sustainablelobster.legacy_windows.win_file:
            path: '{{ native_async_launch_workspace.path }}'
            state: absent

        - name: Close the launching connection after cleanup
          ansible.builtin.meta: reset_connection

        - name: Independently verify workspace absence and original staging
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,sys,tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(
            tempfile.gettempdir(),'ansible-tmp-*')))))"
            "{{ native_async_launch_workspace.path }}""
          register: native_async_launch_staging_after
          changed_when: false

        - name: Require full public execution and original global staging
          ansible.builtin.assert:
            that:
              - >-
                native_async_launch_results | length ==
                native_async_launch_cases | length
              - >-
                (native_async_launch_staging_before.stdout | from_json) ==
                (native_async_launch_staging_after.stdout | from_json)

        - name: Retain final launch and closure observations
          ansible.builtin.copy:
            content: >-
              {{ {'probes': native_async_launch_probes | default(none),
                  'public': native_async_launch_results,
                  'workspace_absent': true,
                  'staging_before': native_async_launch_staging_before,
                  'staging_after': native_async_launch_staging_after} |
                  to_nice_json }}
            dest: '{{ native_async_launch_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          become: false
          vars: *controller
          changed_when: false
          no_log: true

        - name: Close the verification connection
          ansible.builtin.meta: reset_connection
