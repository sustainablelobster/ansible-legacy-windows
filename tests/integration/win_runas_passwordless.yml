---
# SPDX-License-Identifier: GPL-3.0-or-later
- name: Verify passwordless named-account runas on actual Python 3.4.4
  hosts: legacy_windows
  gather_facts: false
  vars:
    runas_passwordless_compare: false
    runas_passwordless_local_s4u: true
    runas_passwordless_available: true
    runas_passwordless_password: password
    runas_passwordless_environment: 'literal λ %PATH% !text! & | < > ^'
    runas_passwordless_program: >-
      {{ lookup('file', playbook_dir + '/fixtures/runas_observer.py') }}
  tasks:
    - name: Record actual interpreter and original task staging
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob,json,os,sys,tempfile;assert sys.version_info[:3]==(3,4,4);
        print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),'ansible-tmp-*')))))""
      register: runas_passwordless_staging_before
      changed_when: false

    - name: Record original account and create unique fixture identity
      sustainablelobster.legacy_windows.win_command:
        argv:
          - '{{ ansible_python_interpreter }}'
          - '-c'
          - 'import json,uuid;print(json.dumps("lw"+uuid.uuid4().hex[:14]))'
      register: runas_passwordless_name
      changed_when: false

    - name: Retain unique account name
      ansible.builtin.set_fact:
        runas_passwordless_account: >-
          {{ runas_passwordless_name.stdout | from_json }}

    - name: Observe original connection identity
      sustainablelobster.legacy_windows.win_whoami:
      register: runas_passwordless_original

    - name: Observe public passwordless SYSTEM token selection
      sustainablelobster.legacy_windows.win_whoami:
      become: true
      become_method: ansible.builtin.runas
      become_user: 'NT AUTHORITY\SYSTEM'
      vars:
        ansible_become_password: null
      register: runas_passwordless_system
      failed_when: false

    - name: Require SYSTEM identity or precise unavailable-token failure
      ansible.builtin.assert:
        that:
          - >-
            (runas_passwordless_available | bool and
            runas_passwordless_system.account.sid | default('') == 'S-1-5-18')
            or (not runas_passwordless_available | bool and
            runas_passwordless_system.account is not defined and
            ('SYSTEM' in runas_passwordless_system.msg | default('') or
            'SYSTEM' in runas_passwordless_system.module_stderr | default('')))
          - runas_passwordless_system is not changed

    - name: Allocate owned test workspace
      sustainablelobster.legacy_windows.win_tempfile:
        state: directory
        prefix: legacy-passwordless-runas-
      register: runas_passwordless_workspace

    - name: Exercise owned account with unconditional recovery
      block:
        - name: Verify generated account does not already exist
          sustainablelobster.legacy_windows.win_user:
            name: '{{ runas_passwordless_account }}'
            state: query
          register: runas_passwordless_absent

        - name: Require unique account before any mutations
          ansible.builtin.assert:
            that: runas_passwordless_absent.state == 'absent'

        - name: Record exclusive ownership before creating the account
          ansible.builtin.set_fact:
            runas_passwordless_owned_account: true

        - name: Create owned administrator using the lab password scheme
          sustainablelobster.legacy_windows.win_user:
            name: '{{ runas_passwordless_account }}'
            password: '{{ runas_passwordless_password }}'
            password_never_expires: true
            groups: [S-1-5-32-544]
          register: runas_passwordless_user
          no_log: true

        - name: Retain fixture account SID
          ansible.builtin.set_fact:
            runas_passwordless_sid: '{{ runas_passwordless_user.sid }}'

        - name: Grant batch logon only to the owned account
          sustainablelobster.legacy_windows.win_user_right:
            name: SeBatchLogonRight
            action: add
            users: ['{{ runas_passwordless_sid }}']

        - name: Read fresh-account identity with no existing account process
          sustainablelobster.legacy_windows.win_whoami:
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: null
          register: runas_passwordless_s4u
          failed_when: false

        - name: Verify S4U identity or the recorded unavailable capability
          ansible.builtin.assert:
            that:
              - >-
                (runas_passwordless_local_s4u | bool and
                runas_passwordless_s4u.account.sid | default('') ==
                runas_passwordless_sid and
                runas_passwordless_s4u.logon_type | default('') == 'Batch') or
                (not runas_passwordless_local_s4u | bool and
                runas_passwordless_s4u.msg | default('') != '')
              - runas_passwordless_s4u is not changed

        - name: Read upstream fresh-account token for comparison
          ansible.windows.win_whoami:
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: null
            ansible_shell_type: cmd
          register: runas_passwordless_source_s4u
          when: runas_passwordless_compare | bool

        - name: Require upstream requested SID logon type and elevation
          ansible.builtin.assert:
            that:
              - >-
                runas_passwordless_source_s4u.account.sid ==
                runas_passwordless_s4u.account.sid
              - >-
                runas_passwordless_source_s4u.logon_type ==
                runas_passwordless_s4u.logon_type
              - >-
                runas_passwordless_source_s4u.label.sid ==
                runas_passwordless_s4u.label.sid
          when: runas_passwordless_compare | bool

        - name: Observe fresh passwordless stdin environment and local execution
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-', AAH/AApib2R5IM67]
            stdin: '{{ runas_passwordless_program }}'
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: null
          environment:
            LEGACY_WINDOWS_RUNAS_TEST: '{{ runas_passwordless_environment }}'
          register: runas_passwordless_command
          changed_when: false
          when: runas_passwordless_local_s4u | bool

        - name: Observe ordinary credentialed stdin environment and Python floor
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-', AAH/AApib2R5IM67]
            stdin: '{{ runas_passwordless_program }}'
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: '{{ runas_passwordless_password }}'
          environment:
            LEGACY_WINDOWS_RUNAS_TEST: '{{ runas_passwordless_environment }}'
          register: runas_passwordless_credentialed_command
          changed_when: false
          no_log: true

        - name: Require credentialed identity literal environment and input
          vars:
            credentialed: >-
              {{ runas_passwordless_credentialed_command.stdout | from_json }}
          ansible.builtin.assert:
            that:
              - credentialed.sid == runas_passwordless_sid
              - credentialed.python == [3, 4, 4]
              - credentialed.body_base64 == 'AAH/AApib2R5IM67'
              - credentialed.environment == runas_passwordless_environment
              - runas_passwordless_credentialed_command.rc == 0
              - runas_passwordless_credentialed_command.stderr == ''

        - name: Require Python literal environment and binary fixture input
          ansible.builtin.assert:
            that:
              - >-
                (runas_passwordless_command.stdout | from_json).sid ==
                runas_passwordless_sid
              - >-
                (runas_passwordless_command.stdout | from_json).python ==
                [3, 4, 4]
              - >-
                (runas_passwordless_command.stdout | from_json).body_base64 ==
                'AAH/AApib2R5IM67'
              - >-
                (runas_passwordless_command.stdout | from_json).environment ==
                runas_passwordless_environment
              - runas_passwordless_command.rc == 0
              - runas_passwordless_command.stderr == ''
          when: runas_passwordless_local_s4u | bool

        - name: Give the owned account workspace access
          sustainablelobster.legacy_windows.win_acl:
            path: '{{ runas_passwordless_workspace.path }}'
            user: '{{ runas_passwordless_sid }}'
            rights: FullControl
            type: allow
            state: present

        - name: Create owned local and network readability sentinel
          sustainablelobster.legacy_windows.win_copy:
            content: passwordless network sentinel
            dest: '{{ runas_passwordless_workspace.path }}\network.txt'
          when: runas_passwordless_local_s4u | bool

        - name: Share only the owned workspace with the requested account
          sustainablelobster.legacy_windows.win_share:
            name: '{{ runas_passwordless_account }}$'
            path: '{{ runas_passwordless_workspace.path }}'
            list: true
            read: '{{ runas_passwordless_account }}'
            rule_action: set
          when: runas_passwordless_local_s4u | bool

        - name: Observe local file and credential-dependent SMB access
          sustainablelobster.legacy_windows.win_command:
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-'
              - '{{ runas_passwordless_workspace.path }}\network.txt'
              - '\\127.0.0.1\{{ runas_passwordless_account }}$\network.txt'
            stdin: |
              import json, sys
              result = {
                  'python': list(sys.version_info[:3]),
                  'local': open(sys.argv[1]).read(),
              }
              try:
                  result['network'] = open(sys.argv[2]).read()
              except OSError as error:
                  result['network_error'] = getattr(error, 'winerror', None)
              print(json.dumps(result))
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: '{{ item.password }}'
          loop:
            - name: s4u
              password: null
            - name: credentialed
              password: '{{ runas_passwordless_password }}'
          loop_control:
            label: '{{ item.name }}'
          register: runas_passwordless_access
          changed_when: false
          no_log: true
          when: runas_passwordless_local_s4u | bool

        - name: Require local success and explicit loopback SMB outcomes
          vars:
            s4u_access: >-
              {{ runas_passwordless_access.results[0].stdout | from_json }}
            credentialed_access: >-
              {{ runas_passwordless_access.results[1].stdout | from_json }}
          ansible.builtin.assert:
            that:
              - s4u_access.local == 'passwordless network sentinel'
              - credentialed_access.local == s4u_access.local
              - s4u_access.python == [3, 4, 4]
              - credentialed_access.python == [3, 4, 4]
              - >-
                (s4u_access.network | default(none) == s4u_access.local and
                 s4u_access.network_error is not defined) or
                (s4u_access.network is not defined and
                 s4u_access.network_error | default(0) | int > 0)
              - >-
                (credentialed_access.network | default(none) ==
                 credentialed_access.local and
                 credentialed_access.network_error is not defined) or
                (credentialed_access.network is not defined and
                 credentialed_access.network_error | default(0) | int > 0)
          no_log: true
          when: runas_passwordless_local_s4u | bool

        - name: Deny fresh batch logon only to the owned account
          sustainablelobster.legacy_windows.win_user_right:
            name: SeDenyBatchLogonRight
            action: add
            users: ['{{ runas_passwordless_sid }}']
          when: runas_passwordless_local_s4u | bool

        - name: Request denied logon without changing identity silently
          sustainablelobster.legacy_windows.win_whoami:
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: null
          register: runas_passwordless_denied
          failed_when: false
          when: runas_passwordless_local_s4u | bool

        - name: Require native denied logon failure rather than caller identity
          ansible.builtin.assert:
            that:
              - runas_passwordless_denied.account is not defined
              - >-
                'LsaLogonUser' in runas_passwordless_denied.msg | default('') or
                'LsaLogonUser' in
                runas_passwordless_denied.module_stderr | default('')
          when: runas_passwordless_local_s4u | bool

        - name: Remove owned deny before credentialed token reuse
          sustainablelobster.legacy_windows.win_user_right:
            name: SeDenyBatchLogonRight
            action: remove
            users: ['{{ runas_passwordless_sid }}']

        - name: Start an eligible interactive credentialed token keeper
          sustainablelobster.legacy_windows.win_command:
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-'
              - '{{ runas_passwordless_workspace.path }}'
            stdin: |
              import json, os, sys, time
              workspace = sys.argv[1]
              with open(os.path.join(workspace, 'keeper.json'), 'w') as stream:
                  json.dump({
                      'pid': os.getpid(),
                      'python': list(sys.version_info[:3]),
                  }, stream)
              deadline = time.monotonic() + 90
              while (not os.path.exists(os.path.join(workspace, 'stop'))
                     and time.monotonic() < deadline):
                  time.sleep(0.1)
              print('keeper finished')
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: '{{ runas_passwordless_password }}'
            ansible_async_dir: '{{ runas_passwordless_workspace.path }}\cache'
          async: 100
          poll: 0
          register: runas_passwordless_keeper
          no_log: true

        - name: Wait for the exact owned keeper to start
          sustainablelobster.legacy_windows.win_wait_for:
            path: '{{ runas_passwordless_workspace.path }}\keeper.json'
            timeout: 15

        - name: Read eligible existing-token identity without a password
          sustainablelobster.legacy_windows.win_whoami:
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: null
          register: runas_passwordless_reused
          failed_when: false

        - name: Repeat existing-token identity in check mode
          sustainablelobster.legacy_windows.win_whoami:
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: null
          check_mode: true
          register: runas_passwordless_reused_check
          failed_when: false

        - name: Require token reuse and unchanged identity reads
          ansible.builtin.assert:
            that:
              - runas_passwordless_reused.account.sid == runas_passwordless_sid
              - runas_passwordless_reused.logon_type == 'Interactive'
              - >-
                runas_passwordless_reused_check.account.sid ==
                runas_passwordless_sid
              - >-
                runas_passwordless_reused_check.logon_id ==
                runas_passwordless_reused.logon_id
              - runas_passwordless_reused is not changed
              - runas_passwordless_reused_check is not changed
          when: runas_passwordless_available | bool

        - name: Require unavailable SYSTEM access without another identity
          ansible.builtin.assert:
            that:
              - runas_passwordless_reused.account is not defined
              - runas_passwordless_reused_check.account is not defined
              - >-
                'SYSTEM' in runas_passwordless_reused.msg | default('') or
                'SYSTEM' in
                runas_passwordless_reused.module_stderr | default('')
          when: not runas_passwordless_available | bool

        - name: Request an account that does not exist
          sustainablelobster.legacy_windows.win_whoami:
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}-missing'
          vars:
            ansible_become_password: null
          register: runas_passwordless_missing
          failed_when: false

        - name: Require account-resolution failure rather than any identity
          ansible.builtin.assert:
            that:
              - runas_passwordless_missing.account is not defined
              - runas_passwordless_missing.msg | default('') != ''
      always:
        - name: Retain original public evidence before any recovery step
          ansible.builtin.copy:
            content: >-
              {{ {'account': runas_passwordless_account,
              'workspace': runas_passwordless_workspace,
              'sid': runas_passwordless_sid | default(none),
              's4u': runas_passwordless_s4u | default(none),
              'source_s4u': runas_passwordless_source_s4u | default(none),
              'command': runas_passwordless_command | default(none),
              'credentialed_command':
              runas_passwordless_credentialed_command | default(none),
              'access': runas_passwordless_access | default(none),
              'denied': runas_passwordless_denied | default(none),
              'reused': runas_passwordless_reused | default(none),
              'reused_check': runas_passwordless_reused_check | default(none),
              'keeper': runas_passwordless_keeper | default(none),
              'missing': runas_passwordless_missing | default(none),
              'original': runas_passwordless_original,
              'system': runas_passwordless_system,
              'staging_before': runas_passwordless_staging_before}
              | to_nice_json }}
            dest: >-
              {{ evidence_dir | default(lookup('env', 'TMPDIR') |
              default('/tmp', true)) }}/runas-passwordless-{{
              inventory_hostname }}.partial.json
            mode: '0600'
          delegate_to: localhost
          vars:
            ansible_connection: local
            ansible_shell_type: sh
            ansible_python_interpreter: '{{ ansible_playbook_python }}'
          changed_when: false
          no_log: true

        - name: Observe exact owned account even after partial creation failures
          sustainablelobster.legacy_windows.win_user:
            name: '{{ runas_passwordless_account }}'
            state: query
          register: runas_passwordless_recovery_account
          when: runas_passwordless_owned_account | default(false) | bool

        - name: Recover the exact owned SID before rights and profile cleanup
          ansible.builtin.set_fact:
            runas_passwordless_sid: >-
              {{ runas_passwordless_recovery_account.sid }}
          when:
            - runas_passwordless_recovery_account.sid is defined

        - name: Signal only the owned token keeper to finish
          sustainablelobster.legacy_windows.win_command:
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-c'
              - >-
                import os,sys;
                open(os.path.join(sys.argv[1],"stop"),"w").close()
              - '{{ runas_passwordless_workspace.path }}'
          changed_when: false

        - name: Wait for the owned async keeper and its child processes
          sustainablelobster.legacy_windows.async_status:
            jid: '{{ runas_passwordless_keeper.ansible_job_id }}'
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: '{{ runas_passwordless_password }}'
            ansible_async_dir: '{{ runas_passwordless_workspace.path }}\cache'
          register: runas_passwordless_keeper_finished
          until: runas_passwordless_keeper_finished.finished | default(false)
          retries: 15
          delay: 1
          when: runas_passwordless_keeper.ansible_job_id is defined
          no_log: true

        - name: Remove only the owned finished cache
          sustainablelobster.legacy_windows.async_status:
            jid: '{{ runas_passwordless_keeper.ansible_job_id }}'
            mode: cleanup
          become: true
          become_method: ansible.builtin.runas
          become_user: '{{ runas_passwordless_account }}'
          vars:
            ansible_become_password: '{{ runas_passwordless_password }}'
            ansible_async_dir: '{{ runas_passwordless_workspace.path }}\cache'
          when: runas_passwordless_keeper.ansible_job_id is defined

        - name: Remove only owned account-right assignments
          sustainablelobster.legacy_windows.win_user_right:
            name: '{{ item }}'
            action: remove
            users: ['{{ runas_passwordless_sid }}']
          loop: [SeBatchLogonRight, SeDenyBatchLogonRight]
          when: runas_passwordless_sid is defined

        - name: Remove only the generated network share
          sustainablelobster.legacy_windows.win_share:
            name: '{{ runas_passwordless_account }}$'
            state: absent
          when:
            - runas_passwordless_sid is defined
            - runas_passwordless_local_s4u | bool

        - name: Delete only the generated account
          sustainablelobster.legacy_windows.win_user:
            name: '{{ runas_passwordless_account }}'
            state: absent
          when: runas_passwordless_sid is defined

        - name: Independently require owned account absence after removal
          sustainablelobster.legacy_windows.win_user:
            name: '{{ runas_passwordless_account }}'
            state: query
          register: runas_passwordless_recovery_absence
          when: runas_passwordless_owned_account | default(false) | bool

        - name: Require complete owned account removal
          ansible.builtin.assert:
            that: runas_passwordless_recovery_absence.state == 'absent'
          when: runas_passwordless_owned_account | default(false) | bool

        - name: Remove only the owned profile and independently verify absence
          sustainablelobster.legacy_windows.win_command:
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-'
              - '{{ runas_passwordless_sid }}'
            stdin: &runas_passwordless_profile_cleanup_program |
              import ctypes, json, os, sys, winreg
              sid = sys.argv[1]
              expected = sys.argv[2] if len(sys.argv) > 2 else None
              key_path = os.path.join(
                  r'SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList',
                  sid)
              path = None
              try:
                  with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE,
                                      key_path) as key:
                      path = winreg.QueryValueEx(key, 'ProfileImagePath')[0]
              except FileNotFoundError:
                  pass
              if expected and path:
                  assert os.path.normcase(path) == os.path.normcase(expected)
              path = path or expected
              hives = []
              for name in (sid, sid + '_Classes'):
                  try:
                      with winreg.OpenKey(winreg.HKEY_USERS, name):
                          hives.append(name)
                  except FileNotFoundError:
                      pass
              library = ctypes.WinDLL('userenv', use_last_error=True)
              library.DeleteProfileW.argtypes = [
                  ctypes.c_wchar_p, ctypes.c_wchar_p, ctypes.c_wchar_p,
              ]
              library.DeleteProfileW.restype = ctypes.c_int
              ok = library.DeleteProfileW(sid, None, None)
              error = 0 if ok else ctypes.get_last_error()
              absent = not path or not os.path.exists(path)
              try:
                  with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, key_path):
                      absent = False
              except FileNotFoundError:
                  pass
              print(json.dumps({
                  'profile_absent': absent,
                  'path': path, 'loaded_hives': hives,
                  'error': error,
                  'python': list(sys.version_info[:3]),
              }))
              if not ok and error not in (2, 3):
                  raise ctypes.WinError(error)
              assert absent, 'The exclusively owned profile remains.'
          register: runas_passwordless_profile_cleanup_initial
          changed_when: false
          failed_when: false
          when: runas_passwordless_sid is defined

        - name: Preserve initial native profile cleanup before any reboot
          ansible.builtin.copy:
            content: >-
              {{ runas_passwordless_profile_cleanup_initial | to_nice_json }}
            dest: >-
              {{ evidence_dir | default(lookup('env', 'TMPDIR') |
              default('/tmp', true)) }}/runas-passwordless-{{
              inventory_hostname }}.profile-cleanup.json
            mode: '0600'
          delegate_to: localhost
          vars:
            ansible_connection: local
            ansible_shell_type: sh
            ansible_python_interpreter: '{{ ansible_playbook_python }}'
          changed_when: false

        - name: Retain the initial cleanup result unless recovery is required
          ansible.builtin.set_fact:
            runas_passwordless_profile_cleanup: >-
              {{ runas_passwordless_profile_cleanup_initial }}

        - name: Release only the observed owned profile through a scoped reboot
          sustainablelobster.legacy_windows.win_reboot:
            reboot_timeout: 180
          register: runas_passwordless_profile_reboot
          when:
            - runas_passwordless_profile_cleanup_initial.rc | default(0) != 0
            - >-
              runas_passwordless_profile_cleanup_initial.stdout |
              default('') | length > 0
            - >-
              (runas_passwordless_profile_cleanup_initial.stdout |
               from_json).loaded_hives | length > 0
            - >-
              (runas_passwordless_profile_cleanup_initial.stdout |
               from_json).path is not none
            - runas_passwordless_recovery_absence.state == 'absent'

        - name: Retry the exact owned SID and previously observed profile path
          sustainablelobster.legacy_windows.win_command:
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-'
              - '{{ runas_passwordless_sid }}'
              - >-
                {{ (runas_passwordless_profile_cleanup_initial.stdout |
                    from_json).path }}
            stdin: *runas_passwordless_profile_cleanup_program
          register: runas_passwordless_profile_cleanup_recovered
          changed_when: false
          failed_when: false
          when: runas_passwordless_profile_reboot.rebooted | default(false)

        - name: Record post-reboot cleanup separately from initial failure
          ansible.builtin.set_fact:
            runas_passwordless_profile_cleanup: >-
              {{ runas_passwordless_profile_cleanup_recovered }}
          when: runas_passwordless_profile_reboot.rebooted | default(false)

        - name: Remove only the owned workspace after keeper closure
          sustainablelobster.legacy_windows.win_file:
            path: '{{ runas_passwordless_workspace.path }}'
            state: absent

        - name: Observe restored connection identity
          sustainablelobster.legacy_windows.win_whoami:
          register: runas_passwordless_final

        - name: Verify staging restoration and owned workspace absence
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,sys,tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(
            tempfile.gettempdir(),'ansible-tmp-*')))))"
            "{{ runas_passwordless_workspace.path }}""
          register: runas_passwordless_staging_after
          changed_when: false

        - name: Retain public results and recovery observations locally
          ansible.builtin.copy:
            content: >-
              {{ {'account': runas_passwordless_account,
              'sid': runas_passwordless_sid | default(none),
              's4u': runas_passwordless_s4u | default(none),
              'source_s4u': runas_passwordless_source_s4u | default(none),
              'command': runas_passwordless_command | default(none),
              'credentialed_command':
              runas_passwordless_credentialed_command | default(none),
              'access': runas_passwordless_access | default(none),
              'denied': runas_passwordless_denied | default(none),
              'reused': runas_passwordless_reused | default(none),
              'reused_check': runas_passwordless_reused_check | default(none),
              'missing': runas_passwordless_missing | default(none),
              'original': runas_passwordless_original,
              'system': runas_passwordless_system,
              'final': runas_passwordless_final,
              'profile_cleanup':
              runas_passwordless_profile_cleanup | default(none),
              'profile_cleanup_initial':
              runas_passwordless_profile_cleanup_initial | default(none),
              'profile_reboot':
              runas_passwordless_profile_reboot | default(none),
              'account_absence':
              runas_passwordless_recovery_absence | default(none),
              'staging_before': runas_passwordless_staging_before,
              'staging_after': runas_passwordless_staging_after}
              | to_nice_json }}
            dest: >-
              {{ evidence_dir | default(lookup('env', 'TMPDIR') |
              default('/tmp', true)) }}/runas-passwordless-{{
              inventory_hostname }}.json
            mode: '0600'
          delegate_to: localhost
          vars:
            ansible_connection: local
            ansible_shell_type: sh
            ansible_python_interpreter: '{{ ansible_playbook_python }}'
          changed_when: false
          no_log: true

        - name: Require exact staging and original connection identity recovery
          ansible.builtin.assert:
            that:
              - >-
                runas_passwordless_sid is not defined or
                runas_passwordless_profile_cleanup.rc | default(-1) == 0
              - >-
                runas_passwordless_final.account.sid ==
                runas_passwordless_original.account.sid
              - >-
                (runas_passwordless_staging_before.stdout | from_json) ==
                (runas_passwordless_staging_after.stdout | from_json)

        - name: Close the owned SSH connection after recovery
          ansible.builtin.meta: reset_connection
