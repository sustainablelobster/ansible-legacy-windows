# Requires two forests and an executor authenticated to the foreign one.
# Only the fresh OU in the explicitly credentialed default forest is acquired.
- name: Verify foreign identity lookups use released credential precedence
  hosts: legacy_ad_credential_executor
  gather_facts: false
  tasks:
    - name: Allocate a unique default-forest fixture on the minimum runtime
      sustainablelobster.legacy_windows.win_command:
        argv:
          - '{{ ansible_python_interpreter }}'
          - -c
          - >-
            import json,sys,uuid;
            print(json.dumps({'python':list(sys.version_info[:3]),
            'name':'LADC-'+uuid.uuid4().hex[:10]}))
      register: ad_credential_runtime
      changed_when: false

    - name: Require distinct default and foreign directories
      ansible.builtin.assert:
        that:
          - (ad_credential_runtime.stdout | from_json).python == [3, 4, 4]
          - ad_default_server != ad_foreign_server
          - ad_default_domain_dn != ad_foreign_domain_dn

    - name: Read the native ambient domain identity independently
      sustainablelobster.legacy_windows.win_command:
        argv:
          - '{{ ansible_python_interpreter }}'
          - -c
          - |
            import ctypes,json
            api=ctypes.WinDLL('secur32',use_last_error=True).GetUserNameExW
            api.argtypes=[ctypes.c_uint32,ctypes.c_wchar_p,
                          ctypes.POINTER(ctypes.c_uint32)]
            api.restype=ctypes.c_int
            size=ctypes.c_uint32()
            api(2,None,ctypes.byref(size))
            assert size.value,ctypes.get_last_error()
            name=ctypes.create_unicode_buffer(size.value)
            assert api(2,name,ctypes.byref(size)),ctypes.get_last_error()
            print(json.dumps({'principal':name.value}))
      register: ad_credential_ambient_identity
      changed_when: false

    - name: Require ambient execution belongs to the foreign forest
      ansible.builtin.assert:
        that: >-
          (ad_credential_ambient_identity.stdout | from_json).principal
          | lower == ad_foreign_username | lower

    - name: Freeze the unique default-forest fixture identity
      ansible.builtin.set_fact:
        ad_credential_name: >-
          {{ (ad_credential_runtime.stdout | from_json).name }}

    - name: Exercise credential precedence and always remove acquired objects
      block:
        - name: Acquire a unique OU with explicit default-forest credentials
          sustainablelobster.legacy_ad.ou:
            name: '{{ ad_credential_name }}'
            path: '{{ ad_default_domain_dn }}'
            domain_server: '{{ ad_default_server }}'
            domain_username: '{{ ad_default_username }}'
            domain_password: '{{ ad_default_password }}'
          register: ad_credential_ou
          no_log: true

        - name: Acquire a disabled user through the unnamed default credential
          sustainablelobster.legacy_ad.user:
            name: '{{ ad_credential_name }}-U'
            path: '{{ ad_credential_ou.distinguished_name }}'
            domain_server: '{{ ad_default_server }}'
            domain_credentials:
              - username: '{{ ad_default_username }}'
                password: '{{ ad_default_password }}'
          register: ad_credential_user
          no_log: true

        - name: Independently qualify the foreign group with foreign credentials
          sustainablelobster.legacy_ad.object_info:
            search_base: '{{ ad_foreign_domain_dn }}'
            ldap_filter: '(sAMAccountName={{ ad_foreign_group }})'
            domain_server: '{{ ad_foreign_server }}'
            domain_username: '{{ ad_foreign_username }}'
            domain_password: '{{ ad_foreign_password }}'
            properties: [objectSid]
          register: ad_credential_foreign_group
          no_log: true

        - name: Require the foreign identity exists in its own forest
          ansible.builtin.assert:
            that:
              - ad_credential_foreign_group.objects | length == 1
              - >-
                ad_credential_foreign_group.objects[0].DistinguishedName
                | lower is search(ad_foreign_domain_dn | lower)

        - name: Resolve a foreign removal with ambient credentials
          sustainablelobster.legacy_ad.user:
            identity: '{{ ad_credential_user.object_guid }}'
            domain_server: '{{ ad_default_server }}'
            domain_credentials:
              - username: '{{ ad_default_username }}'
                password: '{{ ad_default_password }}'
            groups:
              remove:
                - name: '{{ ad_foreign_group }}'
                  server: '{{ ad_foreign_server }}'
          register: ad_credential_ambient_lookup
          no_log: true

        - name: Resolve a foreign removal using its named credential override
          sustainablelobster.legacy_ad.user:
            identity: '{{ ad_credential_user.object_guid }}'
            domain_server: '{{ ad_default_server }}'
            domain_username: '{{ ad_default_username }}'
            domain_password: '{{ ad_default_password }}'
            domain_credentials:
              - name: '{{ ad_foreign_server }}'
                username: '{{ ad_foreign_username }}'
                password: '{{ ad_foreign_password }}'
            groups:
              remove:
                - name: '{{ ad_foreign_group }}'
                  server: '{{ ad_foreign_server }}'
          register: ad_credential_named_lookup
          no_log: true

        - name: Require both already-absent memberships were unchanged
          ansible.builtin.assert:
            that:
              - not ad_credential_ambient_lookup.changed
              - not ad_credential_named_lookup.changed

      always:
        - name: Remove only the acquired default-forest OU by exact GUID
          sustainablelobster.legacy_ad.ou:
            identity: '{{ ad_credential_ou.object_guid }}'
            state: absent
            domain_server: '{{ ad_default_server }}'
            domain_username: '{{ ad_default_username }}'
            domain_password: '{{ ad_default_password }}'
          when: >-
            ad_credential_ou is defined
            and ad_credential_ou.object_guid is defined
          no_log: true

        - name: Independently read the owned namespace after removal
          sustainablelobster.legacy_ad.object_info:
            search_base: '{{ ad_default_domain_dn }}'
            ldap_filter: '(name={{ ad_credential_name }}*)'
            domain_server: '{{ ad_default_server }}'
            domain_username: '{{ ad_default_username }}'
            domain_password: '{{ ad_default_password }}'
          register: ad_credential_after
          no_log: true

        - name: Require the acquired default-forest objects are absent
          ansible.builtin.assert:
            that: ad_credential_after.objects == []
