---
- name: Verify owned MSI public lifecycle and strict recovery
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/package.yml
    - vars/package_fixture.yml
  tasks:
    - name: Require actual Python 3.4.4 and record original staging
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob,json,os,sys,tempfile;assert sys.version_info[:3]==(3,4,4);
        print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),'ansible-tmp-*')))))""
      register: package_staging_before
      changed_when: false

    - name: Allocate private evidence file
      ansible.builtin.tempfile:
        state: file
        path: '{{ playbook_dir }}/../../tmp'
        prefix: 'package-{{ inventory_hostname }}-'
        suffix: .json
      register: package_capture
      delegate_to: localhost
      vars: &controller
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
      changed_when: false

    - name: Initialize raw case evidence
      ansible.builtin.set_fact:
        package_results: []

    - name: Exercise owned fixtures and always retain recovery evidence
      block:
        - name: Allocate owned workspace  # noqa: args[module]
          sustainablelobster.legacy_windows.win_tempfile:
            state: directory
            prefix: legacy-windows-package-test-
          register: package_workspace

        - name: Journal pristine state before transferring installer fixtures
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_workspace.path }}', journal]
            stdin: '{{ package_program }}'
          register: package_journal
          changed_when: false
          no_log: true

        - name: Transfer pinned MSI fixtures  # noqa: args[module]
          sustainablelobster.legacy_windows.win_copy:
            src: >-
              {{ package_controller_source }}/package-{{ item }}.msi
            dest: '{{ package_workspace.path }}\{{ item }}.msi'
          loop: [good, bad, reboot]

        - name: Verify pinned bytes and native identities before servicing
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_workspace.path }}', setup]
            stdin: '{{ package_program }}'
          register: package_setup
          changed_when: false
          no_log: true

        - name: Exercise maintained MSI cases
          ansible.builtin.include_tasks: tasks/win_package_case.yml
          loop: '{{ package_selected_cases }}'
          loop_control:
            loop_var: package_case
            label: '{{ package_case.name }}'
      always:
        - name: Persist raw observations before cleanup
          ansible.builtin.copy:
            content: >-
              {{ {'results': package_results,
              'journal': package_journal | default(none),
              'setup': package_setup | default(none),
              'latest_native': package_native | default(none),
              'latest_original': package_original | default(none),
              'staging_before': package_staging_before} | to_nice_json }}
            dest: '{{ package_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *controller
          changed_when: false
          no_log: true

        - name: Remove only journal-owned product and verify protected recovery
          when: package_workspace.path is defined
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_workspace.path }}', cleanup]
            stdin: '{{ package_program }}'
          register: package_recovery
          changed_when: false
          no_log: true

        - name: Require complete recovery before deleting owned resources
          ansible.builtin.assert:
            that: [(package_recovery.stdout | from_json).restored]

        - name: Finalize verified journal after independent re-observation
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_workspace.path }}', finalize]
            stdin: '{{ package_program }}'
          changed_when: false
          no_log: true

        - name: Remove only the verified owned workspace  # noqa: args[module]
          sustainablelobster.legacy_windows.win_file:
            path: '{{ package_workspace.path }}'
            state: absent

        - name: Independently verify workspace absence and staging
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,sys,tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(
            tempfile.gettempdir(),'ansible-tmp-*')))))"
            "{{ package_workspace.path }}""
          register: package_staging_after
          changed_when: false

        - name: Require literal original staging
          ansible.builtin.assert:
            that:
              - >-
                (package_staging_before.stdout | from_json) ==
                (package_staging_after.stdout | from_json)

        - name: Retain complete raw public and recovery evidence
          ansible.builtin.copy:
            content: >-
              {{ {'results': package_results,
              'journal': package_journal | default(none),
              'setup': package_setup | default(none),
              'latest_native': package_native | default(none),
              'latest_original': package_original | default(none),
              'recovery': package_recovery,
              'staging_before': package_staging_before,
              'staging_after': package_staging_after,
              'workspace_absent': true} | to_nice_json }}
            dest: '{{ package_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *controller
          changed_when: false
          no_log: true

        - name: Require every selected case validated
          ansible.builtin.assert:
            that:
              - package_results | length == package_selected_cases | length
              - >-
                package_results | selectattr('validated','equalto',true) |
                list | length == package_results | length
