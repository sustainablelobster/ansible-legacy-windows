---
- name: Verify owned registry executable lifecycle and strict recovery
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/package_registry.yml
    - vars/package_registry_fixture.yml
  tasks:
    - name: Require Python 3.4.4 and record original staging
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob,json,os,sys,tempfile;assert sys.version_info[:3]==(3,4,4);
        print(json.dumps(sorted(glob.glob(os.path.join(
        tempfile.gettempdir(),'ansible-tmp-*')))))""
      register: package_staging_before
      changed_when: false

    - name: Allocate private evidence file before target writes
      ansible.builtin.tempfile:
        state: file
        path: '{{ playbook_dir }}/../../tmp/codex/evidence'
        prefix: 'package-registry-{{ inventory_hostname }}-'
        suffix: .json
      register: package_capture
      delegate_to: localhost
      vars: &controller
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
      changed_when: false

    - name: Initialize complete raw evidence
      ansible.builtin.set_fact:
        package_results: []

    - name: Exercise owned fixture and always retain recovery
      block:
        - name: Allocate uniquely owned fixture workspace  # noqa: args[module]
          sustainablelobster.legacy_windows.win_tempfile:
            state: directory
            prefix: >-
              {{ package_registry_workspace_prefix |
              default("legacy-windows-package-registry-test-") }}
          register: package_workspace

        - name: Journal pristine registry service pending and runtime state
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_workspace.path }}', journal]
            stdin: '{{ package_registry_program }}'
          register: package_journal
          changed_when: false
          no_log: true

        - name: Stage owned installer program  # noqa: args[module]
          sustainablelobster.legacy_windows.win_copy:
            content: '{{ package_registry_installer_source }}'
            dest: '{{ package_workspace.path }}\registry_installer.py'

        - name: Stage exact existing x86 fixture binaries when
            explicitly selected
          when: package_registry_x86_binary_dir is defined
          sustainablelobster.legacy_windows.win_copy:
            src: '{{ package_registry_x86_binary_dir }}/{{ item }}'
            dest: '{{ package_workspace.path }}\{{ item }}'
          loop: ['registry installer.exe', python34.dll, MSVCR100.dll]

        - name: Prepare private native executable fixture
          sustainablelobster.legacy_windows.win_command:
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-'
              - '{{ package_workspace.path }}'
              - setup
              - >-
                {{ "x86" if package_registry_x86_binary_dir is defined
                else "native" }}
            stdin: '{{ package_registry_program }}'
          register: package_setup
          changed_when: false
          no_log: true

        - name: Exercise bounded public registry requests
          ansible.builtin.include_tasks: tasks/win_package_registry_case.yml
          loop: '{{ package_registry_selected_cases }}'
          loop_control:
            loop_var: package_case
            label: '{{ package_case.name }}'
      always:
        - name: Persist raw observations before any recovery assertion
          ansible.builtin.copy:
            content: >-
              {{ {'results': package_results, 'journal': package_journal |
              default(none), 'setup': package_setup | default(none),
              'latest_native': package_native | default(none),
              'latest_original': package_original | default(none),
              'latest_prepare': package_before | default(none),
              'staging_before': package_staging_before} | to_nice_json }}
            dest: '{{ package_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *controller
          changed_when: false
          no_log: true

        - name: Remove only journal-owned registry entries and files
          when: package_workspace.path is defined
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_workspace.path }}', cleanup]
            stdin: '{{ package_registry_program }}'
          register: package_recovery
          changed_when: false
          no_log: true

        - name: Require literal protected recovery before workspace removal
          ansible.builtin.assert:
            that: [(package_recovery.stdout | from_json).restored]

        - name: Independently re-observe protected state and finalize journal
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ package_workspace.path }}', finalize]
            stdin: '{{ package_registry_program }}'
          changed_when: false
          no_log: true

        - name: Remove the verified owned workspace  # noqa: args[module]
          sustainablelobster.legacy_windows.win_file:
            path: '{{ package_workspace.path }}'
            state: absent

        - name: Independently verify workspace absence and original staging
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,sys,tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(
            tempfile.gettempdir(),'ansible-tmp-*')))))"
            "{{ package_workspace.path }}""
          register: package_staging_after
          changed_when: false

        - name: Require exact global staging recovery
          ansible.builtin.assert:
            that:
              - (package_staging_before.stdout | from_json) ==
                (package_staging_after.stdout | from_json)

        - name: Retain complete raw result and cleanup evidence
          ansible.builtin.copy:
            content: >-
              {{ {'results': package_results, 'journal': package_journal |
              default(none), 'setup': package_setup | default(none),
              'latest_native': package_native | default(none),
              'latest_original': package_original | default(none),
              'latest_prepare': package_before | default(none),
              'recovery': package_recovery,
              'staging_before': package_staging_before,
              'staging_after': package_staging_after,
              'workspace_absent': true} | to_nice_json }}
            dest: '{{ package_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *controller
          changed_when: false
          no_log: true

        - name: Verify every raw public pair and qualified output timestamp
          ansible.builtin.command:
            argv:
              - '{{ ansible_playbook_python }}'
              - '{{ playbook_dir }}/files/package_registry_compare.py'
              - '{{ package_capture.path }}'
              - '{{ package_compare | bool | ternary("paired", "native") }}'
          delegate_to: localhost
          vars: *controller
          changed_when: false
