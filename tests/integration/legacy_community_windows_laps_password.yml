# The runner owns a temporary computer with a readable legacy LAPS attribute.
# No existing computer or password is changed by this read-only lookup play.
- name: Verify the LAPS lookup against an actual directory fixture
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the fixture password through the public lookup
      ansible.builtin.set_fact:
        community_laps_observed: >-
          {{ query('sustainablelobster.legacy_community_windows.laps_password',
             community_laps_host,
             domain=community_laps_domain,
             auth=community_laps_auth | default('simple'),
             username=community_laps_username | default(none),
             password=community_laps_password | default(none),
             scheme=community_laps_scheme | default('ldaps'),
             start_tls=community_laps_start_tls | default(false),
             ca_cert=community_laps_ca_cert | default(none),
             search_base=community_laps_search_base | default(none)) }}
      no_log: true

    - name: Verify one exact password without displaying it
      ansible.builtin.assert:
        that:
          - community_laps_observed | length == 1
          - community_laps_observed[0] == community_laps_expected_password
      no_log: true
