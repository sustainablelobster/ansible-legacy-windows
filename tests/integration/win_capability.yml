---
- name: Demonstrate native capability management and exact recovery
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/capability.yml
    - vars/capability_fixture.yml
  tasks:
    - name: Parse the actual rendered fixture as Python 3.4 before allocation
      ansible.builtin.command:
        argv:
          - '{{ ansible_playbook_python }}'
          - -c
          - >-
            import ast,sys; ast.parse(sys.stdin.read(),feature_version=(3,4))
        stdin: '{{ capability_program }}'
      delegate_to: localhost
      changed_when: false
      vars: &capability_local
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
      tags: [capability-fixture-validate]

    - name: Preflight every declared case with its setup-time template inputs
      ansible.builtin.assert:
        that:
          - capability_cases | to_json | from_json | length == 24
          - capability_legacy_cases | to_json | from_json | length == 3
      vars:
        # Only template binding is checked here; actual expectations below use
        # the independently journaled target catalogue, never this placeholder.
        capability_setup:
          stdout: >-
            {{ {'before': {'capabilities': {
               'Microsoft.Windows.Notepad~~~~0.0.1.0': 'Installed',
               'XPS.Viewer~~~~0.0.1.0': 'NotPresent'}}} | to_json }}
      delegate_to: localhost
      tags: [capability-fixture-validate]

    - name: Require Python 3.4.4 and record initial staging
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob,json,os,sys,tempfile;
        assert sys.version_info[:3] == (3,4,4);
        print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
        'ansible-tmp-*')))))""
      register: capability_staging_before
      changed_when: false

    - name: Allocate private controller evidence
      ansible.builtin.tempfile:
        state: file
        path: '{{ playbook_dir }}/../../tmp'
        prefix: 'capability-{{ inventory_hostname }}-'
        suffix: .json
      register: capability_capture
      delegate_to: localhost
      changed_when: false
      vars: *capability_local

    - name: Initialize full public evidence
      ansible.builtin.set_fact:
        capability_results: []
      no_log: true

    - name: Exercise requests with durable owned-capability recovery
      block:
        - name: Allocate unique recovery workspace
          sustainablelobster.legacy_windows.win_tempfile:  # noqa: args[module]
            state: directory
            prefix: legacy-windows-capability-
          register: capability_workspace

        - name: Read original servicing interface # noqa: args[module]
          sustainablelobster.legacy_windows.win_service_info:
            name: TrustedInstaller
          register: capability_original_service

        - name: Save full original public state before provider setup
          ansible.builtin.copy:
            content: >-
              {{ {'results': capability_results,
                  'workspace': capability_workspace,
                  'original_service': capability_original_service,
                  'staging_before': capability_staging_before} | to_nice_json }}
            dest: '{{ capability_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          changed_when: false
          no_log: true
          vars: *capability_local

        - name: Journal catalogue protected files services and pending state
          sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ capability_workspace.path }}', setup]
            stdin: '{{ capability_program }}'
          register: capability_setup
          changed_when: false
          no_log: true

        - name: Read post-catalogue servicing interface # noqa: args[module]
          sustainablelobster.legacy_windows.win_service_info:
            name: TrustedInstaller
          register: capability_setup_service

        - name: Save initial public interface and journal before requests
          ansible.builtin.copy:
            content: >-
              {{ {'results': capability_results,
                  'workspace': capability_workspace,
                  'setup': capability_setup,
                  'original_service': capability_original_service,
                  'setup_service': capability_setup_service,
                  'staging_before': capability_staging_before} | to_nice_json }}
            dest: '{{ capability_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          changed_when: false
          no_log: true
          vars: *capability_local

        - name: Exercise declared public capability cases
          ansible.builtin.include_tasks: tasks/win_capability_case.yml
          loop: >-
            {{ capability_cases
               if (capability_setup.stdout | from_json).supported
               else capability_legacy_cases }}
          loop_control:
            loop_var: capability_case
            label: '{{ capability_case.name }}'
      always:
        - name: Preserve public evidence before recovery
          ansible.builtin.copy:
            content: >-
              {{ {'results': capability_results,
                  'workspace': capability_workspace | default(none),
                  'setup': capability_setup | default(none),
                  'original_service':
                    capability_original_service | default(none),
                  'setup_service': capability_setup_service | default(none),
                  'staging_before': capability_staging_before} | to_nice_json }}
            dest: '{{ capability_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          changed_when: false
          no_log: true
          vars: *capability_local

        - name: Restore only journal-owned capability and complete native state
          when: capability_workspace.path is defined
          sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ capability_workspace.path }}', cleanup]
            stdin: '{{ capability_program }}'
          register: capability_restoration
          changed_when: false
          no_log: true

        - name: Complete only a recovery-requested servicing reboot
          when: >-
            (capability_restoration.stdout | from_json).requires_reboot
            | default(false)
          block:
            - name: Restart only for journal recovery # noqa: args[module]
              # The maintained collection has no reboot mutation module yet.
              sustainablelobster.legacy_windows.win_command:
                argv: [shutdown.exe, /r, /f, /t, '5']

            - name: Observe the leased SSH listener stop
              ansible.builtin.wait_for:
                host: '{{ ansible_host }}'
                port: '{{ ansible_port | default(22) }}'
                state: stopped
                timeout: 120
              delegate_to: localhost
              vars: *capability_local

            - name: Wait for the leased SSH listener to return
              ansible.builtin.wait_for:
                host: '{{ ansible_host }}'
                port: '{{ ansible_port | default(22) }}'
                state: started
                delay: 10
                timeout: 300
              delegate_to: localhost
              vars: *capability_local

        - name: Verify strict recovery again after a required recovery reboot
          when: >-
            (capability_restoration.stdout | from_json).requires_reboot
            | default(false)
          sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ capability_workspace.path }}', cleanup]
            stdin: '{{ capability_program }}'
          register: capability_reboot_restoration
          changed_when: false
          no_log: true

        - name: Read final servicing service interface # noqa: args[module]
          # Read the normal public interface after the independent fixture.
          sustainablelobster.legacy_windows.win_service_info:
            name: TrustedInstaller
          register: capability_final_service

        - name: Preserve full restoration before recovery assertions
          ansible.builtin.copy:
            content: >-
              {{ {'results': capability_results,
                  'workspace': capability_workspace,
                  'setup': capability_setup,
                  'restoration': capability_restoration,
                  'reboot_restoration':
                    capability_reboot_restoration | default(none),
                  'original_service':
                    capability_original_service | default(none),
                  'setup_service': capability_setup_service | default(none),
                  'final_service': capability_final_service,
                  'staging_before': capability_staging_before} | to_nice_json }}
            dest: '{{ capability_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          changed_when: false
          no_log: true
          vars: *capability_local

        - name: Require exact recovery before deleting journal evidence
          ansible.builtin.assert:
            that:
              - >-
                (capability_reboot_restoration.stdout | from_json).restored
                if capability_reboot_restoration.stdout is defined
                else (capability_restoration.stdout | from_json).restored
              - capability_original_service.services ==
                capability_final_service.services
          no_log: true

        - name: Preserve full native recovery before journal removal
          ansible.builtin.copy:
            content: >-
              {{ {'results': capability_results,
                  'workspace': capability_workspace,
                  'setup': capability_setup,
                  'restoration': capability_restoration,
                  'reboot_restoration':
                    capability_reboot_restoration | default(none),
                  'original_service': capability_original_service,
                  'setup_service': capability_setup_service,
                  'final_service': capability_final_service,
                  'staging_before': capability_staging_before} | to_nice_json }}
            dest: '{{ capability_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          changed_when: false
          no_log: true
          vars: *capability_local

        - name: Finalize only the independently verified journal
          sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ capability_workspace.path }}', finalize]
            stdin: '{{ capability_program }}'
          changed_when: false
          no_log: true

        - name: Remove only the verified owned workspace
          sustainablelobster.legacy_windows.win_file:  # noqa: args[module]
            path: '{{ capability_workspace.path }}'
            state: absent

        - name: Verify workspace absence and unchanged staging
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,sys,tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
            'ansible-tmp-*')))))" "{{ capability_workspace.path }}""
          register: capability_staging_after
          changed_when: false

        - name: Save complete cleanup proof before final case-count assertion
          ansible.builtin.copy:
            content: >-
              {{ {'results': capability_results,
                  'workspace': capability_workspace,
                  'setup': capability_setup,
                  'restoration': capability_restoration,
                  'reboot_restoration':
                    capability_reboot_restoration | default(none),
                  'original_service': capability_original_service,
                  'setup_service': capability_setup_service,
                  'final_service': capability_final_service,
                  'staging_before': capability_staging_before,
                  'staging_after': capability_staging_after,
                  'workspace_absent': true} | to_nice_json }}
            dest: '{{ capability_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          changed_when: false
          no_log: true
          vars: *capability_local

        - name: Require complete cases and exact staging recovery
          ansible.builtin.assert:
            that:
              - capability_staging_before.stdout | from_json ==
                capability_staging_after.stdout | from_json
              - >-
                capability_results | length ==
                (capability_cases | length
                 if (capability_setup.stdout | from_json).supported
                 else capability_legacy_cases | length)
              - >-
                capability_results |
                selectattr('validated', 'equalto', true) | list | length ==
                capability_results | length
