---
- name: Verify service account passwords and an owned native SYSTEM dispatcher
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/service_fixture.yml
    - vars/service_credentials.yml
  vars:
    service_capture:
      results: '{{ service_results }}'
      runtime: '{{ service_runtime.stdout | from_json }}'
      workspace: '{{ service_workspace.path | default(none) }}'
      setup: '{{ service_setup | default({}) }}'
      account_sid: '{{ service_user.sid | default(none) }}'
      rights_before: '{{ service_rights_before | default({}) }}'
      rights_after: '{{ service_rights_after | default({}) }}'
      cleanup: '{{ service_cleanup | default({}) }}'
      account_cleanup: '{{ service_account_cleanup | default({}) }}'
      staging_before: '{{ service_staging_before.stdout | default("") }}'
      staging_after: '{{ service_staging_after.stdout | default("") }}'
  tasks:
    - name: Allocate private evidence under the designated agent directory
      ansible.builtin.tempfile:
        state: file
        prefix: service-credentials-{{ inventory_hostname }}-
        suffix: .json
        path: '{{ service_credentials_evidence_dir }}'
      register: service_capture_file
      delegate_to: localhost
      vars: &service_credentials_local
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
      changed_when: false

    - name: Require the actual minimum interpreter and record Windows identity
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import json, os, subprocess, sys;
        assert sys.version_info[:3] == (3, 4, 4);
        hardware = subprocess.check_output(['getmac','/fo','csv','/nh']);
        assert '{{ contract_gap_mac }}'.encode('ascii') in
        hardware.upper().replace(b'-', b':');
        print(json.dumps(dict(python=list(sys.version_info[:3]),
        windows=list(sys.getwindowsversion()), interpreter=sys.executable,
        computer=os.environ['COMPUTERNAME'])))""
      register: service_runtime
      changed_when: false

    - name: Record preexisting Ansible staging directories
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "import glob, json, os, tempfile;
        print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
        'ansible-tmp-*')))))""
      register: service_staging_before
      changed_when: false

    - name: Initialize retained results
      ansible.builtin.set_fact:
        service_results: []

    - name: Verify only uniquely owned service and account resources
      block:
        - name: Allocate the owned dispatcher workspace
          sustainablelobster.legacy_windows.win_tempfile:  # noqa: args[module]
            state: directory
            prefix: legacy-service-credentials-
          register: service_workspace

        - name: Journal service absence and create the native dispatcher script
          sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-'
              - '{{ service_workspace.path }}'
              - setup
            stdin: '{{ service_fixture }}'
          register: service_setup
          no_log: true

        - name: Derive owned names and private fixture passwords
          vars:
            journal: '{{ service_setup.stdout | from_json }}'
          ansible.builtin.set_fact:
            service_names: '{{ journal.names }}'
            service_commands: '{{ journal.commands }}'
            service_account: '{{ "lwsc_" ~ journal.token[:12] }}'
            service_password_initial: >-
              {{ '1qaz@WSX-A-' ~ lookup('ansible.builtin.password',
                 '/dev/null length=24 chars=ascii_letters,digits') }}
            service_password_rotated: >-
              {{ '1qaz@WSX-B-' ~ lookup('ansible.builtin.password',
                 '/dev/null length=24 chars=ascii_letters,digits') }}
            service_password_wrong: >-
              {{ '1qaz@WSX-X-' ~ lookup('ansible.builtin.password',
                 '/dev/null length=24 chars=ascii_letters,digits') }}
          no_log: true

        - name: Select every secret for public-result and evidence scanning
          ansible.builtin.set_fact:
            service_credentials_passwords:
              - '{{ service_password_initial }}'
              - '{{ service_password_rotated }}'
              - '{{ service_password_wrong }}'
          no_log: true

        - name: Query initial account absence # noqa: args[module]
          sustainablelobster.legacy_windows.win_user:
            name: '{{ service_account }}'
            state: query
          register: service_initial_account

        - name: Refuse a preexisting account with the generated name
          ansible.builtin.assert:
            that: service_initial_account.state == 'absent'

        - name: Read original service logon rights # noqa: args[module]
          sustainablelobster.legacy_windows.win_user_right:
            name: SeServiceLogonRight
            users: []
            action: add
          diff: true
          register: service_rights_before

        - name: Create the owned account # noqa: args[module]
          sustainablelobster.legacy_windows.win_user:
            name: '{{ service_account }}'
            password: '{{ service_password_initial }}'
            password_never_expires: true
            state: present
          register: service_user
          no_log: true

        - name: Grant the owned service logon right # noqa: args[module]
          sustainablelobster.legacy_windows.win_user_right:
            name: SeServiceLogonRight
            users: ['{{ service_user.sid }}']
            action: add
          register: service_rights_grant

        - name: Let the owned service account execute and observe its dispatcher
          sustainablelobster.legacy_windows.win_acl:  # noqa: args[module]
            path: '{{ service_workspace.path }}'
            user: '{{ service_user.sid }}'
            rights: Modify
            type: allow

        - name: Verify native SYSTEM acquisition through an owned SCM dispatcher
          ansible.builtin.include_tasks: tasks/win_service_case.yml
          loop: '{{ service_credential_system_cases }}'
          loop_control: &service_credential_loop
            loop_var: service_case
            label: '{{ service_case.name }}'

        - name: Verify real initial service credentials and idempotence
          ansible.builtin.include_tasks: tasks/win_service_case.yml
          loop: '{{ service_credential_initial_cases }}'
          loop_control: *service_credential_loop

        - name: Stop before rotating the account password
          ansible.builtin.include_tasks: tasks/win_service_case.yml
          loop: '{{ service_credential_stop_cases }}'
          loop_control: *service_credential_loop

        - name: Rotate the actual account password
          sustainablelobster.legacy_windows.win_user:  # noqa: args[module]
            name: '{{ service_account }}'
            password: '{{ service_password_rotated }}'
            update_password: always
          register: service_account_rotated
          no_log: true

        - name: Verify the old stored password no longer permits startup
          ansible.builtin.include_tasks: tasks/win_service_case.yml
          loop: '{{ service_credential_stale_cases }}'
          loop_control: *service_credential_loop

        - name: Verify rotated credentials prediction denial and recovery
          ansible.builtin.include_tasks: tasks/win_service_case.yml
          loop: '{{ service_credential_rotated_cases }}'
          loop_control: *service_credential_loop
      always:
        - name: Recover journaled services and wait for dispatcher exit
          sustainablelobster.legacy_windows.win_command:  # noqa: args[module]
            argv:
              - '{{ ansible_python_interpreter }}'
              - '-'
              - '{{ service_workspace.path }}'
              - cleanup
            stdin: '{{ service_fixture }}'
          when: service_setup.stdout is defined
          register: service_cleanup
          no_log: true

        - name: Require independently verified service and dispatcher absence
          ansible.builtin.assert:
            that: (service_cleanup.stdout | from_json).restored
          when: service_cleanup.stdout is defined

        - name: Remove the owned service logon right # noqa: args[module]
          sustainablelobster.legacy_windows.win_user_right:
            name: SeServiceLogonRight
            users: ['{{ service_user.sid }}']
            action: remove
          when: service_user.sid is defined

        - name: Read restored service logon rights # noqa: args[module]
          sustainablelobster.legacy_windows.win_user_right:
            name: SeServiceLogonRight
            users: []
            action: add
          diff: true
          when: service_rights_before.diff is defined
          register: service_rights_after

        - name: Require unchanged unrelated logon-right assignments
          ansible.builtin.assert:
            that: service_rights_before.diff == service_rights_after.diff
          when: service_rights_before.diff is defined

        - name: Delete the owned fixture account
          sustainablelobster.legacy_windows.win_user:  # noqa: args[module]
            name: '{{ service_account }}'
            state: absent
          when: service_user.sid is defined
          register: service_account_cleanup

        - name: Independently require owned account absence
          sustainablelobster.legacy_windows.win_user:  # noqa: args[module]
            name: '{{ service_account }}'
            state: query
          when: service_user.sid is defined
          register: service_account_final

        - name: Require account deletion
          ansible.builtin.assert:
            that: service_account_final.state == 'absent'
          when: service_account_final.state is defined

        - name: Remove the verified owned dispatcher workspace
          sustainablelobster.legacy_windows.win_file:  # noqa: args[module]
            path: '{{ service_workspace.path }}'
            state: absent
          when: service_workspace.path is defined

        - name: Independently verify workspace and staging cleanup
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob, json, os, sys, tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps(sorted(glob.glob(os.path.join(tempfile.gettempdir(),
            'ansible-tmp-*')))))" "{{ service_workspace.path }}""
          when: service_workspace.path is defined
          register: service_staging_after
          changed_when: false

        - name: Require unchanged Ansible staging directories
          ansible.builtin.assert:
            that: >-
              (service_staging_before.stdout | from_json) ==
              (service_staging_after.stdout | from_json)
          when: service_staging_after.stdout is defined

        - name: Preserve secret-free public native and recovery observations
          ansible.builtin.copy:
            content: '{{ service_capture | to_nice_json }}'
            dest: '{{ service_capture_file.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *service_credentials_local
          changed_when: false
          no_log: true
