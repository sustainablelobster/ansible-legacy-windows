---
- name: Compare complete URI FTP responses using the maintained owned server
  hosts: legacy_windows
  gather_facts: false
  vars_files:
    - vars/get_url_fixture.yml
    - vars/get_url_ftp_fixture.yml
    - vars/uri_ftp.yml
    - vars/command_inputs.yml
  vars:
    get_url_ftp_controller_parent: '{{ playbook_dir }}/../../tmp'
    get_url_ftp_selected_cases: >-
      {{ uri_ftp_cases }}
  tasks:
    - name: Require one selected guest and an owner-private SSH directory
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | length == 1
          - lookup('env', 'ANSIBLE_SSH_CONTROL_PATH_DIR') | length > 0

    - name: Observe actual Python Windows MAC and original staging
      ansible.builtin.raw: >-
        cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
        "exec(__import__('base64').b64decode(
        '{{ command_inputs_observer | b64encode }}'))" "[10, 0]""
      register: uri_ftp_identity
      changed_when: false
      no_log: true

    - name: Require VM110 identity before any owned allocation
      ansible.builtin.assert:
        that:
          - uri_ftp_identity.rc == 0
          - >-
            'BC-24-11-3E-87-91' in
            (uri_ftp_identity.stdout | from_json).mac | upper

    - name: Verify effective rejection inputs before fixture allocation
      when: uri_ftp_expected_case_names is defined
      tags: [uri_ftp_rejection_selection]
      ansible.builtin.assert:
        that:
          - >-
            get_url_ftp_selected_cases | map(attribute='name') | list ==
            uri_ftp_expected_case_names
          - uri_ftp_capture_verifier == 'verify_uri_ftp_rejections.py'
          - >-
            (uri_ftp_validate | bool) ==
            (uri_ftp_rejection_expected_validation | default(true) | bool)

    - name: Allocate private FTP evidence
      ansible.builtin.tempfile:
        state: file
        path: '{{ get_url_ftp_controller_parent }}'
        prefix: uri-ftp-
        suffix: .json
      register: get_url_capture
      delegate_to: localhost
      vars: &local
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
      changed_when: false

    - name: Initialize complete public evidence
      ansible.builtin.set_fact:
        get_url_results: []

    - name: Read the actual released FTP status enum
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          foreach ($name in [Enum]::GetNames([Net.FtpStatusCode])) {
              $value = [Enum]::Parse([Net.FtpStatusCode], $name)
              [ordered]@{name=$name; value=[int]$value;
                         display=$value.ToString()}
          }
      register: uri_ftp_enum
      no_log: true

    - name: Exercise FTP in owned controller and target workspaces
      block:
        - name: Prove actual Python 3.4.4, free guest ports and original staging
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,socket,sys,tempfile;
            assert sys.version_info[:3] == (3,4,4);
            sockets=[socket.socket() for port in (2121,2122)];
            [connection.bind(('127.0.0.1',port))
            for connection,port in zip(sockets,(2121,2122))];
            print(json.dumps({'python':sys.version,
            'staging':sorted(glob.glob(os.path.join(
            tempfile.gettempdir(),'ansible-tmp-*')))}))""
          register: get_url_staging_before
          changed_when: false

        - name: Allocate empty owned controller FTP workspace
          ansible.builtin.tempfile:
            state: directory
            path: '{{ get_url_ftp_controller_parent }}'
            prefix: get-url-ftp-
          register: get_url_ftp_workspace
          delegate_to: localhost
          vars: *local
          changed_when: false

        - name: Start the journaled controller-only FTP server
          ansible.builtin.command:
            argv: ['{{ ansible_playbook_python }}', '-',
                   '{{ get_url_ftp_workspace.path }}', setup,
                   '{{ get_url_ftp_controller_parent }}']
            stdin: '{{ get_url_ftp_program }}'
          register: get_url_ftp_setup
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

        - name: Bind controller FTP metadata
          ansible.builtin.set_fact:
            get_url_ftp_setup_data: '{{ get_url_ftp_setup.stdout | from_json }}'

        - name: Allocate owned target file fixture  # noqa: args[module]
          sustainablelobster.legacy_windows.win_tempfile:
            state: directory
            prefix: legacy-windows-get-url-
          register: get_url_workspace

        - name: Start unchanged target fixture  # noqa: args[module]
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ get_url_workspace.path }}', setup]
            stdin: '{{ get_url_program }}'
          register: get_url_setup
          changed_when: false
          no_log: true

        - name: Bind unchanged target fixture metadata and SSH multiplex socket
          ansible.builtin.set_fact:
            get_url_setup_data: '{{ get_url_setup.stdout | from_json }}'
            get_url_ftp_connection:
              destination: '{{ ansible_host }}'
              socket: >-
                {{ lookup('env', 'ANSIBLE_SSH_CONTROL_PATH_DIR') + '/' +
                   ((ansible_host + '-' +
                     (ansible_port | default('None') | string) +
                     '-' + ansible_user) | hash('sha1'))[:10] }}
          no_log: true

        - name: Open only the two journaled SSH reverse forwards
          ansible.builtin.command:
            argv: ['{{ ansible_playbook_python }}', '-',
                   '{{ get_url_ftp_workspace.path }}', forward,
                   '{{ get_url_ftp_controller_parent }}',
                   '{{ get_url_ftp_connection | to_json }}']
            stdin: '{{ get_url_ftp_program }}'
          register: get_url_ftp_forward
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

        - name: Capture every source case before result assertions
          ansible.builtin.include_tasks: tasks/uri_ftp_case.yml
          loop: '{{ get_url_ftp_selected_cases }}'
          loop_control:
            loop_var: get_url_ftp_case
            label: '{{ get_url_ftp_case.name }}'
          vars:
            get_url_case: '{{ get_url_ftp_case }}'
      always:
        - name: Retain complete raw public evidence before recovery
          ansible.builtin.copy:
            content: >-
              {{ {'identity': uri_ftp_identity, 'enum': uri_ftp_enum,
                  'results': get_url_results,
                  'controller_workspace': get_url_ftp_workspace | default(none),
                  'controller_setup': get_url_ftp_setup | default(none),
                  'forward': get_url_ftp_forward | default(none),
                  'setup': get_url_setup | default(none),
                  'workspace': get_url_workspace | default(none),
                  'staging_before': get_url_staging_before | default(none)} |
                 to_nice_json }}
            dest: '{{ get_url_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

        - name: Cancel only forwards associated with the recorded SSH master
          when: get_url_ftp_workspace.path is defined
          ansible.builtin.command:
            argv: ['{{ ansible_playbook_python }}', '-',
                   '{{ get_url_ftp_workspace.path }}', unforward,
                   '{{ get_url_ftp_controller_parent }}']
            stdin: '{{ get_url_ftp_program }}'
          register: get_url_ftp_unforward
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

        - name: Independently prove both guest reverse listeners are closed
          when: get_url_ftp_workspace.path is defined
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import json,socket;
            connections=[socket.socket() for port in (2121,2122)];
            assert all(connection.connect_ex(('127.0.0.1',port)) != 0
            for connection,port in zip(connections,(2121,2122)));
            print(json.dumps({'guest_forward_ports_closed':True}))""
          register: get_url_ftp_guest_closed
          changed_when: false

        - name: Recover unchanged target file fixture  # noqa: args[module]
          when: get_url_workspace.path is defined
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ get_url_workspace.path }}', cleanup]
            stdin: '{{ get_url_program }}'
          register: get_url_recovery
          changed_when: false
          no_log: true

        - name: Require target recovery before deleting any owned target files
          when: get_url_workspace.path is defined
          ansible.builtin.assert:
            that:
              - (get_url_recovery.stdout | from_json).restored
              - (get_url_recovery.stdout | from_json).server_stopped

        - name: Finalize unchanged target journal  # noqa: args[module]
          when: get_url_workspace.path is defined
          sustainablelobster.legacy_windows.win_command:
            argv: ['{{ ansible_python_interpreter }}', '-',
                   '{{ get_url_workspace.path }}', finalize]
            stdin: '{{ get_url_program }}'
          changed_when: false
          no_log: true

        - name: Remove verified target workspace  # noqa: args[module]
          when: get_url_workspace.path is defined
          sustainablelobster.legacy_windows.win_file:
            path: '{{ get_url_workspace.path }}'
            state: absent

        - name: Independently prove target absence and unchanged global staging
          when: get_url_workspace.path is defined
          ansible.builtin.raw: >-
            cmd.exe /d /s /c ""{{ ansible_python_interpreter }}" -c
            "import glob,json,os,sys,tempfile;
            assert not os.path.exists(sys.argv[1]);
            print(json.dumps({'staging':sorted(glob.glob(os.path.join(
            tempfile.gettempdir(),'ansible-tmp-*'))),
            'workspace_absent':True}))" "{{ get_url_workspace.path }}""
          register: get_url_staging_after
          changed_when: false

        - name: Require original global staging
          when: get_url_workspace.path is defined
          ansible.builtin.assert:
            that:
              - >-
                (get_url_staging_before.stdout | from_json).staging ==
                (get_url_staging_after.stdout | from_json).staging

        - name: Stop exact controller process and verify protected materials
          when: get_url_ftp_workspace.path is defined
          ansible.builtin.command:
            argv: ['{{ ansible_playbook_python }}', '-',
                   '{{ get_url_ftp_workspace.path }}', cleanup,
                   '{{ get_url_ftp_controller_parent }}']
            stdin: '{{ get_url_ftp_program }}'
          register: get_url_ftp_recovery
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

        - name: Require controller restoration and process termination
          when: get_url_ftp_workspace.path is defined
          ansible.builtin.assert:
            that:
              - (get_url_ftp_recovery.stdout | from_json).restored
              - (get_url_ftp_recovery.stdout | from_json).server_stopped

        - name: Verify the exact allowed controller workspace entries
          when: get_url_ftp_workspace.path is defined
          ansible.builtin.command:
            argv: ['{{ ansible_playbook_python }}', '-',
                   '{{ get_url_ftp_workspace.path }}', finalize,
                   '{{ get_url_ftp_controller_parent }}']
            stdin: '{{ get_url_ftp_program }}'
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

        - name: Remove only the verified owned controller workspace
          when: get_url_ftp_workspace.path is defined
          ansible.builtin.file:
            path: '{{ get_url_ftp_workspace.path }}'
            state: absent
          delegate_to: localhost
          vars: *local
          changed_when: false

        - name: Independently prove controller workspace absence
          when: get_url_ftp_workspace.path is defined
          ansible.builtin.stat:
            path: '{{ get_url_ftp_workspace.path }}'
          register: get_url_ftp_absence
          delegate_to: localhost
          vars: *local

        - name: Retain full public, protocol and cleanup evidence
          ansible.builtin.copy:
            content: >-
              {{ {'identity': uri_ftp_identity, 'enum': uri_ftp_enum,
                  'results': get_url_results,
                  'controller_setup': get_url_ftp_setup | default(none),
                  'forward': get_url_ftp_forward | default(none),
                  'setup': get_url_setup | default(none),
                  'workspace': get_url_workspace | default(none),
                  'controller_workspace': get_url_ftp_workspace | default(none),
                  'recovery': get_url_recovery | default(none),
                  'controller_recovery': get_url_ftp_recovery | default(none),
                  'unforward': get_url_ftp_unforward | default(none),
                  'guest_closed': get_url_ftp_guest_closed | default(none),
                  'controller_absence': get_url_ftp_absence | default(none),
                  'staging_before': get_url_staging_before | default(none),
                  'staging_after': get_url_staging_after | default(none)} |
                 to_nice_json }}
            dest: '{{ get_url_capture.path }}'
            mode: '0600'
          delegate_to: localhost
          vars: *local
          changed_when: false
          no_log: true

    - name: Require complete URI captures after recovery
      ansible.builtin.assert:
        that:
          - get_url_results | length == get_url_ftp_selected_cases | length
          - >-
            get_url_results | map(attribute='name') | sort ==
            get_url_ftp_selected_cases | map(attribute='name') | sort
          - not get_url_ftp_absence.stat.exists
          - >-
            not uri_ftp_validate | bool or
            get_url_results | rejectattr('validated', 'equalto', true) |
            list | length == 0

    - name: Reset the owner-private standard connection
      ansible.builtin.meta: reset_connection

    - name: Verify complete public wire files and recovery from retained capture
      when: uri_ftp_validate | bool
      ansible.builtin.command:
        argv: ['{{ ansible_playbook_python }}',
               '{{ playbook_dir }}/{{ uri_ftp_capture_verifier |
                  default("verify_uri_ftp.py") }}',
               '{{ get_url_capture.path }}']
      delegate_to: localhost
      vars: *local
      changed_when: false
