- name: Inspect native file versions through the public Windows module
  hosts: legacy_windows
  gather_facts: false
  tasks:
    - name: Read the command interpreter version
      sustainablelobster.legacy_community_windows.win_file_version:
        path: '%SystemRoot%\System32\cmd.exe'
      register: command_version

    - name: Repeat the query in check mode
      sustainablelobster.legacy_community_windows.win_file_version:
        path: '%SystemRoot%\System32\cmd.exe'
      check_mode: true
      register: checked_version

    - name: Inspect an absent executable
      sustainablelobster.legacy_community_windows.win_file_version:
        path: '%SystemRoot%\legacy-community-does-not-exist.exe'
      register: missing_version
      failed_when: false

    - name: Require version strings and read-only behavior
      ansible.builtin.assert:
        that:
          - command_version is not changed
          - checked_version is not changed
          - command_version.win_file_version == checked_version.win_file_version
          - command_version.win_file_version.file_version | length > 0
          - >-
            command_version.win_file_version.file_version_raw is
            match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
          - command_version.win_file_version.file_major_part is string
          - missing_version is not changed
          - "'does not exist' in missing_version.msg"
