DOCUMENTATION:
  name: dn_escape
  author:
    - Jordan Borean (@jborean93)
  short_description: Escape an LDAP DistinguishedName value string.
  version_added: "1.0.0"
  seealso:
    - plugin: sustainablelobster.legacy_ad.parse_dn
      plugin_type: filter
      description: sustainablelobster.legacy_ad.parse_dn filter
    - plugin: sustainablelobster.legacy_ad.ldap
      plugin_type: inventory
      description: sustainablelobster.legacy_ad.ldap inventory
  description:
    - Escapes a string value for use in an LDAP DistinguishedName.
    - This can be used to escape special characters when building a
      DistinguishedName value.
  positional: _input
  options:
    _input:
      description:
        - The string value to escape.
        - This should be just the RDN value not including the attribute type
          that prefixes the value, for example C(MyValue) and not C(CN=MyValue).
      type: str
      required: true

EXAMPLES: |
  # This is an example used in the sustainablelobster.legacy_ad.ldap plugin

  search_base: >-
    OU={{ my_ou_variable |
       sustainablelobster.legacy_ad.dn_escape }},DC=domain,DC=com

  # This is an example with the sustainablelobster.legacy_ad.user module

  - sustainablelobster.legacy_ad.user:
      name: MyUser
      password: MyPassword123
      state: present
      path: >-
        OU={{ my_ou_variable | sustainablelobster.legacy_ad.dn_escape }},
        DC=domain,DC=com

RETURN:
  _value:
    description:
      - The escaped RDN attribute value.
    type: string
