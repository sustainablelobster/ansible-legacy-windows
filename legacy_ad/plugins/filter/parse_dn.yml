DOCUMENTATION:
  name: parse_dn
  author:
    - Jordan Borean (@jborean93)
  short_description: Parses an LDAP DistinguishedName string into an object.
  version_added: "1.0.0"
  seealso:
    - plugin: sustainablelobster.legacy_ad.dn_escape
      plugin_type: filter
      description: sustainablelobster.legacy_ad.dn_escape filter
    - plugin: sustainablelobster.legacy_ad.split_dn
      plugin_type: filter
      description: sustainablelobster.legacy_ad.split_dn filter
    - plugin: sustainablelobster.legacy_ad.ldap
      plugin_type: inventory
      description: sustainablelobster.legacy_ad.ldap inventory
  description:
    - Parses the provided LDAP DistinguishedName (C(DN)) string value into a
      structured object.
    - The rules for parsing as defined in
      L(RFC 4514,https://www.ietf.org/rfc/rfc4514.txt).
    - Each DN contains Relative DistinguishedNames (C(RDN)) separated by C(,).
      Each RDN can contain multiple attribute type values also known as an
      C(AVA). While Microsoft Active Directory DNs can only contain 1 AVA in an
      RDN this parser supports multiple AVAs.
    - Each DN is returned as a list of RDN lists. Each RDN list contains
      alternating attribute names and values, with at least two strings.
      Multi-valued RDNs contain additional attribute/value pairs for the AVAs
      separated by C(+).
    - The parsed RDN attribute values will be unescaped to represent the actual
      value rather than the raw string in the DN.
    - A DN that is invalid will raise a filter error.
  positional: _input
  options:
    _input:
      description:
        - The LDAP DistinguishedName string to parse.
      type: str
      required: true

EXAMPLES: |
  - name: Parses a simple DN
    set_fact:
      my_dn: >-
        {{ "CN=Foo,DC=domain,DC=com" | sustainablelobster.legacy_ad.parse_dn }}

  # [
  #   ["CN", "Foo"],
  #   ["DC", "domain"],
  #   ["DC", "com"],
  # ]

  - name: Parses a DN with an escaped and multi attribute values
    set_fact:
      my_dn: >-
        {{ "CN=CA,O=Acme\, Inc.,C=AU+ST=Queensland" |
           sustainablelobster.legacy_ad.parse_dn }}

  # [
  #   ["CN", "CA"],
  #   ["O", "Acme, Inc."],
  #   ["C", "AU", "ST", "Queensland"]
  # ]

  # Extract the group names the computer is a member of in the ldap inventory
  # plugin, for example gets the first RDN value inside the parsed DN.
  attributes:
    memberOf:
      computer_membership: >-
        this | sustainablelobster.legacy_ad.parse_dn | map(attribute="0.1")

RETURN:
  _value:
    description:
      - The parsed LDAP DN values.
    type: list
    elements: list
    sample:
      - - CN
        - Foo
      - - DC
        - domain
      - - DC
        - com
