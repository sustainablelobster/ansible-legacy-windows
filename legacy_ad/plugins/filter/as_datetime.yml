DOCUMENTATION:
  name: as_datetime
  author:
    - Jordan Borean (@jborean93)
  short_description: Converts an LDAP value to a datetime string
  version_added: "1.0.0"
  seealso:
    - plugin: sustainablelobster.legacy_ad.as_guid
      plugin_type: filter
      description: sustainablelobster.legacy_ad.as_guid filter
    - plugin: sustainablelobster.legacy_ad.as_sid
      plugin_type: filter
      description: sustainablelobster.legacy_ad.as_sid filter
    - plugin: sustainablelobster.legacy_ad.ldap
      plugin_type: inventory
      description: sustainablelobster.legacy_ad.ldap inventory
  description:
    - Converts an LDAP integer or raw value to a datetime string.
    - Use with the C(sustainablelobster.legacy_ad.ldap) plugin to convert
      attribute values to a datetime string.
  positional: _input
  options:
    _input:
      description:
        - The LDAP attribute bytes or integer value representing a FILETIME
          integer stored in LDAP.
        - The resulting datetime will be set as a UTC datetime as that's how the
          FILETIME value is stored in LDAP.
      type: raw
      required: true
    format:
      description:
        - The string format to format the datetime object as.
        - Defaults to an ISO 8601 compatible string, for example
          C(2023-02-06T07:39:09.195321+0000).
      default: "%Y-%m-%dT%H:%M:%S.%f%z"
      type: str

EXAMPLES: |
  # This is an example used in the sustainablelobster.legacy_ad.ldap plugin

  # Converting from the coerced value
  attributes:
    pwdLastSet: this | sustainablelobster.legacy_ad.as_datetime

  # Converting from the raw bytes value
  attributes:
    maxPwdAge: raw | sustainablelobster.legacy_ad.as_datetime

RETURN:
  _value:
    description:
      - The datetime string value(s) formatted as per the I(format) option.
    type: string
