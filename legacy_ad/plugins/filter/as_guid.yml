DOCUMENTATION:
  name: as_guid
  author:
    - Jordan Borean (@jborean93)
  short_description: Converts an LDAP value to a GUID string
  version_added: "1.0.0"
  seealso:
    - plugin: sustainablelobster.legacy_ad.as_datetime
      plugin_type: filter
      description: sustainablelobster.legacy_ad.as_datetime filter
    - plugin: sustainablelobster.legacy_ad.as_sid
      plugin_type: filter
      description: sustainablelobster.legacy_ad.as_sid filter
    - plugin: sustainablelobster.legacy_ad.ldap
      plugin_type: inventory
      description: sustainablelobster.legacy_ad.ldap inventory
  description:
    - Converts an LDAP string or raw value to a guid string.
    - Use with the C(sustainablelobster.legacy_ad.ldap) plugin to convert
      attribute values to a guid string.
  positional: _input
  options:
    _input:
      description:
        - The LDAP attribute bytes or string value representing a GUID
          stored in LDAP.
        - If using a string as input, it must be a base64 string representing
          the GUIDs bytes.
      type: raw
      required: true

EXAMPLES: |
  # This is an example used in the sustainablelobster.legacy_ad.ldap plugin

  attributes:
    objectGuid: raw | sustainablelobster.legacy_ad.as_guid

RETURN:
  _value:
    description:
      - The guid string value(s).
    type: string
