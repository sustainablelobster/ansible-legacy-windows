DOCUMENTATION:
  module: service_account
  short_description: Manage Active Directory group managed service accounts
  description:
    - Manages group managed service accounts (gMSA) and their attributes
      through signed and sealed native LDAP operations.
    - The contacted directory must provide the gMSA schema and usable KDS
      root-key capabilities. Password generation remains the directory's
      responsibility; this module neither sets nor returns the managed password.
  version_added: 1.0.0
  options:
    allowed_to_retrieve_password:
      description:
        - The principals that are allowed to retrieve the password for
          the service account to either add, remove, or set.
        - Each subkey value is a list of values in the form of a
          C(distinguishedName), C(objectGUID), C(objectSid), c(sAMAccountName),
          or C(userPrincipalName)
          string or a dictionary with the I(name) and optional I(server)
          key.
        - Sets the C(msDS-GroupMSAMembership) security descriptor using the
          released AD cmdlet's principal projection and replacement semantics.
        - This corresponds to the C(-PrincipalsAllowedToRetrieveManagedPassword)
          parameter on the AD cmdlets.
        - To clear all principals, use I(set) with an empty list.
      type: dict
      suboptions:
        add:
          description:
            - Adds the principals specified as principals allowed to
              retrieve the service account password.
            - Any existing principals not specified by I(add) will be
              untouched unless specified by I(remove) or not in I(set).
          type: list
          elements: raw
        lookup_failure_action:
          description:
            - Control the action to take when the lookup fails to find
              the DN.
            - C(fail) will cause the task to fail.
            - C(ignore) will ignore the value and continue.
            - C(warn) will ignore the value and display a warning.
          choices:
            - fail
            - ignore
            - warn
          default: fail
          type: str
        remove:
          description:
            - Removes the principals specified as principals allowed
              to retrieve the service account password.
            - Any existing pricipals not specified by I(remove) will
              be untouched unless I(set) is defined.
          type: list
          elements: raw
        set:
          description:
            - Sets the principals specified as principals allowed to
              retrieve the service account password.
            - This will remove any existing principals if not specified
              in this list.
            - Specify an empty list to remove all principals allowed
              to delegate.
          type: list
          elements: raw
    delegates:
      description:
        - The principal objects that the current AD object can trust
          for delegation to either add, remove or set.
        - This is also known as resource-based constrained delegation.
        - Each subkey value is a list of values in the form of a
          C(distinguishedName), C(objectGUID), C(objectSid), C(sAMAccountName),
          or C(userPrincipalName)
          string or a dictionary with the I(name) and optional I(server)
          key.
        - This is the value set on the
          C(msDS-AllowedToActOnBehalfOfOtherIdentity) LDAP attribute.
        - This is a highly sensitive attribute as it allows the principals
          specified to impersonate any account when authenticating with
          a service running as this managed account.
        - To clear all principals, use I(set) with an empty list.
      aliases:
        - principals_allowed_to_delegate
      type: dict
      suboptions:
        add:
          description:
            - Adds the principals specified as principals allowed to
              delegate to.
            - Any existing principals not specified by I(add) will be
              untouched unless specified by I(remove) or not in I(set).
          type: list
          elements: raw
        lookup_failure_action:
          description:
            - Control the action to take when the lookup fails to find
              the DN.
            - C(fail) will cause the task to fail.
            - C(ignore) will ignore the value and continue.
            - C(warn) will ignore the value and display a warning.
          choices:
            - fail
            - ignore
            - warn
          default: fail
          type: str
        remove:
          description:
            - Removes the principals specified as principals allowed
              to delegate to.
            - Any existing pricipals not specified by I(remove) will
              be untouched unless I(set) is defined.
          type: list
          elements: raw
        set:
          description:
            - Sets the principals specified as principals allowed to
              delegate to.
            - This will remove any existing principals if not specified
              in this list.
            - Specify an empty list to remove all principals allowed
              to delegate.
          type: list
          elements: raw
    dns_hostname:
      description:
        - Specifies the DNS name of the service account.
        - This is the value set on the C(dNSHostName) LDAP attribute.
        - This cannot be set when C(outbound_auth_only=True), otherwise
          it must be defined.
      type: str
    do_not_append_dollar_to_sam:
      description:
        - Do not automatically append C($) to the I(sam_account_name)
          value.
        - This only applies when I(sam_account_name) is explicitly set
          and can be used to create a service account without the C($)
          suffix.
      default: false
      type: bool
    enabled:
      description:
        - C(yes) will enable the service account.
        - C(no) will disable the service account.
      type: bool
    kerberos_encryption_types:
      description:
        - Specifies the Kerberos encryption types supported the AD service
          account.
        - This is the value set on the C(msDS-SupportedEncryptionTypes)
          LDAP attribute.
        - Avoid using C(rc4) or C(des) as they are older an insecure
          encryption protocols.
        - To clear all encryption types, use I(set) with an empty list.
      type: dict
      suboptions:
        add:
          description:
            - The encryption types to add to the existing set.
            - Any existing encryption types not specified by I(add)
              will be untouched unless specified by I(remove) or not
              in I(set).
          choices:
            - aes128
            - aes256
            - des
            - rc4
          type: list
          elements: str
        remove:
          description:
            - The encryption types to remove from the existing set.
            - Any existing encryption types not specified by I(remove)
              will be untouched unless I(set) is defined.
          choices:
            - aes128
            - aes256
            - des
            - rc4
          type: list
          elements: str
        set:
          description:
            - The encryption types to set as the only encryption types
              allowed by the AD service account.
            - This will remove any existing encryption types if not
              specified in this list.
            - Specify an empty list to remove all encryption types.
          choices:
            - aes128
            - aes256
            - des
            - rc4
          type: list
          elements: str
    outbound_auth_only:
      description:
        - Marks the service account for use with client outbound authentication
          only.
        - When set the service account can only be used for client roles
          only. For example it can only be used for outbound authentication
          attempts and cannot be used as a target authentication service
          principal.
        - If set then I(dns_hostname) cannot be set.
      default: false
      type: bool
    sam_account_name:
      description:
        - The C(sAMAccountName) value to set for the service account.
        - It has a maximum of 256 characters, 15 is advised for older
          operating systems compatibility.
        - If omitted the value is the same as C(name$) when the service
          account is created.
        - Note that service account C(sAMAccountName) values typically
          end with a C($).
        - By default if the C($) suffix is omitted, it will be added
          to the end. If I(do_not_append_dollar_to_sam=True) then the
          provided value will be used as is without adding C($) to the
          end.
      type: str
    spn:
      description:
        - Specifies the service principal name(s) for the account to
          add, remove or set.
        - This is the value set on the C(servicePrincipalName) LDAP
          attribute.
        - To clear all service principal names, use I(set) with an empty
          list.
      aliases:
        - spns
      type: dict
      suboptions:
        add:
          description:
            - The SPNs to add to C(servicePrincipalName).
          type: list
          elements: str
        remove:
          description:
            - The SPNs to remove from C(servicePrincipalName).
          type: list
          elements: str
        set:
          description:
            - The SPNs to set as the only values in C(servicePrincipalName).
            - This will clear out any existing SPNs if not in the specified
              list.
            - Set to an empty list to clear all SPNs on the AD object.
          type: list
          elements: str
    trusted_for_delegation:
      description:
        - Specifies whether an account is trusted for Kerberos delegation.
        - This is also known as unconstrained Kerberos delegation.
        - This sets the C(ADS_UF_TRUSTED_FOR_DELEGATION) flag in the
          C(userAccountControl) LDAP attribute.
      type: bool
    upn:
      description:
        - Configures the User Principal Name (UPN) for the account.
        - The format is C(<username>@<domain>).
        - This is the value set on the C(userPrincipalName) LDAP attribute.
      type: str
  notes:
    - No ActiveDirectory PowerShell module or AD Web Services is required
      on the executing Windows host.
    - A usable, appropriately replicated KDS root key must be prepared before
      relying on managed-password retrieval.
    - Existing allow ACEs are projected as principals regardless of their access
      masks, matching upstream. A projected principal alone does not prove that
      a custom descriptor permits password retrieval.
    - An unchanged principal list preserves the existing descriptor. A changed
      list replaces it with owner C(BA) and full-control allow ACEs for the
      desired principals, removing other ACEs. An empty list clears the
      attribute.
    - A bare I(identity) is first resolved as supplied, then with C($) appended
      when it is not already a DN, GUID or SID.
  extends_documentation_fragment:
    - sustainablelobster.legacy_ad.ad_object
    - ansible.builtin.action_common_attributes
  attributes:
    check_mode:
      support: full
    diff_mode:
      support: full
    platform:
      platforms:
        - windows
  seealso:
    - module: microsoft.ad.service_account
  author:
    - sustainablelobster
    - Jordan Borean (@jborean93)
EXAMPLES: |
  - name: Manage a gMSA in a capability-qualified directory
    sustainablelobster.legacy_ad.service_account:
      name: Example
      dns_hostname: example.domain.test
      allowed_to_retrieve_password:
        set:
          - Service Hosts

  - name: Remove a gMSA by observed GUID
    sustainablelobster.legacy_ad.service_account:
      identity: d84a141f-2b99-4f08-9da0-ed2d26864ba1
      state: absent
RETURN:
  object_guid:
    description:
      - GUID of the created, edited or removed account.
      - Predicted creation returns an all-zero GUID in check mode.
    returned: always
    type: str
    sample: d84a141f-2b99-4f08-9da0-ed2d26864ba1
  distinguished_name:
    description:
      - Distinguished name of the created, edited or removed account.
    returned: always
    type: str
    sample: CN=Example,CN=Managed Service Accounts,DC=domain,DC=test
  sid:
    description:
      - Security identifier of the managed account.
      - Predicted creation returns C(S-1-5-0000) in check mode.
    returned: always
    type: str
    sample: S-1-5-21-4151808797-3430561092-2843464588-1104
