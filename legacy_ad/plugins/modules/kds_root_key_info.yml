DOCUMENTATION:
  module: kds_root_key_info
  short_description: Gather information about KDS root keys
  version_added: 1.0.0
  description:
    - Gather metadata about one KDS root key or all keys in a directory.
    - Uses the execution identity's domain and Windows credentials through
      signed and encrypted LDAP. Secret root-key material is never returned.
  options:
    key_id:
      description:
        - The ID of the key that should be queried.
        - If this is not provided, all keys will be returned.
      type: str
      required: false
  notes:
    - The directory must provide the KDS root-key container. An older Windows
      execution host can query a capable directory without installing the
      KDS PowerShell module.
    - Domain Administrator, Enterprise Administrator or equivalent delegated
      permissions are required. Use credential delegation or become when
      the connection logon cannot authenticate to the directory.
  extends_documentation_fragment:
    - ansible.builtin.action_common_attributes
  attributes:
    check_mode:
      support: full
      description: Reads the same metadata without changing the directory.
    diff_mode:
      support: none
    platform:
      platforms:
        - windows
  author:
    - sustainablelobster
    - Mike Morency (@mikemorency)
  seealso:
    - module: microsoft.ad.kds_root_key_info
EXAMPLES: |
  - name: Gather metadata for every root key
    sustainablelobster.legacy_ad.kds_root_key_info:

  - name: Gather metadata for one root key
    sustainablelobster.legacy_ad.kds_root_key_info:
      key_id: 11111111-1111-1111-1111-111111111111
RETURN:
  kds_root_keys:
    description: Metadata for matching keys, or an empty list if none match.
    returned: always
    type: list
    elements: dict
    contains:
      key_id:
        description: GUID identifying the root key.
        returned: always
        type: str
      effective_time:
        description:
          - Stored effective time in UTC; Windows applies its safety interval.
        returned: always
        type: str
        sample: '2026-03-16T05:13:36.4151133Z'
      creation_time:
        description: Time the key was created, in UTC.
        returned: always
        type: str
        sample: '2026-03-16T15:13:36.7190000Z'
      version_number:
        description: KDS configuration version recorded on the key.
        returned: always
        type: int
        sample: 1
