---
DOCUMENTATION:
  module: domain_controller
  short_description: Manage domain controller or member server state
  description:
    - Ensure that a Windows Server host is configured as a domain
      controller or demoted to member server.
    - This module may require subsequent use of the
      M(sustainablelobster.legacy_windows.win_reboot) action when changed.
  options:
    database_path:
      description:
        - The path to a directory on a fixed disk of the Windows host where the
          domain database will be created.
        - If not set then the default path is C(%SYSTEMROOT%\NTDS).
      type: path
    dns_domain_name:
      description:
        - When I(state=domain_controller), the DNS name of the domain for which
          the targeted Windows host should be a DC.
      type: str
    domain_admin_user:
      description:
        - Username of a domain admin for the target domain (necessary to promote
          or demote a domain controller).
      type: str
      required: true
    domain_admin_password:
      description:
        - Password for the specified I(domain_admin_user).
      type: str
      required: true
    domain_log_path:
      description:
        - Specified the fully qualified, non-UNC path to a directory on a fixed
          disk of the local computer that will contain the domain log files.
      type: path
    install_dns:
      description:
        - Whether to install the DNS service when creating the domain
          controller.
        - If omitted, the native promotion engine computes its default.
      type: bool
    install_media_path:
      description:
        - The path to a directory on a fixed disk of the Windows host where the
          Install From Media C(IFM) data will be used.
        # yamllint disable rule:line-length
        - See the
          L(Install using IFM guide,https://social.technet.microsoft.com/wiki/contents/articles/8630.active-directory-step-by-step-guide-to-install-an-additional-domain-controller-using-ifm.aspx)
          for more information.
        # yamllint enable rule:line-length
      type: path
    local_admin_password:
      description:
        - Password to be assigned to the local C(Administrator) user (required
          when I(state=member_server)).
      type: str
    read_only:
      description:
        - Whether to install the domain controller as a read only replica for an
          existing domain.
      type: bool
      default: false
    replication_source_dc:
      description:
        - Specifies the name of an existing domain controller in the forest that
          will be used as the replication source for the new domain controller.
      type: str
      version_added: 1.0.0
    safe_mode_password:
      description:
        - Safe mode password for the domain controller (required when
          I(state=domain_controller)).
      type: str
    site_name:
      description:
        - Specifies the name of an existing site where you can place the new
          domain controller.
        - This option is required when I(read_only=true).
      type: str
    state:
      description:
        - Whether the target host should be a domain controller or a member
          server.
      type: str
      choices:
        - domain_controller
        - member_server
      required: true
    sysvol_path:
      description:
        - The path to a directory on a fixed disk of the Windows host where the
          Sysvol folder will be created.
        - If not set then the default path is C(%SYSTEMROOT%\SYSVOL).
      type: path
  notes:
    - Demotion refuses a controller that still owns operation-master roles.
      Move those roles to another controller before requesting demotion.
    - Role changes require an installed unattended C(dcpromo.exe) engine.
      Uses its native answer-file format; unavailable choices fail before
      role changes. Older GUI engines do not provide console operation help.
    - A newly created controller may reject fresh logons until its first reboot.
      Retain an authenticated connection until the requested reboot can start.
      Normal Ansible SSH connection reuse supports this; disabling it can lose
      the connection after native creation but before reboot or result cleanup.
    - Uses a restricted temporary answer file accessible only to SYSTEM and
      Administrators. Unicode values use a UTF-16 answer file. Individual native
      fields can impose additional restrictions; Server 2003 rejects non-ASCII
      database directory names. Answer values cannot contain
      line breaks or NUL characters. Answer files are removed after execution.
      A literal C(*) password is reserved for interactive prompting and is
      rejected before role changes.
    - Existing domain-controller configuration is not reconciled beyond the
      released role and domain-name checks. Completed native role changes
      require a reboot even if temporary-file cleanup fails.
    - It is highly recommended to set I(reboot=true) to have Ansible manage the
      host reboot phase as the actions done by this module puts the host in a
      state where it may not be possible for Ansible to reconnect in a
      subsequent task without a reboot.
    - This module must be run on a Windows target host.
    - If using I(reboot=true), multiple reboots may occur if the host required a
      reboot before the domain promotion. Also ensure the fully qualified module
      name is used in the task or the I(collections) keyword includes this
      collection.
  extends_documentation_fragment:
    - ansible.builtin.action_common_attributes
    - ansible.builtin.action_common_attributes.flow
    - sustainablelobster.legacy_ad.action_reboot
  attributes:
    check_mode:
      support: full
    diff_mode:
      support: none
    platform:
      platforms:
        - windows
    action:
      support: full
    async:
      support: partial
      details: Supported for all scenarios except with I(reboot=True).
    bypass_host_loop:
      support: none
  seealso:
    - module: sustainablelobster.legacy_ad.computer
    - module: sustainablelobster.legacy_ad.domain
    - module: sustainablelobster.legacy_ad.domain_child
    - module: sustainablelobster.legacy_ad.group
    - module: sustainablelobster.legacy_ad.membership
    - module: sustainablelobster.legacy_ad.user
  author:
    - sustainablelobster
    - Matt Davis (@nitzmahone)
    - Jordan Borean (@jborean93)

EXAMPLES: |
  - name: Ensure a server is a domain controller
    sustainablelobster.legacy_ad.domain_controller:
      dns_domain_name: ansible.vagrant
      domain_admin_user: testguy@ansible.vagrant
      domain_admin_password: password123!
      safe_mode_password: password123!
      state: domain_controller
      reboot: true

  - name: Ensure a server is not a domain controller
    sustainablelobster.legacy_ad.domain_controller:
      domain_admin_user: testguy@ansible.vagrant
      domain_admin_password: password123!
      local_admin_password: password123!
      state: member_server
      reboot: true

  - name: Promote server as a read only domain controller
    sustainablelobster.legacy_ad.domain_controller:
      dns_domain_name: ansible.vagrant
      domain_admin_user: testguy@ansible.vagrant
      domain_admin_password: password123!
      safe_mode_password: password123!
      state: domain_controller
      read_only: true
      site_name: London
      reboot: true

  # This scenario is not recommended, use reboot: true when possible
  - name: Promote server with custom paths with manual reboot task
    sustainablelobster.legacy_ad.domain_controller:
      dns_domain_name: ansible.vagrant
      domain_admin_user: testguy@ansible.vagrant
      domain_admin_password: password123!
      safe_mode_password: password123!
      state: domain_controller
      sysvol_path: D:\SYSVOL
      database_path: D:\NTDS
      domain_log_path: D:\NTDS
    register: dc_promotion

  - name: Reboot after promotion
    sustainablelobster.legacy_windows.win_reboot:
    when: dc_promotion.reboot_required

RETURN:
  reboot_required:
    description: True if changes were made that require a reboot.
    returned: always
    type: bool
    sample: true
