DOCUMENTATION:
  module: fs_claim_rule
  short_description: Manage AD FS relying-party claim rules
  version_added: 1.0.0
  description:
    - Set, append or clear issuance transform and authorization rules on an
      existing AD FS relying-party trust, including the AD FS 2.0 snap-in.
  options:
    name:
      description:
        - The display name of the Relying Party Trust to manage rules
          on.
      type: str
      required: true
    transform_rules:
      description:
        - Issuance Transform Rules to apply to the trust.
        - These rules define how incoming identity claims are mapped
          or transformed before being sent to the relying party.
      type: dict
      suboptions:
        value:
          description:
            - List of claim rule strings in the AD FS claim rule language.
            - Each item is one rule block. Multiple items are joined
              with newlines before being applied.
          type: list
          elements: str
          required: true
        update:
          description:
            - How to apply the rules.
            - V(set) replaces all existing transform rules with the
              provided value.
            - V(append) adds the provided rules after any existing transform
              rules.
          type: str
          default: set
          choices:
            - set
            - append
    authorization_rules:
      description:
        - Issuance Authorization Rules to apply to the trust.
        - These rules define who is authorized to receive a token for
          the relying party.
      type: dict
      suboptions:
        value:
          description:
            - List of claim rule strings in the AD FS claim rule language.
            - Each item is one rule block. Multiple items are joined
              with newlines before being applied.
          type: list
          elements: str
          required: true
        update:
          description:
            - How to apply the rules.
            - V(set) replaces all existing authorization rules with
              the provided value.
            - V(append) adds the provided rules after any existing authorization
              rules.
          type: str
          default: set
          choices:
            - set
            - append
    state:
      description:
        - When V(present), the specified rules are set or appended.
        - When V(absent), all issuance transform and authorization rules
          are cleared from the trust.
      type: str
      default: present
      choices:
        - present
        - absent
  notes:
    - Requires a configured AD FS service, administrator permissions and its
      installed PowerShell management commands. AD FS 2.0 uses PowerShell 2.0
      and C(Microsoft.Adfs.PowerShell). No modern engine is installed or
      required.
    - Python passes rule strings as data. AD FS validates their syntax; native
      failures are returned without replacing its claim-rule language.
    - Whitespace normalization and append containment match the recorded
      upstream behavior. Check mode returns proposed rules without writing them.
    - AD FS rewrites stored rules. Spaces removed next to punctuation can still
      compare differently under the upstream normalization and report a change
      on repetition. Use the stored canonical formatting for that case.
  seealso:
    - module: microsoft.ad.fs_claim_rule
  extends_documentation_fragment:
    - ansible.builtin.action_common_attributes
  attributes:
    check_mode:
      support: full
    diff_mode:
      support: full
    platform:
      platforms:
        - windows
  author:
    - sustainablelobster
    - Ron Gershburg (@rgershbu)
EXAMPLES: |
  - name: Permit authenticated users on an existing relying-party trust
    sustainablelobster.legacy_ad.fs_claim_rule:
      name: Example
      authorization_rules:
        value:
          - >-
            @RuleTemplate = "AllowAllAuthzRule"
            => issue(
              Type = "http://schemas.microsoft.com/authorization/claims/permit",
                     Value = "true");

  - name: Clear both claim-rule sets
    sustainablelobster.legacy_ad.fs_claim_rule:
      name: Example
      state: absent
RETURN:
  transform_rules:
    description: >-
      Issuance transform rules after execution or their proposed check-mode
      value.
    returned: always
    type: str
  authorization_rules:
    description: >-
      Issuance authorization rules after execution or their proposed check-mode
      value.
    returned: always
    type: str
