---
DOCUMENTATION:
  module: domain
  version_added: 1.0.0
  short_description: Ensures the existence of a Windows domain
  description:
    - Ensure that the domain named by I(dns_domain_name) exists and is
      reachable.
    - When creation is required, the domain is created in a new forest on
      the target Windows Server host.
    - This module may require subsequent use of the
      M(sustainablelobster.legacy_windows.win_reboot) action when changed.
  options:
    create_dns_delegation:
      description:
        - Whether to create a DNS delegation that references the new DNS server
          that you install along with the domain controller.
        - Valid for Active Directory-integrated DNS only.
        - The default is computed automatically based on the environment.
      type: bool
    database_path:
      description:
        - The path to a directory on a fixed disk of the Windows host where the
          domain database will be created.
        - If not set then the default path is C(%SYSTEMROOT%\NTDS).
      type: path
    dns_domain_name:
      description:
        - The DNS name of the domain which should exist and be reachable or
          reside on the target Windows host.
      type: str
      required: true
    domain_mode:
      description:
        - Specifies the domain functional level of the first domain in the
          creation of a new forest.
        - The domain functional level cannot be lower than the forest functional
          level, but it can be higher.
        - The default is automatically computed and set.
        - Current known modes are C(Win2003), C(Win2008), C(Win2008R2),
          C(Win2012), C(Win2012R2), C(WinThreshold), or C(Win2025).
      type: str
    domain_netbios_name:
      description:
        - The NetBIOS name for the root domain in the new forest.
        - For NetBIOS names to be valid for use with this parameter they must be
          single label names of 15 characters or less, if not it will fail.
        - If this parameter is not set, then the default is automatically
          computed from the value of the I(domain_name) parameter.
      type: str
    forest_mode:
      description:
        - Specifies the forest functional level for the new forest.
        - The default forest functional level in Windows Server is typically the
          same as the version you are running.
        - Current known modes are C(Win2003), C(Win2008), C(Win2008R2),
          C(Win2012), C(Win2012R2), C(WinThreshold), or C(Win2025).
      type: str
    install_dns:
      description:
        - Whether to install the DNS service when creating the domain
          controller.
      type: bool
      default: true
    log_path:
      description:
        - Specifies the fully qualified, non-UNC path to a directory on a fixed
          disk of the local computer where the log file for this operation is
          written.
        - If not set then the default path is C(%SYSTEMROOT%\NTDS).
      type: path
    safe_mode_password:
      description:
        - Safe mode password for the domain controller.
      type: str
      required: true
    sysvol_path:
      description:
        - The path to a directory on a fixed disk of the Windows host where the
          Sysvol file will be created.
        - If not set then the default path is C(%SYSTEMROOT%\SYSVOL).
      type: path
  notes:
    - As in the upstream release, a reachable requested forest and any active
      domain-controller role are sufficient for an unchanged result. This
      module does not move an existing controller to the requested forest.
    - Role changes require an installed unattended C(dcpromo.exe) engine.
      Uses its native answer-file format; unavailable choices fail before
      role changes. Older GUI engines do not provide console operation help.
    - The older answer-file engine cannot set normal C(Win2003) functional
      levels before reboot. With I(reboot=true), the action finishes domain
      and forest levels after reboot. An explicit I(domain_mode) or
      I(forest_mode) requires I(reboot=true) on that engine. Without explicit
      levels and with I(reboot=false), it creates its level-0 default and
      returns a warning; unlike upstream, it does not choose the highest level.
      An ordinary rerun does not raise an existing forest's levels.
    - A newly created controller may reject fresh logons until its first reboot.
      Retain an authenticated connection until the requested reboot can start.
      Normal Ansible SSH connection reuse supports this; disabling it can lose
      the connection after native creation but before reboot or result cleanup.
    - Uses a restricted temporary answer file accessible only to SYSTEM and
      Administrators. Unicode values use a UTF-16 answer file. Individual native
      fields can impose additional restrictions; Server 2003 rejects non-ASCII
      database directory names. Answer values cannot contain
      line breaks or NUL characters. Answer files are removed after execution.
      A literal C(*) password is reserved for interactive prompting and is
      rejected before role changes.
    - Existing domain-controller configuration is not reconciled beyond the
      released role and domain-name checks. Completed native role changes
      require a reboot even if temporary-file cleanup fails.
    - This module must be run on a Windows target host.
    - If using I(reboot=true), multiple reboots may occur if the host required a
      reboot before the domain promotion. Also ensure the fully qualified module
      name is used in the task or the I(collections) keyword includes this
      collection.
  extends_documentation_fragment:
    - ansible.builtin.action_common_attributes
    - ansible.builtin.action_common_attributes.flow
    - sustainablelobster.legacy_ad.action_reboot
  attributes:
    check_mode:
      support: full
    diff_mode:
      support: none
    platform:
      platforms:
        - windows
    action:
      support: full
    async:
      support: partial
      details: Supported for all scenarios except with I(reboot=True).
    bypass_host_loop:
      support: none
  seealso:
    - module: sustainablelobster.legacy_ad.domain_child
    - module: sustainablelobster.legacy_ad.domain_controller
    - module: sustainablelobster.legacy_ad.group
    - module: sustainablelobster.legacy_ad.membership
    - module: sustainablelobster.legacy_ad.user
    - module: sustainablelobster.legacy_ad.computer
  author:
    - sustainablelobster
    - Matt Davis (@nitzmahone)
    - Jordan Borean (@jborean93)

EXAMPLES: |
  - name: Create new domain in a new forest on the target host and reboot
    sustainablelobster.legacy_ad.domain:
      dns_domain_name: ansible.vagrant
      safe_mode_password: password123!
      reboot: true

  - name: Create a forest with explicit settings before a separate reboot
    sustainablelobster.legacy_ad.domain:
      create_dns_delegation: false
      database_path: C:\Windows\NTDS
      dns_domain_name: ansible.vagrant
      domain_mode: Win2008R2
      domain_netbios_name: ANSIBLE
      forest_mode: Win2008R2
      safe_mode_password: password123!
      sysvol_path: C:\Windows\SYSVOL
    register: domain_install

  - name: Reboot host if install requires it
    sustainablelobster.legacy_windows.win_reboot:
    when: domain_install.reboot_required

RETURN:
  reboot_required:
    description: True if changes were made that require a reboot.
    returned: always
    type: bool
    sample: true
