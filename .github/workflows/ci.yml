---
name: CI

'on':
  pull_request:
  push:
    branches: [main, v1]
    tags: ['legacy_windows/v*', 'legacy_ad/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.event.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Privileged cache extraction must not create directories in the checkout.
      - name: Prepare runner-owned work directories
        run: |
          mkdir -p "$RUNNER_TEMP/pre-commit" "$RUNNER_TEMP/legacy-windows-ci"
          printf 'PRE_COMMIT_HOME=%s\n' "$RUNNER_TEMP/pre-commit" \
            >> "$GITHUB_ENV"
          printf 'CI_OUTPUT_DIR=%s\n' "$RUNNER_TEMP/legacy-windows-ci" \
            >> "$GITHUB_ENV"
      - uses: >-
          cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        # v31.11.1
      - uses: >-
          nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        # v7.0.2; only a trusted branch run of this job saves dependencies.
        with:
          primary-key: >-
            nix-${{ runner.os }}-${{
            hashFiles('flake.lock', 'flake.nix', '.pre-commit-config.yaml') }}
          paths: ${{ env.PRE_COMMIT_HOME }}
          save: >-
            ${{ github.repository ==
            'sustainablelobster/ansible-legacy-windows'
            && github.event_name == 'push'
            && (github.ref == 'refs/heads/main'
            || github.ref == 'refs/heads/v1') }}
      - name: Run maintained lint checks
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            develop --no-write-lock-file path:. --command just lint
          git diff --exit-code

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Privileged cache extraction must not create directories in the checkout.
      - name: Prepare runner-owned work directories
        run: |
          mkdir -p "$RUNNER_TEMP/pre-commit" "$RUNNER_TEMP/legacy-windows-ci"
          printf 'PRE_COMMIT_HOME=%s\n' "$RUNNER_TEMP/pre-commit" \
            >> "$GITHUB_ENV"
          printf 'CI_OUTPUT_DIR=%s\n' "$RUNNER_TEMP/legacy-windows-ci" \
            >> "$GITHUB_ENV"
      - uses: >-
          cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        # v31.11.1
      - uses: >-
          nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        # v7.0.2
        with:
          primary-key: >-
            nix-${{ runner.os }}-${{
            hashFiles('flake.lock', 'flake.nix', '.pre-commit-config.yaml') }}
          paths: ${{ env.PRE_COMMIT_HOME }}
          save: false
      - name: Run all unit and controller tests
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            develop --no-write-lock-file path:. --command \
            pytest -ra --junitxml="$CI_OUTPUT_DIR/pytest.xml"
      - name: Find the test report
        id: report
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$CI_OUTPUT_DIR/pytest.xml" ]]; then
            printf 'available=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain test results, including failures and skips
        if: >-
          ${{ !cancelled()
          && steps.report.outputs.available == 'true' }}
        uses: >-
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # v7.0.2
        with:
          name: unit-results-${{ github.run_attempt }}
          path: ${{ env.CI_OUTPUT_DIR }}/pytest.xml
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      windows-sha256: ${{ steps.windows.outputs.sha256 }}
      ad-sha256: ${{ steps.ad.outputs.sha256 }}
      windows-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
      ad-artifact-id: ${{ steps.upload-ad.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Privileged cache extraction must not create directories in the checkout.
      - name: Prepare runner-owned work directories
        run: |
          mkdir -p "$RUNNER_TEMP/pre-commit" "$RUNNER_TEMP/legacy-windows-ci"
          printf 'PRE_COMMIT_HOME=%s\n' "$RUNNER_TEMP/pre-commit" \
            >> "$GITHUB_ENV"
          printf 'CI_OUTPUT_DIR=%s\n' "$RUNNER_TEMP/legacy-windows-ci" \
            >> "$GITHUB_ENV"
      - uses: >-
          cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        # v31.11.1
      - uses: >-
          nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        # v7.0.2
        with:
          primary-key: >-
            nix-${{ runner.os }}-${{
            hashFiles('flake.lock', 'flake.nix', '.pre-commit-config.yaml') }}
          paths: ${{ env.PRE_COMMIT_HOME }}
          save: false
      - name: Build and verify both exact collection archives
        id: package
        run: |
          nix_dev=(nix --extra-experimental-features 'nix-command flakes'
            develop --no-write-lock-file path:. --command)
          "${nix_dev[@]}" just build
          shopt -s nullglob
          windows=(dist/sustainablelobster-legacy_windows-*.tar.gz)
          ad=(dist/sustainablelobster-legacy_ad-*.tar.gz)
          if (( ${#windows[@]} != 1 || ${#ad[@]} != 1 )); then
            echo 'Expected exactly one archive for each collection.' >&2
            exit 1
          fi
          "${nix_dev[@]}" python scripts/check_collection.py \
            --artifact "${windows[0]}" --artifact "${ad[0]}"
          printf 'windows-archive=%s\nad-archive=%s\n' \
            "${windows[0]}" "${ad[0]}" >> "$GITHUB_OUTPUT"
      - name: Prepare the verified Windows candidate
        id: windows
        env:
          ARCHIVE: ${{ steps.package.outputs.windows-archive }}
        run: |
          nix_dev=(nix --extra-experimental-features 'nix-command flakes'
            develop --no-write-lock-file path:. --command)
          tag_args=()
          if [[ "$GITHUB_EVENT_NAME" == push \
              && "$GITHUB_REF_TYPE" == tag \
              && "$GITHUB_REF_NAME" == legacy_windows/v* ]]; then
            tag_args=(--tag "$GITHUB_REF_NAME")
          fi
          "${nix_dev[@]}" python scripts/ci_release.py package \
            --collection legacy_windows --artifact "$ARCHIVE" \
            --output-dir "$CI_OUTPUT_DIR/legacy_windows" \
            "${tag_args[@]}"
      - name: Prepare the verified AD candidate
        id: ad
        env:
          ARCHIVE: ${{ steps.package.outputs.ad-archive }}
        run: |
          nix_dev=(nix --extra-experimental-features 'nix-command flakes'
            develop --no-write-lock-file path:. --command)
          tag_args=()
          if [[ "$GITHUB_EVENT_NAME" == push \
              && "$GITHUB_REF_TYPE" == tag \
              && "$GITHUB_REF_NAME" == legacy_ad/v* ]]; then
            tag_args=(--tag "$GITHUB_REF_NAME")
          fi
          "${nix_dev[@]}" python scripts/ci_release.py package \
            --collection legacy_ad --artifact "$ARCHIVE" \
            --output-dir "$CI_OUTPUT_DIR/legacy_ad" \
            "${tag_args[@]}"
      - name: Retain only the verified Windows release package
        id: upload-windows
        env:
          RELEASE_FILENAME: ${{ steps.windows.outputs.filename }}
        uses: >-
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # v7.0.2
        with:
          name: legacy_windows-package-${{ github.run_attempt }}
          path: |
            ${{ env.CI_OUTPUT_DIR }}/legacy_windows/${{ env.RELEASE_FILENAME }}
            ${{ env.CI_OUTPUT_DIR }}/legacy_windows/SHA256SUMS
            ${{ env.CI_OUTPUT_DIR }}/legacy_windows/release-notes.txt
            ${{ env.CI_OUTPUT_DIR }}/legacy_windows/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain only the verified AD release package
        id: upload-ad
        env:
          RELEASE_FILENAME: ${{ steps.ad.outputs.filename }}
        uses: >-
          actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        # v7.0.2
        with:
          name: legacy_ad-package-${{ github.run_attempt }}
          path: |
            ${{ env.CI_OUTPUT_DIR }}/legacy_ad/${{ env.RELEASE_FILENAME }}
            ${{ env.CI_OUTPUT_DIR }}/legacy_ad/SHA256SUMS
            ${{ env.CI_OUTPUT_DIR }}/legacy_ad/release-notes.txt
            ${{ env.CI_OUTPUT_DIR }}/legacy_ad/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged collections
    needs: [lint, unit, package]
    if: >-
      github.repository == 'sustainablelobster/ansible-legacy-windows'
      && github.event_name == 'push'
      && (startsWith(github.ref, 'refs/tags/legacy_windows/v')
      || startsWith(github.ref, 'refs/tags/legacy_ad/v'))
      && needs.lint.result == 'success'
      && needs.unit.result == 'success'
      && needs.package.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare runner-owned work directories
        run: |
          mkdir -p "$RUNNER_TEMP/pre-commit" "$RUNNER_TEMP/legacy-windows-ci"
          printf 'PRE_COMMIT_HOME=%s\n' "$RUNNER_TEMP/pre-commit" \
            >> "$GITHUB_ENV"
          printf 'CI_OUTPUT_DIR=%s\n' "$RUNNER_TEMP/legacy-windows-ci" \
            >> "$GITHUB_ENV"
      - uses: >-
          cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        # v31.11.1
      - name: Download the Windows package verified by this run
        uses: >-
          actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.windows-artifact-id }}
          path: ${{ env.CI_OUTPUT_DIR }}/legacy_windows
          merge-multiple: true
          digest-mismatch: error
      - name: Download the AD package verified by this run
        uses: >-
          actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.ad-artifact-id }}
          path: ${{ env.CI_OUTPUT_DIR }}/legacy_ad
          merge-multiple: true
          digest-mismatch: error
      - name: Publish tagged collections in dependency order without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
          WINDOWS_SHA256: ${{ needs.package.outputs.windows-sha256 }}
          AD_SHA256: ${{ needs.package.outputs.ad-sha256 }}
        run: |
          if [[ -z "${GALAXY_API_KEY//[[:space:]]/}" ]]; then
            echo 'GALAXY_API_KEY repository secret is required.' >&2
            exit 1
          fi
          nix_dev=(nix --extra-experimental-features 'nix-command flakes'
            develop --no-write-lock-file path:. --command)
          "${nix_dev[@]}" python scripts/ci_release.py publish-tagged \
            --windows-package-dir "$CI_OUTPUT_DIR/legacy_windows" \
            --windows-sha256 "$WINDOWS_SHA256" \
            --ad-package-dir "$CI_OUTPUT_DIR/legacy_ad" \
            --ad-sha256 "$AD_SHA256"
