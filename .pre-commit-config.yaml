---
minimum_pre_commit_version: '4.4.0'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# Revisions pin upstream hook definitions; flake.lock pins tool executables.
# Unsupported-language hooks use those executables without extra environments.
# Controller version arguments match ansible-core's Requires-Python minimum.
# Recheck them when updating Ansible; they do not select an interpreter.
repos:
  - repo: local
    hooks:
      - id: prepare-collection-imports
        name: Prepare offline collection imports
        entry: just _install-lint-collections
        language: unsupported
        always_run: true
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        language: unsupported
      - id: check-case-conflict
        language: unsupported
      - id: check-executables-have-shebangs
        language: unsupported
      - id: check-illegal-windows-names
      - id: check-merge-conflict
        language: unsupported
      - id: check-shebang-scripts-are-executable
        language: unsupported
        # Ansible invokes these through Python, not as standalone executables.
        exclude: >-
          (?x)^(?:legacy_windows|legacy_ad|legacy_community_windows)
          /plugins/modules/[^/]+\.py$
          |^legacy_windows/plugins/module_utils/legacy_windows_async_wrapper\.py$
      - id: check-symlinks
        language: unsupported
      - id: destroyed-symlinks
        language: unsupported
      - id: fix-byte-order-marker
        language: unsupported
      - id: check-json
        language: unsupported
        files: (\.json$|^flake\.lock$)
        types: [file]
      - id: check-toml
        language: unsupported
      - id: check-yaml
        language: unsupported
      - id: detect-private-key
        language: unsupported
      - id: trailing-whitespace
        language: unsupported
      - id: end-of-file-fixer
        language: unsupported
        # Preserve the final blank line in the verbatim upstream GPL copies.
        exclude: >-
          (?x)^(LICENSE
          |(legacy_windows|legacy_ad|legacy_community_windows)/LICENSE
          |legacy_windows/LICENSES/ansible-windows-GPL-3\.0-or-later\.txt
          |legacy_ad/LICENSES/microsoft-ad-GPL-3\.0-or-later\.txt
          |legacy_community_windows/LICENSES/community-windows-GPL-3\.0-or-later\.txt)$
      - id: mixed-line-ending
        language: unsupported
        args: [--fix=lf]

  - repo: https://github.com/NixOS/nixfmt
    rev: v1.5.0
    hooks:
      - id: nixfmt
        language: unsupported

  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        language: unsupported

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.1.0
    hooks:
      - id: black
        alias: black-target
        name: Format Windows target Python
        language: unsupported
        # Windows fixtures, including win_powershell.py, share the target floor.
        files: >-
          (?x)^((?:legacy_windows|legacy_ad|legacy_community_windows)
          /plugins/(modules|module_utils)
          |tests/integration/fixtures)/
        # psexec executes on the controller, with controller-only dependencies.
        exclude: ^legacy_community_windows/plugins/modules/psexec\.py$
        args: [--target-version, py34]
      - id: black
        alias: black-controller
        name: Format controller Python
        language: unsupported
        files: >-
          (?x)^(?:legacy_windows|legacy_ad|legacy_community_windows)
          /plugins/(?!modules/|module_utils/).*\.py$
          |^legacy_community_windows/plugins/modules/psexec\.py$
        args: [--target-version, py312]
      - id: black
        alias: black-development
        name: Format development Python
        language: unsupported
        files: ^(scripts|tests)/.*\.py$
        exclude: ^tests/integration/fixtures/

  - repo: https://github.com/PyCQA/pylint
    rev: v4.0.5
    hooks:
      - id: pylint
        alias: pylint-target
        name: Lint Windows target Python
        entry: env PYTHONPATH=.ansible/collections pylint
        language: unsupported
        files: >-
          (?x)^((?:legacy_windows|legacy_ad|legacy_community_windows)
          /plugins/(modules|module_utils)
          |tests/integration/fixtures)/
        # psexec executes on the controller, with controller-only dependencies.
        exclude: ^legacy_community_windows/plugins/modules/psexec\.py$
        args: [--py-version, '3.4']
      - id: pylint
        alias: pylint-controller
        name: Lint controller Python
        entry: env PYTHONPATH=.ansible/collections pylint
        language: unsupported
        files: >-
          (?x)^(?:legacy_windows|legacy_ad|legacy_community_windows)
          /plugins/(?!modules/|module_utils/).*\.py$
          |^legacy_community_windows/plugins/modules/psexec\.py$
        args: [--py-version, '3.12']
      - id: pylint
        alias: pylint-development
        name: Lint development Python
        entry: env PYTHONPATH=.ansible/collections pylint
        language: unsupported
        files: ^(scripts|tests)/.*\.py$
        exclude: ^tests/integration/fixtures/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.1
    hooks:
      - id: mypy
        alias: mypy-controller
        name: Type-check controller Python
        entry: env MYPYPATH=.ansible/collections mypy
        language: unsupported
        files: >-
          (?x)^(?:legacy_windows|legacy_ad|legacy_community_windows)
          /plugins/(?!modules/|module_utils/).*\.py$
          |^legacy_community_windows/plugins/modules/psexec\.py$
        args: [--python-version, '3.12']
      - id: mypy
        alias: mypy-development
        name: Type-check development Python
        entry: env MYPYPATH=.ansible/collections mypy
        language: unsupported
        files: ^(scripts|tests)/.*\.py$
        exclude: ^tests/integration/fixtures/
        args: []

  - repo: https://github.com/netromdk/vermin
    rev: v1.8.0
    hooks:
      - id: vermin
        name: Check Windows target Python compatibility
        language: unsupported
        files: >-
          (?x)^((?:legacy_windows|legacy_ad|legacy_community_windows)
          /plugins/(modules|module_utils)
          |tests/integration/fixtures)/
        # psexec executes on the controller, with controller-only dependencies.
        exclude: ^legacy_community_windows/plugins/modules/psexec\.py$
        args: [-t=3.4-, --violations]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        language: unsupported
        args: [--strict, --config-file, .yamllint.yml]

  - repo: https://github.com/ansible/ansible-lint
    rev: v25.8.2
    hooks:
      - id: ansible-lint
        language: unsupported
        # Refresh the checkout's local installation before offline linting.
        entry: just _ansible-lint
        args: [--offline]
        additional_dependencies: []
        # Documentation and unit-test-only edits do not change
        # Ansible interfaces.
        always_run: false
        files: >-
          (?x)(^((?:legacy_windows|legacy_ad|legacy_community_windows)/plugins)/
          |\.ya?ml$|^justfile$)
        # GitHub workflow YAML is checked by actionlint, not Ansible-lint.
        exclude: ^\.github/workflows/[^/]+\.ya?ml$
        require_serial: true

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.1.94
    hooks:
      - id: rumdl
        language: unsupported
        args: [--config, pyproject.toml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        language: unsupported

  - repo: local
    hooks:
      - id: actionlint
        name: Check GitHub Actions workflows
        entry: actionlint
        language: unsupported
        files: ^\.github/workflows/[^/]+\.ya?ml$
        require_serial: true
      - id: justfile
        name: Check Justfile format and syntax
        entry: just _lint-justfile
        language: unsupported
        files: ^justfile$
        pass_filenames: false
